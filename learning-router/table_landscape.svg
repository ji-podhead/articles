<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="1100" height="520" fill="#0f172a"/>

  <text x="550" y="42" fill="#e2e8f0" font-size="18" text-anchor="middle" font-weight="bold">Static scheduler vs learning economy</text>

  <!-- header -->
  <rect x="40" y="70" width="280" height="46" fill="#1e293b"/>
  <text x="60" y="99" fill="#e2e8f0" font-size="14" font-weight="bold">Aspect</text>
  <rect x="320" y="70" width="360" height="46" fill="#1e293b"/>
  <text x="340" y="99" fill="#e2e8f0" font-size="14" font-weight="bold">LiteLLM Router (static policy)</text>
  <rect x="680" y="70" width="380" height="46" fill="#1e293b"/>
  <text x="700" y="99" fill="#e2e8f0" font-size="14" font-weight="bold">JiMesh router (learning economy)</text>

  <!-- row: selection -->
  <rect x="40" y="116" width="280" height="72" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="60" y="148" fill="#f1f5f9" font-size="13" font-weight="bold">Selection</text>
  <rect x="320" y="116" width="360" height="72" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="340" y="146" fill="#f1f5f9" font-size="12">weighted shuffle (rpm/tpm), least-busy,</text>
  <text x="340" y="166" fill="#94a3b8" font-size="12">latency-, usage-, cost-based strategies</text>
  <rect x="680" y="116" width="380" height="72" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="700" y="146" fill="#f1f5f9" font-size="12">decayed per-model posteriors + exploration,</text>
  <text x="700" y="166" fill="#94a3b8" font-size="12">blended 0.7×bandit + 0.3×user preference</text>

  <!-- row: cooldown -->
  <rect x="40" y="188" width="280" height="72" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="60" y="220" fill="#f1f5f9" font-size="13" font-weight="bold">429 response</text>
  <rect x="320" y="188" width="360" height="72" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="340" y="216" fill="#f1f5f9" font-size="12">immediate cooldown, 5 seconds default</text>
  <text x="340" y="236" fill="#94a3b8" font-size="12">same for free and paid deployments</text>
  <rect x="680" y="188" width="380" height="72" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="700" y="216" fill="#f1f5f9" font-size="12">cost-scaled: free 5s · $0.5 30s · $3 60s · 5min</text>
  <text x="700" y="236" fill="#94a3b8" font-size="12">402 → 24h bench (only extends, never shortens)</text>

  <!-- row: quota -->
  <rect x="40" y="260" width="280" height="72" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="60" y="292" fill="#f1f5f9" font-size="13" font-weight="bold">Quota knowledge</text>
  <rect x="320" y="260" width="360" height="72" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="340" y="288" fill="#f1f5f9" font-size="12">rpm/tpm limits you configure yourself;</text>
  <text x="340" y="308" fill="#94a3b8" font-size="12">headers not parsed into a quota model</text>
  <rect x="680" y="260" width="380" height="72" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="700" y="288" fill="#f1f5f9" font-size="12">x-ratelimit-* parsed per vendor with</text>
  <text x="700" y="308" fill="#94a3b8" font-size="12">confidence model + shared-pool inference</text>

  <!-- row: cost ordering -->
  <rect x="40" y="332" width="280" height="72" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="60" y="364" fill="#f1f5f9" font-size="13" font-weight="bold">Free vs paid</text>
  <rect x="320" y="332" width="360" height="72" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="340" y="360" fill="#f1f5f9" font-size="12">order/priority parameters per deployment —</text>
  <text x="340" y="380" fill="#94a3b8" font-size="12">operator must encode the preference</text>
  <rect x="680" y="332" width="380" height="72" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="700" y="360" fill="#f1f5f9" font-size="12">free-first failover as ordering principle:</text>
  <text x="700" y="380" fill="#94a3b8" font-size="12">paid key never picked while free key is healthy</text>

  <!-- row: state -->
  <rect x="40" y="404" width="280" height="72" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="60" y="436" fill="#f1f5f9" font-size="13" font-weight="bold">State &amp; maturity</text>
  <rect x="320" y="404" width="360" height="72" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="340" y="432" fill="#86efac" font-size="12">✓ battle-tested, Redis-shared across instances,</text>
  <text x="340" y="452" fill="#94a3b8" font-size="12">mature per-error retry policies</text>
  <rect x="680" y="404" width="380" height="72" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="700" y="432" fill="#fbbf24" font-size="12">✓ learns provider drift via decay; in-memory state</text>
  <text x="700" y="452" fill="#94a3b8" font-size="12">(restart re-learns — honest limit)</text>

  <line x1="40" y1="496" x2="1060" y2="496" stroke="#334155" stroke-width="1"/>
  <text x="550" y="512" fill="#475569" font-size="10" text-anchor="middle">LiteLLM: docs.litellm.ai/docs/routing (verified Sep 8, 2026) · jimesh: internal/router + internal/keypool + internal/quota</text>
</svg>
