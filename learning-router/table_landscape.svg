<svg xmlns="http://www.w3.org/2000/svg" width="939" height="714" viewBox="0 0 939 714" font-family="DejaVu Sans, Verdana, sans-serif">
<rect width="939" height="714" fill="#0d1117"/>
<text x="30" y="52" font-size="30" font-weight="bold" fill="#ffffff">Static scheduler vs learning economy</text>
<rect x="30" y="104" width="181" height="45" fill="#1c2128" stroke="#30363d"/>
<text x="46" y="118" font-size="15" font-weight="bold" fill="#ffffff">Aspect</text>
<rect x="211" y="104" width="349" height="45" fill="#1c2128" stroke="#30363d"/>
<text x="227" y="118" font-size="15" font-weight="bold" fill="#ffffff">LiteLLM Router (static policy)</text>
<rect x="560" y="104" width="349" height="45" fill="#1c2128" stroke="#30363d"/>
<text x="576" y="118" font-size="15" font-weight="bold" fill="#ffffff">JiMesh router (learning economy)</text>
<rect x="30" y="149" width="181" height="108" fill="none" stroke="#30363d"/>
<text x="46" y="163" font-size="15" font-weight="bold" fill="#ffffff">Selection</text>
<rect x="211" y="149" width="349" height="108" fill="none" stroke="#30363d"/>
<text x="227" y="163" font-size="15" fill="#c9d1d9">weighted shuffle (rpm/tpm),</text>
<text x="227" y="184" font-size="15" fill="#c9d1d9">least-busy,</text>
<text x="227" y="205" font-size="15" fill="#c9d1d9">latency-, usage-, cost-based</text>
<text x="227" y="226" font-size="15" fill="#c9d1d9">strategies</text>
<rect x="560" y="149" width="349" height="108" fill="none" stroke="#30363d"/>
<text x="576" y="163" font-size="15" fill="#c9d1d9">decayed per-model posteriors +</text>
<text x="576" y="184" font-size="15" fill="#c9d1d9">exploration,</text>
<text x="576" y="205" font-size="15" fill="#c9d1d9">blended 0.7×bandit + 0.3×user</text>
<text x="576" y="226" font-size="15" fill="#c9d1d9">preference</text>
<rect x="30" y="257" width="181" height="108" fill="#11161d"/>
<rect x="30" y="257" width="181" height="108" fill="none" stroke="#30363d"/>
<text x="46" y="271" font-size="15" font-weight="bold" fill="#ffffff">429 response</text>
<rect x="211" y="257" width="349" height="108" fill="#11161d"/>
<rect x="211" y="257" width="349" height="108" fill="none" stroke="#30363d"/>
<text x="227" y="271" font-size="15" fill="#c9d1d9">immediate cooldown, 5 seconds</text>
<text x="227" y="292" font-size="15" fill="#c9d1d9">default</text>
<text x="227" y="313" font-size="15" fill="#c9d1d9">same for free and paid deployments</text>
<rect x="560" y="257" width="349" height="108" fill="#11161d"/>
<rect x="560" y="257" width="349" height="108" fill="none" stroke="#30363d"/>
<text x="576" y="271" font-size="15" fill="#c9d1d9">cost-scaled: free 5s · $0.5 30s ·</text>
<text x="576" y="292" font-size="15" fill="#c9d1d9">$3 60s · 5min</text>
<text x="576" y="313" font-size="15" fill="#c9d1d9">402 → 24h bench (only extends,</text>
<text x="576" y="334" font-size="15" fill="#c9d1d9">never shortens)</text>
<rect x="30" y="365" width="181" height="108" fill="none" stroke="#30363d"/>
<text x="46" y="379" font-size="15" font-weight="bold" fill="#ffffff">Quota knowledge</text>
<rect x="211" y="365" width="349" height="108" fill="none" stroke="#30363d"/>
<text x="227" y="379" font-size="15" fill="#c9d1d9">rpm/tpm limits you configure</text>
<text x="227" y="400" font-size="15" fill="#c9d1d9">yourself;</text>
<text x="227" y="421" font-size="15" fill="#c9d1d9">headers not parsed into a quota</text>
<text x="227" y="442" font-size="15" fill="#c9d1d9">model</text>
<rect x="560" y="365" width="349" height="108" fill="none" stroke="#30363d"/>
<text x="576" y="379" font-size="15" fill="#c9d1d9">x-ratelimit-* parsed per vendor</text>
<text x="576" y="400" font-size="15" fill="#c9d1d9">with</text>
<text x="576" y="421" font-size="15" fill="#c9d1d9">confidence model + shared-pool</text>
<text x="576" y="442" font-size="15" fill="#c9d1d9">inference</text>
<rect x="30" y="473" width="181" height="108" fill="#11161d"/>
<rect x="30" y="473" width="181" height="108" fill="none" stroke="#30363d"/>
<text x="46" y="487" font-size="15" font-weight="bold" fill="#ffffff">Free vs paid</text>
<rect x="211" y="473" width="349" height="108" fill="#11161d"/>
<rect x="211" y="473" width="349" height="108" fill="none" stroke="#30363d"/>
<text x="227" y="487" font-size="15" fill="#c9d1d9">order/priority parameters per</text>
<text x="227" y="508" font-size="15" fill="#c9d1d9">deployment -</text>
<text x="227" y="529" font-size="15" fill="#c9d1d9">operator must encode the</text>
<text x="227" y="550" font-size="15" fill="#c9d1d9">preference</text>
<rect x="560" y="473" width="349" height="108" fill="#11161d"/>
<rect x="560" y="473" width="349" height="108" fill="none" stroke="#30363d"/>
<text x="576" y="487" font-size="15" fill="#c9d1d9">free-first failover as ordering</text>
<text x="576" y="508" font-size="15" fill="#c9d1d9">principle:</text>
<text x="576" y="529" font-size="15" fill="#c9d1d9">paid key never picked while free</text>
<text x="576" y="550" font-size="15" fill="#c9d1d9">key is healthy</text>
<rect x="30" y="581" width="181" height="87" fill="none" stroke="#30363d"/>
<text x="46" y="595" font-size="15" font-weight="bold" fill="#ffffff">State &amp; maturity</text>
<rect x="211" y="581" width="349" height="87" fill="none" stroke="#30363d"/>
<text x="227" y="595" font-size="15" fill="#c9d1d9">✓ battle-tested, Redis-shared</text>
<text x="227" y="616" font-size="15" fill="#c9d1d9">across instances,</text>
<text x="227" y="637" font-size="15" fill="#c9d1d9">mature per-error retry policies</text>
<rect x="560" y="581" width="349" height="87" fill="none" stroke="#30363d"/>
<text x="576" y="595" font-size="15" fill="#c9d1d9">✓ learns provider drift via decay;</text>
<text x="576" y="616" font-size="15" fill="#c9d1d9">in-memory state</text>
<text x="576" y="637" font-size="15" fill="#c9d1d9">(restart re-learns - honest limit)</text>
<text x="30" y="682" font-size="13" fill="#8b949e">LiteLLM: docs.litellm.ai/docs/routing (verified Sep 8, 2026) - jimesh: internal/router + internal/keypool + internal/quota</text>
</svg>