<text x="355" y="178" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Beta posterior over success/failure · decayed</text>
<text x="355" y="199" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">exponentially, 2-day half-life (lazy, on touch)</text>
<text x="355" y="220" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">score = 0.6 × reliability + 0.4 × speed (1s →</text>
