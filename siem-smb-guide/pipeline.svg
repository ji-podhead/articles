<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 320" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>
  <rect width="1050" height="320" fill="#f8fafc" rx="12"/>

  <text x="525" y="32" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">How a SIEM actually works — the seven stages nobody shows you</text>

  <!-- Row 1: sources -->
  <text x="40" y="58" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold">1 · COLLECT</text>
  <rect x="40" y="70" width="130" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="105" y="94" fill="#334155" font-family="sans-serif" font-size="11" text-anchor="middle">Logs</text>
  <text x="105" y="110" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">app · proxy · agents</text>

  <rect x="180" y="70" width="130" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="245" y="94" fill="#334155" font-family="sans-serif" font-size="11" text-anchor="middle">Network</text>
  <text x="245" y="110" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">flow · eve.json · IDS</text>

  <rect x="320" y="70" width="130" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="385" y="94" fill="#334155" font-family="sans-serif" font-size="11" text-anchor="middle">Identity</text>
  <text x="385" y="110" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">auth events · API audit</text>

  <rect x="460" y="70" width="130" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="525" y="94" fill="#334155" font-family="sans-serif" font-size="11" text-anchor="middle">Runtime</text>
  <text x="525" y="110" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">syscalls (eBPF/Falco)</text>

  <rect x="600" y="70" width="130" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="665" y="94" fill="#334155" font-family="sans-serif" font-size="11" text-anchor="middle">Posture</text>
  <text x="665" y="110" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">IaC scan · config state</text>

  <line x1="730" y1="100" x2="760" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: normalize -->
  <rect x="760" y="70" width="250" height="60" rx="6" fill="#1e293b" stroke="#0f172a" filter="url(#shadow)"/>
  <text x="885" y="94" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">2 · Normalize (one schema)</text>
  <text x="885" y="114" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">OCSF / ASFF / your own schema</text>

  <line x1="885" y1="130" x2="885" y2="152" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 3: detect -->
  <rect x="600" y="152" width="180" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="690" y="176" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">3 · Detect — rules</text>
  <text x="690" y="196" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">signatures · regex · FIM checks</text>

  <rect x="790" y="152" width="220" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="900" y="176" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">4 · Detect — ML/behavior</text>
  <text x="900" y="194" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">baselines · anomaly scores</text>
  <text x="900" y="208" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">carries confidence + model version</text>

  <!-- Correlate -->
  <line x1="690" y1="222" x2="690" y2="244" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="222" x2="900" y2="244" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="560" y="244" width="450" height="60" rx="6" fill="#1e293b" stroke="#0f172a" filter="url(#shadow)"/>
  <text x="785" y="264" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">5 · Correlate + attribute</text>
  <text x="785" y="281" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">container/workload → session → app  (the attribution chain)</text>
  <text x="785" y="296" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">chained events within seconds = one incident, not three separate alerts</text>

  <!-- Row 4: alert → triage → respond -->
  <line x1="560" y1="282" x2="520" y2="282" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="252" width="220" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="410" y="276" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">6 · Alert → triage (HITL)</text>
  <text x="410" y="296" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">risk-score ranked queue · operator decides</text>

  <line x1="300" y1="282" x2="270" y2="282" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="252" width="230" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="155" y="276" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">7 · Respond + retain</text>
  <text x="155" y="296" fill="#16a34a" font-family="monospace" font-size="8" text-anchor="middle">block → isolate → revoke · long-term store</text>

  <text x="40" y="150" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold">WASN'T</text>
  <text x="40" y="168" fill="#64748b" font-family="sans-serif" font-size="10">A SIEM is not a scanner.</text>
  <text x="40" y="184" fill="#64748b" font-family="sans-serif" font-size="10">It is a correlate-and-retain</text>
  <text x="40" y="200" fill="#64748b" font-family="sans-serif" font-size="10">engine over EVERY log source</text>
  <text x="40" y="216" fill="#64748b" font-family="sans-serif" font-size="10">— with the alert as the output,</text>
  <text x="40" y="232" fill="#64748b" font-family="sans-serif" font-size="10">not the feature.</text>
</svg>
