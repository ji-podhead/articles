<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="763" viewBox="0 0 1200 763" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="763" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">How a SIEM actually works - the seven stages nobody shows you</text>
<text x="40" y="83" font-size="13" font-weight="bold" fill="#8b949e">1 · COLLECT</text>
<rect x="51" y="118" width="210" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="69" y="144" font-size="15" font-weight="bold" fill="#8b949e">Logs</text>
<text x="69" y="165" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">app · proxy · agents</text>
<rect x="273" y="118" width="210" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="291" y="144" font-size="15" font-weight="bold" fill="#8b949e">Network</text>
<text x="291" y="165" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">flow · eve.json · IDS</text>
<rect x="495" y="118" width="210" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="513" y="144" font-size="15" font-weight="bold" fill="#8b949e">Identity</text>
<text x="513" y="165" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">auth events · API audit</text>
<rect x="717" y="118" width="210" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="735" y="144" font-size="15" font-weight="bold" fill="#8b949e">Runtime</text>
<text x="735" y="165" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">syscalls (eBPF/Falco)</text>
<rect x="939" y="118" width="210" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="957" y="144" font-size="15" font-weight="bold" fill="#8b949e">Posture</text>
<text x="957" y="165" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">IaC scan · config state</text>
<rect x="447" y="206" width="306" height="66" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="447" y="206" width="5" height="66" rx="2.5" fill="#60a5fa"/>
<text x="465" y="232" font-size="15" font-weight="bold" fill="#60a5fa">2 · Normalize (one schema)</text>
<text x="465" y="253" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">OCSF / ASFF / your own schema</text>
<rect x="258" y="294" width="325" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="276" y="320" font-size="15" font-weight="bold" fill="#8b949e">3 · Detect - rules</text>
<text x="276" y="341" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">signatures · regex · FIM checks</text>
<rect x="603" y="294" width="340" height="87" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="621" y="320" font-size="15" font-weight="bold" fill="#8b949e">4 · Detect - ML/behavior</text>
<text x="621" y="341" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">baselines · anomaly scores</text>
<text x="621" y="362" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">carries confidence + model version</text>
<rect x="290" y="403" width="620" height="87" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="290" y="403" width="5" height="87" rx="2.5" fill="#60a5fa"/>
<text x="308" y="429" font-size="15" font-weight="bold" fill="#60a5fa">5 · Correlate + attribute</text>
<text x="308" y="450" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">container/workload → session → app (the attribution chain)</text>
<text x="308" y="471" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">chained events within seconds = one incident, not three separate alerts</text>
<rect x="220" y="512" width="360" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="238" y="538" font-size="15" font-weight="bold" fill="#8b949e">6 · Alert → triage (HITL)</text>
<text x="238" y="559" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">risk-score ranked queue · operator decides</text>
<rect x="600" y="512" width="380" height="66" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="600" y="512" width="5" height="66" rx="2.5" fill="#4ade80"/>
<text x="618" y="538" font-size="15" font-weight="bold" fill="#4ade80">7 · Respond + retain</text>
<text x="618" y="559" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">block → isolate → revoke · long-term store</text>
<rect x="40" y="600" width="340" height="129" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="626" font-size="15" font-weight="bold" fill="#8b949e">WASN'T</text>
<text x="58" y="647" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">A SIEM is not a scanner. It is a</text>
<text x="58" y="668" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">correlate-and-retain engine over EVERY</text>
<text x="58" y="689" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">log source - with the alert as the output,</text>
<text x="58" y="710" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">not the feature.</text>
