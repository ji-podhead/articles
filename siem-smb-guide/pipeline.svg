<polyline points="773,369 600,387" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="600,474 400,492" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="580,525 600,525" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
</svg>