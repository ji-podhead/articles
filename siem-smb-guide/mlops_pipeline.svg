<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 260" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>
  <rect width="1050" height="260" fill="#f8fafc" rx="12"/>

  <text x="525" y="18" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">Anomaly detection as a managed lifecycle, not a one-off script</text>

  <!-- Step chain -->
  <rect x="30" y="70" width="150" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="105" y="98" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">1. Features</text>
  <text x="105" y="116" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">gateway/app logs:</text>
  <text x="105" y="130" fill="#0284c7" font-family="monospace" font-size="9" text-anchor="middle">bytes_sent_rolling</text>
  <text x="105" y="143" fill="#0284c7" font-family="monospace" font-size="9" text-anchor="middle">unique_dest_ips_10m</text>

  <line x1="160" y1="110" x2="190" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="190" y="70" width="140" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="260" y="98" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">2. Training</text>
  <text x="260" y="116" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Isolation Forest /</text>
  <text x="260" y="130" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Random Cut Forest</text>
  <text x="260" y="144" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">SageMaker / MLflow</text>

  <line x1="330" y1="110" x2="360" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="360" y="70" width="140" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="430" y="98" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">3. Evaluation</text>
  <text x="430" y="116" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">F1 · false-positive rate</text>
  <text x="430" y="136" fill="#dc2626" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">FPR &lt; 1% gate</text>

  <line x1="500" y1="110" x2="530" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="530" y="70" width="150" height="80" rx="6" fill="#1e293b" stroke="#0f172a" filter="url(#shadow)"/>
  <text x="605" y="98" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">4. Model Registry</text>
  <text x="605" y="116" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">v1.0.0</text>
  <text x="605" y="136" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">pending manual</text>
  <text x="605" y="148" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">approval (HITL)</text>

  <line x1="680" y1="110" x2="710" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="710" y="70" width="150" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="785" y="98" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">5. Endpoint</text>
  <text x="785" y="116" fill="#0284c7" font-family="monospace" font-size="10" text-anchor="middle">{anomaly_score:0.89}</text>
  <text x="785" y="136" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">realtime inference</text>

  <line x1="860" y1="110" x2="890" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="890" y="70" width="140" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="960" y="98" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">6. Model Monitor</text>
  <text x="960" y="116" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">live vs. training</text>
  <text x="960" y="130" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">distribution</text>
  <text x="960" y="144" fill="#dc2626" font-family="sans-serif" font-size="9" text-anchor="middle">data drift alarm</text>

  <!-- Retrain loop -->
  <path d="M 960 70 L 960 52 L 105 52 L 105 70" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530" y="46" fill="#dc2626" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">continuous retrain — legitimate behavior changes must not break the model</text>

  <!-- Bottom note -->
  <rect x="30" y="180" width="1000" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="530" y="204" fill="#334155" font-family="sans-serif" font-size="11" text-anchor="middle">Findings carry confidence + model_version and ADD to the rule layer — they never replace it</text>
  <text x="530" y="224" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">AWS: GuardDuty ML (black-box) · SageMaker (custom) · Bedrock (triage)  |  OSS: OpenSearch ML Commons · MLflow · Feast</text>
</svg>
