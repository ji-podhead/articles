<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="506" viewBox="0 0 1200 506" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="506" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">Controlling traffic: ports, IP allowlists, and the WAF layer</text>
<rect x="40" y="70" width="250" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="96" font-size="15" font-weight="bold" fill="#8b949e">Client / Internet</text>
<text x="58" y="117" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">bots · scanners · users</text>
<rect x="314" y="70" width="430" height="213" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="332" y="96" font-size="15" font-weight="bold" fill="#8b949e">Edge: firewall + WAF</text>
<text x="332" y="117" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">firewall: only required ports open (443)</text>
<text x="332" y="138" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">source-IP allowlist (VPN / Tailscale CIDR) for admin</text>
<text x="332" y="159" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">ports</text>
<text x="332" y="180" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">WAF: OWASP CRS · rate limits · geo/IP · bot control</text>
<text x="332" y="201" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">classic pitfall: a published container port bypasses</text>
<text x="332" y="222" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">host firewall</text>
<text x="332" y="243" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">via Docker NAT - always check from OUTSIDE the</text>
<text x="332" y="264" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">host</text>
<rect x="768" y="70" width="350" height="150" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="786" y="96" font-size="15" font-weight="bold" fill="#8b949e">Application / gateway</text>
<text x="786" y="117" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">checks identity (minted sessions),</text>
<text x="786" y="138" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">inspects payload (secret scanner),</text>
<text x="786" y="159" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">enforces per-user rate limits</text>
<text x="786" y="180" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">the only point that sees fully</text>
<text x="786" y="201" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">decrypted content</text>
<rect x="305" y="301" width="500" height="87" rx="11" fill="#161b22" stroke="#f87171" stroke-width="2"/>
<rect x="305" y="301" width="5" height="87" rx="2.5" fill="#f87171"/>
<text x="323" y="327" font-size="15" font-weight="bold" fill="#f87171">Blocked &amp; logged</text>
<text x="323" y="348" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">a rejected connection is a log entry, never a silent drop -</text>
<text x="323" y="369" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">drops are what the SIEM correlates</text>
<rect x="829" y="301" width="334" height="66" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="829" y="301" width="5" height="66" rx="2.5" fill="#4ade80"/>
<text x="847" y="327" font-size="15" font-weight="bold" fill="#4ade80">Allowed → backend</text>
<text x="847" y="348" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">egress-allowlisted upstream only</text>
<rect x="40" y="406" width="1120" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="432" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Open source: nftables/ufw + Coraza or ModSecurity (OWASP CRS)</text>
<text x="58" y="453" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">AWS: Security Groups / NACLs + AWS WAF &amp; Shield</text>
<marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker>
<polyline points="290,103 314,177" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="744,177 768,145" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="943,220 996,301" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="529,283 555,301" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
</svg>