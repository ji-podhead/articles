<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1552" viewBox="0 0 1200 1552" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="1552" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">The two-stage AI security response: cheap detection, expensive</text>
<text x="40" y="94" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">thinking - only when it matters</text>
<text x="40" y="125" font-size="15" fill="#8b949e">Stage 1 = the always-on sorter · Stage 2 = the reasoning agent,</text>
<text x="40" y="145" font-size="15" fill="#8b949e">fired only when Stage 1 flags · edge-to-core triage</text>
<rect x="40" y="177" width="1120" height="45" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="40" y="177" width="5" height="45" rx="2.5" fill="#4ade80"/>
<text x="58" y="203" font-size="15" font-weight="bold" fill="#4ade80">STAGE 1 · DETECT - always-on, ~free</text>
<rect x="134" y="240" width="240" height="129" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="152" y="266" font-size="15" font-weight="bold" fill="#8b949e">Log streams</text>
<text x="152" y="287" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">egress drops · bytes_sent</text>
<text x="152" y="308" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">model invocations ·</text>
<text x="152" y="329" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">syscalls</text>
<text x="152" y="350" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">every event, 24/7</text>
<rect x="390" y="240" width="340" height="150" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="390" y="240" width="5" height="150" rx="2.5" fill="#4ade80"/>
<text x="408" y="266" font-size="15" font-weight="bold" fill="#4ade80">Anomaly detector - the sorter</text>
<text x="408" y="287" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">RCF / embeddings+KNN / SLM distills</text>
<text x="408" y="308" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">AWS: GuardDuty ML · OSS: ML</text>
<text x="408" y="329" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Commons</text>
<text x="408" y="350" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">statistical, not generative - pure math:</text>
<text x="408" y="371" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">&quot;pod B sends 400× its 14-day baseline&quot;</text>
<rect x="746" y="240" width="320" height="129" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="764" y="266" font-size="15" font-weight="bold" fill="#8b949e">Archive (normal path)</text>
<text x="764" y="287" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">the 99.9% of events that are</text>
<text x="764" y="308" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">business</text>
<text x="764" y="329" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">as usual. Long-term retention earns</text>
<text x="764" y="350" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">its keep here - nothing is dropped.</text>
<rect x="522" y="408" width="156" height="45" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="540" y="434" font-size="15" font-weight="bold" fill="#8b949e">anomaly?</text>
<rect x="40" y="471" width="1120" height="45" rx="11" fill="#161b22" stroke="#f87171" stroke-width="2"/>
<rect x="40" y="471" width="5" height="45" rx="2.5" fill="#f87171"/>
<text x="58" y="497" font-size="15" font-weight="bold" fill="#f87171">STAGE 2 · THINK + ACT - only on anomaly (LLM tokens spent here, nowhere else)</text>
<rect x="186" y="534" width="306" height="150" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="204" y="560" font-size="15" font-weight="bold" fill="#8b949e">Orchestration fires</text>
<text x="204" y="581" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">AWS: GuardDuty findings are</text>
<text x="204" y="602" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">EventBridge events →</text>
<text x="204" y="623" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Step Functions state machine</text>
<text x="204" y="644" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">OSS: alerting monitor watches</text>
<text x="204" y="665" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">the anomaly-results index</text>
<rect x="504" y="534" width="340" height="171" rx="11" fill="#161b22" stroke="#f87171" stroke-width="2"/>
<rect x="504" y="534" width="5" height="171" rx="2.5" fill="#f87171"/>
<text x="522" y="560" font-size="15" font-weight="bold" fill="#f87171">The thinker - reasoning agent</text>
<text x="522" y="581" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">2026 class: DeepSeek-R1 / Claude</text>
<text x="522" y="602" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">5-gen</text>
<text x="522" y="623" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">chain-of-thought before the verdict</text>
<text x="522" y="644" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">AWS: Bedrock Agent · OSS: agents-tools</text>
<text x="522" y="665" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">RAG over runbooks + context tools:</text>
<text x="522" y="686" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">IP rep · maintenance windows · identity</text>
<rect x="856" y="534" width="159" height="45" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="874" y="560" font-size="15" font-weight="bold" fill="#8b949e">real attack?</text>
<rect x="840" y="723" width="320" height="150" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="858" y="749" font-size="15" font-weight="bold" fill="#8b949e">False positive</text>
<text x="858" y="770" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">documented - and fed back:</text>
<text x="858" y="791" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">detector threshold + baseline retrain</text>
<text x="858" y="812" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">(the loop keeps the model alive</text>
<text x="858" y="833" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">when a sprint feature changes</text>
<text x="858" y="854" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">legitimate traffic patterns)</text>
<rect x="725" y="891" width="435" height="38" rx="9" fill="#0d1117" stroke="#f87171" stroke-width="1.5"/>
<text x="740" y="916" font-size="14.5" fill="#c9d1d9">false-positive feedback → threshold + retrain</text>
<rect x="46" y="947" width="360" height="171" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="64" y="973" font-size="15" font-weight="bold" fill="#8b949e">Why two stages (the cost math)</text>
<text x="64" y="994" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">RCF/ML over every event: ~$0, sub-ms,</text>
<text x="64" y="1015" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">24/7.</text>
<text x="64" y="1036" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">LLM triage: cents per call - spent only on</text>
<text x="64" y="1057" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">the ~0.1% of events the sorter flags.</text>
<text x="64" y="1078" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">An LLM on raw streams: too slow, too</text>
<text x="64" y="1099" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">expensive, too hallucination-prone.</text>
<rect x="420" y="947" width="460" height="171" rx="11" fill="#1c2128" stroke="#30363d" stroke-width="2"/>
<text x="438" y="973" font-size="15" font-weight="bold" fill="#e6edf3">Response - agent tool-calls (scoped Lambda)</text>
<text x="438" y="994" font-size="13.5" fill="#79c0ff" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">kernel-injection - live</text>
<text x="438" y="1015" font-size="13.5" fill="#79c0ff" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">action: inject_kernel_profile --target=ji-auth-pod</text>
<text x="438" y="1036" font-size="13.5" fill="#79c0ff" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">➔ network_layer: XDP_DROP [malicious_ip]</text>
<text x="438" y="1057" font-size="13.5" fill="#79c0ff" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">➔ syscall_layer: SIGKILL [unauthorized_binary]</text>
<text x="438" y="1078" font-size="13.5" fill="#79c0ff" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace"># process dies, container survives for forensics -</text>
<text x="438" y="1099" font-size="13.5" fill="#79c0ff" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">no app downtime</text>
<rect x="894" y="947" width="260" height="234" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="912" y="973" font-size="15" font-weight="bold" fill="#8b949e">Runtime sensor</text>
<text x="912" y="994" font-size="15" font-weight="bold" fill="#8b949e">(Falco/eBPF)</text>
<text x="912" y="1015" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">the sensor side of the loop:</text>
<text x="912" y="1036" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">syscalls per container,</text>
<text x="912" y="1057" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">container-attributed - the</text>
<text x="912" y="1078" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">same events that feed Stage</text>
<text x="912" y="1099" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">1 make the kill precise.</text>
<text x="912" y="1120" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">(Falco doubles as the OSS</text>
<text x="912" y="1141" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Stage-1 runtime source in</text>
<text x="912" y="1162" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">this architecture)</text>
<rect x="40" y="1199" width="1120" height="129" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="1225" font-size="15" font-weight="bold" fill="#8b949e">The guardrail that makes the automation safe</text>
<text x="58" y="1246" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">the agent gets a read-mostly tool catalog (query findings, read policies) - irreversible actions (kill a container, blackhole egress) stay</text>
<text x="58" y="1267" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">policy-gated or two-step.</text>
<text x="58" y="1288" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">every automated action writes an audit event. An ML finding always carries confidence + model_version and ADDS to the rule layer - it never</text>
<text x="58" y="1309" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">replaces it.</text>
<text x="40" y="1360" font-size="14" font-weight="bold" fill="#f87171">The LLM is the orchestrator, never the sensor.</text>
<text x="40" y="1403" font-size="12" fill="#8b949e">AWS chain: GuardDuty (incl. AI Protection) → EventBridge → Step Functions → Bedrock Agent → Lambda → eBPF   |</text>
<text x="40" y="1419" font-size="12" fill="#8b949e">OSS chain: ML Commons detector → results index → alerting → agents (plan-execute-reflect) → tool</text>
<text x="40" y="1462" font-size="12" fill="#8b949e">sources: docs.opensearch.org/latest/ml-commons-plugin/ · docs.aws.amazon.com/guardduty/latest/ug/ai-protection.html</text>
<text x="40" y="1505" font-size="12" fill="#8b949e">aws.amazon.com/blogs/machine-learning/automate-cloud-security-vulnerability-assessment-and-alerting-using-amazon-bedrock/</text>
<marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker>
<polyline points="374,305 390,315" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="560,390 600,408" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/></marker>
<polyline points="600,453 600,471" fill="none" stroke="#f87171" stroke-width="2.2" marker-end="url(#ar2)"/>
<rect x="512" y="450" width="175" height="25" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="600" y="465" font-size="13" fill="#8b949e" text-anchor="middle">YES → fire the agent</text>
<polyline points="492,609 504,620" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="844,620 856,557" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="936,579 1000,723" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="936,579 650,947" fill="none" stroke="#f87171" stroke-width="2.2" marker-end="url(#ar2)"/>
<rect x="697" y="751" width="191" height="25" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="793" y="766" font-size="13" fill="#8b949e" text-anchor="middle">yes → execute playbook</text>
</svg>