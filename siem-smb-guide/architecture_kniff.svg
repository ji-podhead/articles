<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 220" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>
  <rect width="1050" height="220" fill="#f8fafc" rx="12"/>

  <text x="525" y="38" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="17" text-anchor="middle">JiMesh as the system of record — every sensor feeds ONE finding schema</text>

  <!-- Workspace column -->
  <rect x="40" y="70" width="180" height="110" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="130" y="98" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Workspaces (Docker)</text>
  <text x="130" y="122" fill="#16a34a" font-family="monospace" font-size="10" text-anchor="middle">nft default-drop egress</text>
  <text x="130" y="142" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">socket-guard (docker.sock)</text>
  <text x="130" y="162" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">metadata 169.254.169.254 deny</text>

  <line x1="220" y1="125" x2="250" y2="125" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Identity chain card (dark) -->
  <rect x="250" y="70" width="190" height="110" rx="6" fill="#1e293b" stroke="#0f172a" filter="url(#shadow)"/>
  <text x="345" y="96" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">K-LAF Identity Chain</text>
  <text x="345" y="120" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">container_id → session</text>
  <text x="345" y="140" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">session → project</text>
  <text x="345" y="160" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">minted at provisioning — never self-declared</text>

  <line x1="440" y1="125" x2="470" y2="125" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Canonical schema card -->
  <rect x="470" y="70" width="210" height="110" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="575" y="96" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">security_events</text>
  <text x="575" y="118" fill="#0284c7" font-family="monospace" font-size="10" text-anchor="middle">+ source · raw_id · severity</text>
  <text x="575" y="136" fill="#0284c7" font-family="monospace" font-size="10" text-anchor="middle">+ confidence · model_version</text>
  <text x="575" y="160" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">one schema, every provider</text>

  <!-- Two provider paths -->
  <line x1="680" y1="105" x2="730" y2="85" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="145" x2="730" y2="165" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="730" y="55" width="280" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="870" y="80" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">FindingSource / FindingSink</text>
  <text x="870" y="100" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">wazuh | securityhub | builtin</text>

  <rect x="730" y="135" width="280" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="870" y="160" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">JiMesh Dashboard API (identical)</text>
  <text x="870" y="180" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">/api/security/events · freeze · report</text>
</svg>
