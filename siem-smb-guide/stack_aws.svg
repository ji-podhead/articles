<polyline points="593,180 600,284" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="953,180 1048,284" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
