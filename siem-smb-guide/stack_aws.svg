<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="646" viewBox="0 0 1200 646" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="646" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">The AWS-native stack: same job, managed instead of self-hosted</text>
<text x="40" y="83" font-size="13" font-weight="bold" fill="#8b949e">INGEST + EDGE</text>
<rect x="78" y="116" width="325" height="108" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="96" y="142" font-size="15" font-weight="bold" fill="#8b949e">Log ingestion (CloudWatch,</text>
<text x="96" y="163" font-size="15" font-weight="bold" fill="#8b949e">Firehose)</text>
<text x="96" y="184" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">streams logs into the pipeline,</text>
<text x="96" y="205" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">structured</text>
<rect x="423" y="116" width="340" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="441" y="142" font-size="15" font-weight="bold" fill="#8b949e">Network visibility (VPC Flow Logs)</text>
<text x="441" y="163" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">who talked to whom, on which port</text>
<rect x="783" y="116" width="340" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="801" y="142" font-size="15" font-weight="bold" fill="#8b949e">Edge protection (WAF + Shield)</text>
<text x="801" y="163" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">L7 rules, rate limits, DDoS mitigation</text>
<text x="40" y="257" font-size="13" font-weight="bold" fill="#8b949e">DETECTION (MANAGED) + CUSTOM ML</text>
<rect x="47" y="290" width="210" height="108" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="65" y="316" font-size="15" font-weight="bold" fill="#8b949e">GuardDuty</text>
<text x="65" y="337" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">ML threat detection</text>
<text x="65" y="358" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">flow logs, DNS,</text>
<text x="65" y="379" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">runtime</text>
<rect x="271" y="290" width="210" height="108" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="289" y="316" font-size="15" font-weight="bold" fill="#8b949e">Inspector</text>
<text x="289" y="337" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">vulnerability scanning</text>
<text x="289" y="358" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">CVEs: EC2, images,</text>
<text x="289" y="379" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Lambda</text>
<rect x="495" y="290" width="210" height="108" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="513" y="316" font-size="15" font-weight="bold" fill="#8b949e">CloudTrail</text>
<text x="513" y="337" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">signed API audit log</text>
<text x="513" y="358" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">who did what, from</text>
<text x="513" y="379" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">where</text>
<rect x="719" y="290" width="210" height="108" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="737" y="316" font-size="15" font-weight="bold" fill="#8b949e">Config</text>
<text x="737" y="337" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">configuration drift</text>
<text x="737" y="358" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">flags issues before</text>
<text x="737" y="379" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">they're live</text>
<rect x="943" y="290" width="210" height="87" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="961" y="316" font-size="15" font-weight="bold" fill="#8b949e">SageMaker</text>
<text x="961" y="337" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">custom ML models</text>
<text x="961" y="358" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">e.g. Isolation Forest</text>
<rect x="396" y="418" width="408" height="87" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="396" y="418" width="5" height="87" rx="2.5" fill="#60a5fa"/>
<text x="414" y="444" font-size="15" font-weight="bold" fill="#60a5fa">AWS Security Hub</text>
<text x="414" y="465" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">aggregates every finding, scores against</text>
<text x="414" y="486" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">CIS/PCI-DSS/GDPR</text>
<rect x="248" y="525" width="340" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="266" y="551" font-size="15" font-weight="bold" fill="#8b949e">OpenSearch Service</text>
<text x="266" y="572" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">dashboard, full-text search, Sigma rules</text>
<rect x="612" y="525" width="340" height="87" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="630" y="551" font-size="15" font-weight="bold" fill="#8b949e">Security Lake</text>
<text x="630" y="572" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">OCSF long-term storage, queried with</text>
<text x="630" y="593" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Athena</text>
<marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker>
<polyline points="241,224 152,290" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="593,182 600,290" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="953,182 1048,290" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="152,398 116,398 116,418 600,418" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="376,398 600,418" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="600,398 600,418" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="824,398 600,418" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="1048,377 1084,377 1084,418 600,418" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="600,505 418,525" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="600,505 782,525" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
</svg>