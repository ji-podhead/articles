<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="636" viewBox="0 0 1200 636" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="636" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">The AWS-native stack: same job, managed instead of self-hosted</text>
<text x="40" y="83" font-size="13" font-weight="bold" fill="#8b949e">INGEST + EDGE</text>
<rect x="78" y="114" width="325" height="108" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="96" y="140" font-size="15" font-weight="bold" fill="#8b949e">Log ingestion (CloudWatch,</text>
<text x="96" y="161" font-size="15" font-weight="bold" fill="#8b949e">Firehose)</text>
<text x="96" y="182" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">streams logs into the pipeline,</text>
<text x="96" y="203" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">structured</text>
<rect x="423" y="114" width="340" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="441" y="140" font-size="15" font-weight="bold" fill="#8b949e">Network visibility (VPC Flow Logs)</text>
<text x="441" y="161" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">who talked to whom, on which port</text>
<rect x="783" y="114" width="340" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="801" y="140" font-size="15" font-weight="bold" fill="#8b949e">Edge protection (WAF + Shield)</text>
<text x="801" y="161" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">L7 rules, rate limits, DDoS mitigation</text>
<text x="40" y="253" font-size="13" font-weight="bold" fill="#8b949e">DETECTION (MANAGED) + CUSTOM ML</text>
<rect x="47" y="284" width="210" height="108" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="65" y="310" font-size="15" font-weight="bold" fill="#8b949e">GuardDuty</text>
<text x="65" y="331" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">ML threat detection</text>
<text x="65" y="352" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">flow logs, DNS,</text>
<text x="65" y="373" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">runtime</text>
<rect x="271" y="284" width="210" height="108" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="289" y="310" font-size="15" font-weight="bold" fill="#8b949e">Inspector</text>
<text x="289" y="331" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">vulnerability scanning</text>
<text x="289" y="352" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">CVEs: EC2, images,</text>
<text x="289" y="373" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Lambda</text>
<rect x="495" y="284" width="210" height="108" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="513" y="310" font-size="15" font-weight="bold" fill="#8b949e">CloudTrail</text>
<text x="513" y="331" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">signed API audit log</text>
<text x="513" y="352" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">who did what, from</text>
<text x="513" y="373" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">where</text>
<rect x="719" y="284" width="210" height="108" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="737" y="310" font-size="15" font-weight="bold" fill="#8b949e">Config</text>
<text x="737" y="331" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">configuration drift</text>
<text x="737" y="352" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">flags issues before</text>
<text x="737" y="373" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">they're live</text>
<rect x="943" y="284" width="210" height="87" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="961" y="310" font-size="15" font-weight="bold" fill="#8b949e">SageMaker</text>
<text x="961" y="331" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">custom ML models</text>
<text x="961" y="352" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">e.g. Isolation Forest</text>
<rect x="396" y="410" width="408" height="87" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="396" y="410" width="5" height="87" rx="2.5" fill="#60a5fa"/>
<text x="414" y="436" font-size="15" font-weight="bold" fill="#60a5fa">AWS Security Hub</text>
<text x="414" y="457" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">aggregates every finding, scores against</text>
<text x="414" y="478" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">CIS/PCI-DSS/GDPR</text>
<rect x="248" y="515" width="340" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="266" y="541" font-size="15" font-weight="bold" fill="#8b949e">OpenSearch Service</text>
<text x="266" y="562" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">dashboard, full-text search, Sigma rules</text>
<rect x="612" y="515" width="340" height="87" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="630" y="541" font-size="15" font-weight="bold" fill="#8b949e">Security Lake</text>
<text x="630" y="562" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">OCSF long-term storage, queried with</text>
<text x="630" y="583" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Athena</text>
<marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker>
