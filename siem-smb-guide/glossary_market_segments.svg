<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="635" viewBox="0 0 1200 635" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="635" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">Glossary: Market Segments &amp; Customer Types</text>
<text x="60" y="103" font-size="13" font-weight="bold" fill="#60a5fa">TERM</text>
<text x="320" y="103" font-size="13" font-weight="bold" fill="#60a5fa">MEANING</text>
<rect x="40" y="144" width="1120" height="87" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="170" font-size="15" font-weight="bold" fill="#8b949e">SMB / SME</text>
<text x="58" y="191" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Small and Medium-sized Businesses (EN) / Kleine und mittlere Unternehmen - KMU (DE); firms up to ~500 employees, usually without a</text>
<text x="58" y="212" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">dedicated security team. The target market for &quot;conveyor-belt&quot; security products.</text>
<rect x="40" y="239" width="1120" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="265" font-size="15" font-weight="bold" fill="#8b949e">MSP</text>
<text x="58" y="286" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Managed Services Provider - runs IT (and often security) for SMBs.</text>
<rect x="40" y="313" width="1120" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="339" font-size="15" font-weight="bold" fill="#8b949e">MSSP</text>
<text x="58" y="360" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Managed Security Services Provider - the security-specialized MSP; runs 24/7 detection/response for many clients.</text>
<rect x="40" y="387" width="1120" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="413" font-size="15" font-weight="bold" fill="#8b949e">SaaS</text>
<text x="58" y="434" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Software as a Service - cloud software delivered over the internet; SOC 2 reports are usually a purchasing prerequisite for SaaS buyers.</text>
<rect x="40" y="461" width="1120" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="487" font-size="15" font-weight="bold" fill="#8b949e">Enterprise</text>
<text x="58" y="508" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Large organizations: multi-account/multi-cloud governance, central policies, compliance programs - a different sales motion than SMB.</text>
<rect x="40" y="535" width="1120" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="561" font-size="15" font-weight="bold" fill="#8b949e">KMU</text>
<text x="58" y="582" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">German abbreviation for SMB (kleine und mittlere Unternehmen).</text>
</svg>