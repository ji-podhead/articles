<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="984" viewBox="0 0 1200 984" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="984" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">Glossary: Platform Categories (The CNAPP Alphabet)</text>
<text x="60" y="103" font-size="13" font-weight="bold" fill="#60a5fa">TERM</text>
<text x="320" y="103" font-size="13" font-weight="bold" fill="#60a5fa">MEANING</text>
<rect x="40" y="144" width="1120" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="170" font-size="15" font-weight="bold" fill="#8b949e">CNAPP</text>
<text x="58" y="191" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Cloud-Native Application Protection Platform - one platform combining posture + workload + data + API security.</text>
<rect x="40" y="218" width="1120" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="244" font-size="15" font-weight="bold" fill="#8b949e">CSPM</text>
<text x="58" y="265" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Cloud Security Posture Management - finds and ranks cloud misconfigurations (public buckets, open security groups).</text>
<rect x="40" y="292" width="1120" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="318" font-size="15" font-weight="bold" fill="#8b949e">AI-SPM / SPM</text>
<text x="58" y="339" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Security Posture Management with AI-driven behavior analytics and risk scoring - proactive threat finding before exploitation.</text>
<rect x="40" y="366" width="1120" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="392" font-size="15" font-weight="bold" fill="#8b949e">CIEM</text>
<text x="58" y="413" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Cloud Infrastructure Entitlement Management - least-privilege over identities: finds s3:*-style wildcards, unused keys, and over-privileged roles.</text>
<rect x="40" y="440" width="1120" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="466" font-size="15" font-weight="bold" fill="#8b949e">CWPP</text>
<text x="58" y="487" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Cloud Workload Protection Platform - runtime protection of hosts and containers (syscall- and process-level).</text>
<rect x="40" y="514" width="1120" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="540" font-size="15" font-weight="bold" fill="#8b949e">DSPM</text>
<text x="58" y="561" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Data Security Posture Management - discovers where sensitive data lives and who flows it out.</text>
<rect x="40" y="588" width="1120" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="614" font-size="15" font-weight="bold" fill="#8b949e">ASPM</text>
<text x="58" y="635" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Application Security Posture Management - bridges code vulnerabilities to cloud infrastructure exposure.</text>
<rect x="40" y="662" width="1120" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="688" font-size="15" font-weight="bold" fill="#8b949e">CTEM</text>
<text x="58" y="709" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Continuous Threat Exposure Management - operating loop: enumerate attack surface → prioritize → validate → remediate.</text>
<rect x="40" y="736" width="1120" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="762" font-size="15" font-weight="bold" fill="#8b949e">XDR</text>
<text x="58" y="783" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Extended Detection &amp; Response - SIEM + endpoint detection + correlation under one umbrella.</text>
<rect x="40" y="810" width="1120" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="836" font-size="15" font-weight="bold" fill="#8b949e">MDR / managed SOC</text>
<text x="58" y="857" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Managed Detection &amp; Response - a partner runs 24/7 detection/response for you (the &quot;agentic SOC&quot; products live here).</text>
<rect x="40" y="884" width="1120" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="910" font-size="15" font-weight="bold" fill="#8b949e">SOAR</text>
<text x="58" y="931" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Security Orchestration, Automation &amp; Response - playbook engine that chains detections into automated actions (with HITL gates).</text>
</svg>