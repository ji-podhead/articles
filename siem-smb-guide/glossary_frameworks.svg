<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="614" viewBox="0 0 1200 614" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="614" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">Glossary: Frameworks &amp; Certifications</text>
<text x="60" y="103" font-size="13" font-weight="bold" fill="#60a5fa">TERM</text>
<text x="320" y="103" font-size="13" font-weight="bold" fill="#60a5fa">MEANING</text>
<rect x="40" y="144" width="1120" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="170" font-size="15" font-weight="bold" fill="#8b949e">SOC 2</text>
<text x="58" y="191" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Audit standard for SaaS operations (security, availability, confidentiality) - proof-of-controls report by an independent CPA firm.</text>
<rect x="40" y="218" width="1120" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="244" font-size="15" font-weight="bold" fill="#8b949e">HIPAA</text>
<text x="58" y="265" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">US law protecting health data (PHI); mandatory for healthcare workloads.</text>
<rect x="40" y="292" width="1120" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="318" font-size="15" font-weight="bold" fill="#8b949e">PCI-DSS</text>
<text x="58" y="339" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Payment card industry security standard; mandatory for anything touching card data (including your token-budget/billing flows).</text>
<rect x="40" y="366" width="1120" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="392" font-size="15" font-weight="bold" fill="#8b949e">NIST CSF</text>
<text x="58" y="413" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">US framework catalog for security programs; the &quot;N&quot; in many evidence-pack exports.</text>
<rect x="40" y="440" width="1120" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="466" font-size="15" font-weight="bold" fill="#8b949e">CIS Benchmarks</text>
<text x="58" y="487" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Center for Internet Security best-practice configuration catalogs (e.g., AWS Foundations Benchmark) that posture tools score against.</text>
<rect x="40" y="514" width="1120" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="540" font-size="15" font-weight="bold" fill="#8b949e">GDPR / DSGVO</text>
<text x="58" y="561" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">EU data protection law - the reason security tooling must prove what it stores, not just that it stores it.</text>
</svg>