<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="560" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">The open-source stack: network, kernel, host and firewall signals</text>
<text x="40" y="94" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">under one roof</text>
<text x="40" y="123" font-size="13" font-weight="bold" fill="#8b949e">SENSORS (per host / per container)</text>
<rect x="61" y="158" width="260" height="108" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="79" y="184" font-size="15" font-weight="bold" fill="#8b949e">Suricata (network</text>
<text x="79" y="205" font-size="15" font-weight="bold" fill="#8b949e">IDS/IPS)</text>
<text x="79" y="226" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">signature rules on packets;</text>
<text x="79" y="247" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">XDP/eBPF capture at line rate</text>
<rect x="337" y="158" width="260" height="108" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="355" y="184" font-size="15" font-weight="bold" fill="#8b949e">eBPF sensor (e.g. Falco)</text>
<text x="355" y="205" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">watches syscalls per</text>
<text x="355" y="226" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">container - escapes, shells,</text>
<text x="355" y="247" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">miners, no sidecar</text>
<rect x="613" y="158" width="260" height="129" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="631" y="184" font-size="15" font-weight="bold" fill="#8b949e">Host agent (e.g. Wazuh</text>
<text x="631" y="205" font-size="15" font-weight="bold" fill="#8b949e">agent)</text>
<text x="631" y="226" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">file-integrity monitoring,</text>
<text x="631" y="247" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">vuln scan, Docker-engine</text>
<text x="631" y="268" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">visibility</text>
<rect x="889" y="158" width="250" height="150" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="907" y="184" font-size="15" font-weight="bold" fill="#8b949e">Firewall logs</text>
<text x="907" y="205" font-size="15" font-weight="bold" fill="#8b949e">(nftables/ufw)</text>
<text x="907" y="226" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">what got dropped, which</text>
<text x="907" y="247" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">ports</text>
<text x="907" y="268" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">are actually open, from</text>
<text x="907" y="289" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">where</text>
<rect x="280" y="330" width="640" height="108" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="280" y="330" width="5" height="108" rx="2.5" fill="#60a5fa"/>
<text x="298" y="356" font-size="15" font-weight="bold" fill="#60a5fa">SIEM core (e.g. Wazuh manager, rules + correlation)</text>
<text x="298" y="377" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">correlates all four sources against a ruleset, writes structured, timestamped</text>
<text x="298" y="398" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">alerts</text>
<text x="298" y="419" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">single-node docker-compose, roughly 4 GB RAM - no Kubernetes required</text>
<rect x="240" y="460" width="720" height="66" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="258" y="486" font-size="15" font-weight="bold" fill="#8b949e">Indexer + dashboard (OpenSearch) - full-text search, retention, compliance</text>
<text x="258" y="507" font-size="15" font-weight="bold" fill="#8b949e">views</text>
<marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker>
<polyline points="191,266 600,330" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="467,266 600,330" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="743,287 600,330" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="1014,308 600,330" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="600,438 600,460" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
</svg>