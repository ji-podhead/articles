<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="60%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M 0,75 L 1200,75 M 0,150 L 1200,150 M 0,225 L 1200,225 M 0,300 L 1200,300 M 0,375 L 1200,375 M 0,450 L 1200,450 M 0,525 L 1200,525 M 0,600 L 1200,600"/>
    <path d="M 150,0 L 150,675 M 300,0 L 300,675 M 450,0 L 450,675 M 600,0 L 600,675 M 750,0 L 750,675 M 900,0 L 900,675 M 1050,0 L 1050,675"/>
  </g>

  <g opacity="0.15">
    <circle cx="950" cy="337" r="280" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="12,6"/>
    <circle cx="950" cy="337" r="200" fill="none" stroke="#818cf8" stroke-width="4"/>
    <circle cx="950" cy="337" r="120" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="4,4"/>
  </g>

  <!-- left: typography -->
  <g transform="translate(90, 120)">
    <rect x="0" y="0" width="185" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="92" y="19" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1" text-anchor="middle">PART 1 / OSINT</text>

    <text x="0" y="65" fill="#ffffff" font-weight="900" font-size="34" letter-spacing="-1">How Hackers Find</text>
    <text x="0" y="108" fill="#ffffff" font-weight="900" font-size="34" letter-spacing="-1">Your Infra Weakpoints,</text>
    <text x="0" y="151" fill="url(#accentGrad)" font-weight="900" font-size="34" letter-spacing="-1">Leaks and Unprotected AI</text>

    <text x="0" y="192" fill="#94a3b8" font-size="17">The public search engines that index every misconfiguration</text>
    <text x="0" y="216" fill="#94a3b8" font-size="17">on the internet — and how the queries are actually built.</text>

    <g transform="translate(0, 255)" font-family="monospace" font-size="13" fill="#64748b">
      <text x="0" y="0"><tspan fill="#38bdf8">FOFA:</tspan> port="11434" &amp;&amp; body="Ollama is running"</text>
      <text x="0" y="26"><tspan fill="#818cf8">Shodan:</tspan> asn:AS24940 "MongoDB" port:27017</text>
      <text x="0" y="52"><tspan fill="#f43f5e"># </tspan>200 OK, no auth form in the body — the tell every scanner looks for</text>
    </g>
  </g>

  <!-- right motif: radar/scan sweep over a grid of nodes -->
  <g transform="translate(950, 337)">
    <g stroke="#38bdf8" stroke-width="1" opacity="0.4">
      <line x1="-260" y1="0" x2="260" y2="0"/>
      <line x1="0" y1="-260" x2="0" y2="260"/>
    </g>
    <path d="M 0,0 L 260,0 A 260,260 0 0,1 184,184 Z" fill="#38bdf8" opacity="0.18"/>
    <g fill="#22c55e">
      <circle cx="120" cy="-90" r="7"/>
      <circle cx="-150" cy="60" r="7" fill="#64748b"/>
      <circle cx="60" cy="150" r="7"/>
      <circle cx="-80" cy="-160" r="7" fill="#64748b"/>
      <circle cx="190" cy="100" r="7" fill="#64748b"/>
      <circle cx="-190" cy="-60" r="7" fill="#64748b"/>
    </g>
    <text x="120" y="-105" fill="#4ade80" font-family="monospace" font-size="11" text-anchor="middle">open</text>
    <text x="60" y="135" fill="#4ade80" font-family="monospace" font-size="11" text-anchor="middle">open</text>
  </g>

  <!-- bottom-left: mesh-cube mark + wordmark -->
  <g color="#94a3b8">
    <g transform="translate(145, 592) scale(0.12)">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <g stroke-width="4" stroke-dasharray="8 5" opacity="0.55">
          <line x1="0" y1="-150" x2="0" y2="-240"/>
          <line x1="130" y1="-75" x2="208" y2="-120"/>
          <line x1="130" y1="75" x2="208" y2="120"/>
          <line x1="0" y1="150" x2="0" y2="240"/>
          <line x1="-130" y1="75" x2="-208" y2="120"/>
          <line x1="-130" y1="-75" x2="-208" y2="-120"/>
        </g>
        <g stroke-width="3">
          <circle cx="0" cy="-240" r="8"/>
          <circle cx="208" cy="-120" r="8"/>
          <circle cx="208" cy="120" r="8"/>
          <circle cx="0" cy="240" r="8"/>
          <circle cx="-208" cy="120" r="8"/>
          <circle cx="-208" cy="-120" r="8"/>
        </g>
        <g stroke-width="2.5" stroke-dasharray="6 4" opacity="0.35">
          <line x1="0" y1="0" x2="0" y2="-150"/>
          <line x1="0" y1="0" x2="-130" y2="75"/>
          <line x1="0" y1="0" x2="130" y2="75"/>
        </g>
        <g stroke-width="8">
          <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75"/>
          <line x1="0" y1="0" x2="130" y2="-75"/>
          <line x1="0" y1="0" x2="-130" y2="-75"/>
        </g>
      </g>
    </g>
    <text x="190" y="598" fill="#94a3b8" font-size="17" font-weight="900" letter-spacing="4">JIMESH</text>
  </g>
</svg>
