      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1050" height="620" fill="#f8fafc" rx="12"/>
  <text x="525" y="30" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">A worked example: an AI-agent gateway, today vs. where this is headed</text>

  <!-- TODAY panel -->
  <text x="30" y="58" fill="#64748b" font-family="sans-serif" font-weight="bold" font-size="12">TODAY — shipped and real</text>
  <rect x="30" y="66" width="480" height="240" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>

  <rect x="50" y="82" width="140" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="120" y="102" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">You (browser)</text>
  <text x="120" y="116" fill="#64748b" font-family="sans-serif" font-size="8" text-anchor="middle">or a coding agent</text>

  <line x1="190" y1="104" x2="230" y2="104" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="235" y="82" width="140" height="44" rx="6" fill="#1e293b"/>
  <text x="305" y="100" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Gateway backend</text>
  <text x="305" y="114" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">auth + budget check</text>

  <line x1="305" y1="126" x2="305" y2="150" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="360" y="142" fill="#64748b" font-family="sans-serif" font-size="8">SSH tunnel, no</text>
  <text x="360" y="152" fill="#64748b" font-family="sans-serif" font-size="8">published port</text>

  <rect x="235" y="156" width="140" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="305" y="174" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Remote SSH target</text>
  <text x="305" y="188" fill="#64748b" font-family="sans-serif" font-size="8" text-anchor="middle">any existing server</text>

  <line x1="305" y1="200" x2="305" y2="224" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="380" y="216" fill="#64748b" font-family="sans-serif" font-size="8">direct-dial to</text>
  <text x="380" y="226" fill="#64748b" font-family="sans-serif" font-size="8">internal container IP</text>

  <rect x="235" y="230" width="140" height="52" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="305" y="250" fill="#065f46" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Agent container</text>
  <text x="305" y="264" fill="#047857" font-family="sans-serif" font-size="8" text-anchor="middle">gVisor-sandboxed</text>
  <text x="305" y="276" fill="#047857" font-family="sans-serif" font-size="8" text-anchor="middle">egress allowlist active</text>

  <text x="410" y="180" fill="#94a3b8" font-family="sans-serif" font-size="8">✓ never a raw port</text>
  <text x="410" y="192" fill="#94a3b8" font-family="sans-serif" font-size="8">exposed to the internet</text>
  <text x="410" y="256" fill="#94a3b8" font-family="sans-serif" font-size="8">✓ kernel-isolated,</text>
  <text x="410" y="268" fill="#94a3b8" font-family="sans-serif" font-size="8">egress-restricted</text>

  <text x="45" y="330" fill="#b91c1c" font-family="sans-serif" font-weight="bold" font-size="10">Honest gap today: one host at a time — no VLAN segmentation</text>
  <text x="45" y="344" fill="#b91c1c" font-family="sans-serif" font-size="9">between two workspaces on the SAME remote server yet (Layer B, not built).</text>

  <!-- TARGET panel -->
  <text x="540" y="58" fill="#64748b" font-family="sans-serif" font-weight="bold" font-size="12">TARGET — planned, not yet built</text>
  <rect x="540" y="66" width="480" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>

  <rect x="560" y="82" width="130" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="625" y="105" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Client</text>
  <line x1="690" y1="102" x2="720" y2="102" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="3 3"/>

  <rect x="725" y="82" width="140" height="40" rx="6" fill="#1e293b"/>
  <text x="795" y="106" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Identity Router</text>

  <line x1="795" y1="122" x2="795" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="3 3"/>

  <rect x="565" y="150" width="140" height="60" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="635" y="172" fill="#4c1d95" font-family="sans-serif" font-weight="bold" font-size="9" text-anchor="middle">Workspace A</text>
  <text x="635" y="186" fill="#5b21b6" font-family="sans-serif" font-size="8" text-anchor="middle">VLAN 101 · gVisor</text>
  <text x="635" y="198" fill="#5b21b6" font-family="sans-serif" font-size="8" text-anchor="middle">same host</text>

  <rect x="725" y="150" width="140" height="60" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="795" y="172" fill="#4c1d95" font-family="sans-serif" font-weight="bold" font-size="9" text-anchor="middle">Workspace B</text>
  <text x="795" y="186" fill="#5b21b6" font-family="sans-serif" font-size="8" text-anchor="middle">VLAN 102 · gVisor</text>
  <text x="795" y="198" fill="#5b21b6" font-family="sans-serif" font-size="8" text-anchor="middle">same host</text>

  <text x="635" y="222" fill="#b91c1c" font-family="sans-serif" font-weight="bold" font-size="9" text-anchor="middle">✕</text>
  <text x="795" y="222" fill="#b91c1c" font-family="sans-serif" font-weight="bold" font-size="9" text-anchor="middle">✕</text>
  <line x1="705" y1="180" x2="725" y2="180" stroke="#dc2626" stroke-width="2" stroke-dasharray="2 2"/>
  <text x="715" y="228" fill="#b91c1c" font-family="sans-serif" font-size="8" text-anchor="middle">no route between VLANs</text>

  <line x1="635" y1="210" x2="635" y2="245" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="3 3"/>
  <line x1="795" y1="210" x2="795" y2="245" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="3 3"/>

  <rect x="560" y="250" width="345" height="34" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="732" y="271" fill="#065f46" font-family="sans-serif" font-size="9" text-anchor="middle">Same egress allowlist + gVisor sandboxing as today, now with per-workspace VLANs</text>

  <!-- mesh vision, spanning bottom -->
  <rect x="30" y="330" width="990" height="250" rx="10" fill="#0f172a" filter="url(#sh)"/>
  <text x="525" y="360" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">Further out: one mesh across many servers and clouds</text>
  <text x="525" y="380" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">the same Gitpod/Ona pattern — a control plane that provisions this same 3-layer stack wherever a customer's workload actually runs</text>

  <rect x="70" y="410" width="220" height="100" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="180" y="432" fill="#e2e8f0" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Central control plane</text>
  <text x="180" y="450" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">identity, policy,</text>
  <text x="180" y="462" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">routing table</text>
  <text x="180" y="480" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">reached over a</text>
  <text x="180" y="492" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">WireGuard mesh —</text>
  <text x="180" y="504" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">no public SSH exposure</text>

  <line x1="290" y1="450" x2="360" y2="420" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="290" y1="465" x2="360" y2="460" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="290" y1="480" x2="360" y2="500" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="365" y="400" width="180" height="55" rx="6" fill="#334155" stroke="#475569"/>
  <text x="455" y="422" fill="#e2e8f0" font-family="sans-serif" font-weight="bold" font-size="9" text-anchor="middle">Own hardware / VPS</text>
  <text x="455" y="440" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">3-layer stack, local VLANs</text>

