<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1210" viewBox="0 0 1200 1210" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="1210" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">A worked example: an AI-agent gateway, today vs. where this is</text>
<text x="40" y="94" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">headed</text>
<rect x="195" y="110" width="281" height="45" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="213" y="136" font-size="15" font-weight="bold" fill="#e6edf3">TODAY - shipped and real</text>
<rect x="195" y="171" width="195" height="66" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="213" y="197" font-size="15" font-weight="bold" fill="#e6edf3">You (browser)</text>
<text x="213" y="218" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">or a coding agent</text>
<rect x="195" y="253" width="213" height="66" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="213" y="279" font-size="15" font-weight="bold" fill="#e6edf3">Gateway backend</text>
<text x="213" y="300" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">auth + budget check</text>
<rect x="195" y="335" width="213" height="66" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="213" y="361" font-size="15" font-weight="bold" fill="#e6edf3">Remote SSH target</text>
<text x="213" y="382" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">any existing server</text>
<rect x="195" y="417" width="380" height="129" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="195" y="417" width="5" height="129" rx="2.5" fill="#4ade80"/>
<image href="data:image/svg+xml;base64," x="537" y="427" width="24" height="24"/>
<text x="213" y="443" font-size="15" font-weight="bold" fill="#4ade80">Agent container</text>
<text x="213" y="464" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">gVisor-sandboxed</text>
<text x="213" y="485" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">egress allowlist active</text>
<text x="213" y="506" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">✓ never a raw port exposed to the internet</text>
<text x="213" y="527" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">✓ kernel-isolated, egress-restricted</text>
<rect x="599" y="110" width="353" height="45" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="617" y="136" font-size="15" font-weight="bold" fill="#e6edf3">TARGET - planned, not yet built</text>
<rect x="599" y="171" width="156" height="45" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="617" y="197" font-size="15" font-weight="bold" fill="#e6edf3">Client</text>
<rect x="599" y="232" width="189" height="45" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="617" y="258" font-size="15" font-weight="bold" fill="#e6edf3">Identity Router</text>
<rect x="599" y="293" width="195" height="108" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="599" y="293" width="5" height="108" rx="2.5" fill="#4ade80"/>
<text x="617" y="319" font-size="15" font-weight="bold" fill="#4ade80">Workspace A</text>
<text x="617" y="340" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">VLAN 101 · gVisor</text>
<text x="617" y="361" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">same host</text>
<text x="617" y="382" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">✕</text>
<rect x="810" y="293" width="195" height="108" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="810" y="293" width="5" height="108" rx="2.5" fill="#4ade80"/>
<text x="828" y="319" font-size="15" font-weight="bold" fill="#4ade80">Workspace B</text>
<text x="828" y="340" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">VLAN 102 · gVisor</text>
<text x="828" y="361" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">same host</text>
<text x="828" y="382" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">✕</text>
<rect x="599" y="417" width="342" height="87" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="617" y="443" font-size="15" font-weight="bold" fill="#e6edf3">Same egress allowlist + gVisor</text>
<text x="617" y="464" font-size="15" font-weight="bold" fill="#e6edf3">sandboxing as today, now with</text>
<text x="617" y="485" font-size="15" font-weight="bold" fill="#e6edf3">per-workspace VLANs</text>
<rect x="40" y="564" width="380" height="108" rx="11" fill="#161b22" stroke="#f87171" stroke-width="2"/>
<rect x="40" y="564" width="5" height="108" rx="2.5" fill="#f87171"/>
<text x="58" y="590" font-size="15" font-weight="bold" fill="#f87171">Honest gap today:</text>
<text x="58" y="611" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">one host at a time - no VLAN segmentation</text>
<text x="58" y="632" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">between two workspaces on the SAME</text>
<text x="58" y="653" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">remote server yet (Layer B, not built).</text>
<rect x="40" y="690" width="380" height="150" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="58" y="716" font-size="15" font-weight="bold" fill="#e6edf3">Further out: one mesh across many</text>
<text x="58" y="737" font-size="15" font-weight="bold" fill="#e6edf3">servers and clouds</text>
<text x="58" y="758" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">the same Gitpod/Ona pattern - a control</text>
<text x="58" y="779" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">plane that provisions this same 3-layer stack</text>
<text x="58" y="800" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">wherever a customer's workload actually</text>
<text x="58" y="821" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">runs</text>
<rect x="98" y="858" width="380" height="108" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="116" y="884" font-size="15" font-weight="bold" fill="#e6edf3">Central control plane</text>
<text x="116" y="905" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">identity, policy, routing table</text>
<text x="116" y="926" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">reached over a WireGuard mesh - no public</text>
<text x="116" y="947" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">SSH exposure</text>
<rect x="498" y="858" width="278" height="66" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="516" y="884" font-size="15" font-weight="bold" fill="#e6edf3">Own hardware / VPS</text>
<text x="516" y="905" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">3-layer stack, local VLANs</text>
<rect x="796" y="858" width="306" height="66" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="814" y="884" font-size="15" font-weight="bold" fill="#e6edf3">AWS / GCP node</text>
<text x="814" y="905" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">same stack, cloud VPC instead</text>
<rect x="40" y="984" width="380" height="192" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="58" y="1010" font-size="15" font-weight="bold" fill="#e6edf3">Why this matters for a real product</text>
<text x="58" y="1031" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">a customer picks WHERE a workload runs</text>
<text x="58" y="1052" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">(their own box, or a cloud region) without</text>
<text x="58" y="1073" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">ever changing how they reach it, and without</text>
<text x="58" y="1094" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">the platform operator needing a different</text>
<text x="58" y="1115" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">security story per environment - one identity</text>
<text x="58" y="1136" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">layer, one policy engine, many physical</text>
<text x="58" y="1157" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">locations</text>
<marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker>
<polyline points="293,237 302,253" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="302,319 302,335" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
