<text x="302" y="321" font-size="13" fill="#8b949e" text-anchor="middle">SSH tunnel, no published</text>
<text x="302" y="338" font-size="13" fill="#8b949e" text-anchor="middle">port</text>
<polyline points="302,401 385,417" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<rect x="244" y="388" width="199" height="42" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="343" y="403" font-size="13" fill="#8b949e" text-anchor="middle">direct-dial to internal</text>
<text x="343" y="420" font-size="13" fill="#8b949e" text-anchor="middle">container IP</text>
<polyline points="677,216 694,232" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="694,277 697,293" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="694,277 944,277 944,293 908,293" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/></marker>
<polyline points="794,347 810,347" fill="none" stroke="#f87171" stroke-width="2.2" marker-end="url(#ar2)"/>
<rect x="706" y="335" width="191" height="25" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="802" y="350" font-size="13" fill="#8b949e" text-anchor="middle">no route between VLANs</text>
<polyline points="478,912 498,891" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="478,912 478,948 796,948 796,891" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
