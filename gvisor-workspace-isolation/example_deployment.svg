  <text x="790" y="435" fill="#e2e8f0" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Why this matters for a real product</text>
  <text x="790" y="455" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">a customer picks WHERE a workload runs (their own box, or a cloud region)</text>
  <text x="790" y="470" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">without ever changing how they reach it, and without the platform operator</text>
  <text x="790" y="485" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">needing a different security story per environment — one identity layer,</text>
  <text x="790" y="500" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">one policy engine, many physical locations</text>
