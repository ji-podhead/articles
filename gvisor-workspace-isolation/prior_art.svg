<svg xmlns="http://www.w3.org/2000/svg" width="1436" height="422" viewBox="0 0 1436 422" font-family="DejaVu Sans, Verdana, sans-serif">
<rect width="1436" height="422" fill="#0d1117"/>
<text x="30" y="52" font-size="30" font-weight="bold" fill="#ffffff">Same three-layer pattern, three real production</text>
<text x="30" y="92" font-size="30" font-weight="bold" fill="#ffffff">platforms</text>
<rect x="30" y="144" width="349" height="45" fill="#1c2128" stroke="#30363d"/>
<text x="46" y="158" font-size="15" font-weight="bold" fill="#ffffff">PLATFORM</text>
<rect x="379" y="144" width="339" height="45" fill="#1c2128" stroke="#30363d"/>
<text x="395" y="158" font-size="15" font-weight="bold" fill="#ffffff">LAYER A - KERNEL SANDBOX</text>
<rect x="718" y="144" width="339" height="45" fill="#1c2128" stroke="#30363d"/>
<text x="734" y="158" font-size="15" font-weight="bold" fill="#ffffff">LAYER B - LOCAL SEGMENTATION</text>
<rect x="1057" y="144" width="349" height="45" fill="#1c2128" stroke="#30363d"/>
<text x="1073" y="158" font-size="15" font-weight="bold" fill="#ffffff">LAYER C - PROXY</text>
<rect x="30" y="189" width="349" height="87" fill="none" stroke="#30363d"/>
<text x="46" y="203" font-size="15" font-weight="bold" fill="#ffffff">Kubernetes Agent Sandbox (CNCF</text>
<text x="46" y="224" font-size="15" font-weight="bold" fill="#ffffff">SIG, 2026 - official reference for</text>
<text x="46" y="245" font-size="15" font-weight="bold" fill="#ffffff">AI agents / untrusted code on k8s)</text>
<rect x="379" y="189" width="339" height="87" fill="none" stroke="#30363d"/>
<text x="395" y="203" font-size="15" fill="#c9d1d9">gVisor via runtimeClassName:</text>
<text x="395" y="224" font-size="15" fill="#c9d1d9">gvisor</text>
<rect x="718" y="189" width="339" height="87" fill="none" stroke="#30363d"/>
<text x="734" y="203" font-size="15" fill="#c9d1d9">Host-level L2/L3 segmentation</text>
<text x="734" y="224" font-size="15" fill="#c9d1d9">below the pods</text>
<rect x="1057" y="189" width="349" height="87" fill="none" stroke="#30363d"/>
<text x="1073" y="203" font-size="15" fill="#c9d1d9">&quot;Sandbox Router&quot; - X-Sandbox-ID</text>
<text x="1073" y="224" font-size="15" fill="#c9d1d9">header-based routing</text>
<rect x="30" y="276" width="349" height="87" fill="#11161d"/>
<rect x="30" y="276" width="349" height="87" fill="none" stroke="#30363d"/>
<text x="46" y="290" font-size="15" font-weight="bold" fill="#ffffff">Gitpod / Ona (dev-workspace</text>
<text x="46" y="311" font-size="15" font-weight="bold" fill="#ffffff">platform, millions of parallel</text>
<text x="46" y="332" font-size="15" font-weight="bold" fill="#ffffff">workspaces)</text>
<rect x="379" y="276" width="339" height="87" fill="#11161d"/>
<rect x="379" y="276" width="339" height="87" fill="none" stroke="#30363d"/>
<text x="395" y="290" font-size="15" fill="#c9d1d9">gVisor (runsc), default for every</text>
<text x="395" y="311" font-size="15" fill="#c9d1d9">workspace</text>
<rect x="718" y="276" width="339" height="87" fill="#11161d"/>
<rect x="718" y="276" width="339" height="87" fill="none" stroke="#30363d"/>
<text x="734" y="290" font-size="15" fill="#c9d1d9">Cilium (eBPF) network policies +</text>
<text x="734" y="311" font-size="15" fill="#c9d1d9">dedicated tunnels - tenants can't</text>
<text x="734" y="332" font-size="15" fill="#c9d1d9">ping each other</text>
<rect x="1057" y="276" width="349" height="87" fill="#11161d"/>
<rect x="1057" y="276" width="349" height="87" fill="none" stroke="#30363d"/>
<text x="1073" y="290" font-size="15" fill="#c9d1d9">Envoy ingress, subdomain +</text>
<text x="1073" y="311" font-size="15" fill="#c9d1d9">session-cookie routing, zero raw</text>
<text x="1073" y="332" font-size="15" fill="#c9d1d9">ports to internet</text>
<rect x="30" y="363" width="349" height="87" fill="none" stroke="#30363d"/>
<text x="46" y="377" font-size="15" font-weight="bold" fill="#ffffff">Fly.io (production VM hosting -</text>
<text x="46" y="398" font-size="15" font-weight="bold" fill="#ffffff">different sandbox tech, same</text>
<text x="46" y="419" font-size="15" font-weight="bold" fill="#ffffff">3-layer shape)</text>
<rect x="379" y="363" width="339" height="87" fill="none" stroke="#30363d"/>
<text x="395" y="377" font-size="15" fill="#c9d1d9">Firecracker microVMs</text>
<text x="395" y="398" font-size="15" fill="#c9d1d9">(hardware-virtualized, own guest</text>
<text x="395" y="419" font-size="15" fill="#c9d1d9">kernel per tenant)</text>
<rect x="718" y="363" width="339" height="87" fill="none" stroke="#30363d"/>
<text x="734" y="377" font-size="15" fill="#c9d1d9">Proprietary L2 network &quot;6PN&quot; - no</text>
<text x="734" y="398" font-size="15" fill="#c9d1d9">local route between VMs</text>
<rect x="1057" y="363" width="349" height="87" fill="none" stroke="#30363d"/>
<text x="1073" y="377" font-size="15" fill="#c9d1d9">fly-proxy (Rust) - TLS termination</text>
<text x="1073" y="398" font-size="15" fill="#c9d1d9">+ identity-based routing straight</text>
<text x="1073" y="419" font-size="15" fill="#c9d1d9">into the VM</text>
</svg>