<svg xmlns="http://w3.org" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Hintergrund-Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Logo-Schild-Gradient -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2942" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Akzent-Cyan-Gradient -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Suricata Orange-Gradient -->
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>

    <!-- Glow-Filter für Cyber-Effekt -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hintergrund -->
  <rect width="800" height="500" fill="url(#bg-grad)" />

  <!-- Dekorative Netzwerkknoten / Hintergrundraster (Security Context) -->
  <g stroke="#1e2942" stroke-width="1" opacity="0.4">
    <line x1="100" y1="100" x2="300" y2="150" />
    <line x1="300" y1="150" x2="250" y2="350" />
    <line x1="250" y1="350" x2="100" y2="400" />
    <line x1="300" y1="150" x2="450" y2="100" />
    <line x1="450" y1="100" x2="600" y2="200" />
    <line x1="250" y1="350" x2="500" y2="400" />
  </g>
  <g fill="#1e2942" opacity="0.6">
    <circle cx="100" cy="100" r="4" />
    <circle cx="300" cy="150" r="5" />
    <circle cx="250" cy="350" r="5" />
    <circle cx="100" cy="400" r="4" />
    <circle cx="450" cy="100" r="4" />
    <circle cx="600" cy="200" r="4" />
    <circle cx="500" cy="400" r="4" />
  </g>

  <!-- Haupt-Schild im Hintergrund des Maskottchens -->
  <g transform="translate(180, 70)">
    <!-- Äußerer leuchtender Rahmen (Schild) -->
    <path d="M 120 0 L 240 40 L 200 240 L 120 340 L 40 240 L 0 40 Z" fill="url(#shield-grad)" stroke="url(#cyan-grad)" stroke-width="3" filter="url(#glow)"/>
    <!-- Innerer Schutzring -->
    <path d="M 120 20 L 215 52 L 182 223 L 120 305 L 58 223 L 25 52 Z" fill="none" stroke="#2a3b5c" stroke-width="2" stroke-dasharray="8,4" />
  </g>

  <!-- Suricata Maskottchen (Stilisiertes, wachsames Erdmännchen) -->
  <g transform="translate(230, 110)">
    <!-- Rücken und Körpersilhouette -->
    <path d="M 40 260 C 30 210, 45 140, 60 110 C 70 90, 85 70, 95 50 C 98 40, 95 25, 110 15 C 125 5, 145 12, 155 25 C 165 38, 160 55, 150 65 C 135 80, 105 100, 100 130 C 95 160, 105 210, 115 260 Z" fill="url(#orange-grad)" />
    
    <!-- Bauchseite / Akzent (Helleres Orange/Creme) -->
    <path d="M 100 130 C 105 100, 135 80, 150 65 C 142 65, 130 75, 120 85 C 105 105, 90 130, 85 160 C 80 190, 85 230, 92 260 C 102 230, 98 170, 100 130 Z" fill="#ffcc00" opacity="0.8" />

    <!-- Wachsames Auge (Die "Detection" / IDS) -->
    <circle cx="132" cy="35" r="8" fill="#070a14" />
    <circle cx="134" cy="33" r="3" fill="#ffffff" />
    <!-- Dunkle Augenmaske (Typisch für Erdmännchen) -->
    <path d="M 115 38 C 115 30, 125 25, 142 30 C 145 35, 135 48, 122 45 C 118 44, 115 41, 115 38 Z" fill="#2d1a00" opacity="0.9" />
    <circle cx="132" cy="35" r="4" fill="#ff3300" /> <!-- Rote wachsame Pupille -->

    <!-- Schnauze und Nase -->
    <path d="M 155 25 C 158 28, 165 32, 168 35 C 162 40, 152 42, 148 40 Z" fill="#ffcc00" />
    <polygon points="166,33 170,35 166,39" fill="#070a14" />

    <!-- Typische Rückenstreifen (Stilisierte Datenbalken / Signaturen) -->
    <path d="M 52 140 Q 70 145, 80 142" stroke="#2d1a00" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 48 165 Q 68 170, 82 165" stroke="#2d1a00" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 46 190 Q 68 195, 84 188" stroke="#2d1a00" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 48 215 Q 72 220, 88 212" stroke="#2d1a00" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Cyber-Ohr -->
    <path d="M 110 22 C 106 22, 102 28, 104 34 C 108 34, 112 28, 110 22 Z" fill="#2d1a00" />
  </g>

  <!-- Text-Bereich (Typografie) -->
  <g font-family="'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif" font-weight="800">
    <!-- Markenname -->
    <text x="490" y="240" font-size="52" fill="#ffffff" letter-spacing="4">SURICATA</text>
    <!-- Untertitel / Funktion -->
    <text x="495" y="275" font-size="14" fill="url(#cyan-grad)" font-weight="600" letter-spacing="6">NETWORK SECURITY OS</text>
  </g>

  <!-- Optische Trennlinie (Cyber-Stil) -->
  <rect x="495" y="295" width="230" height="2" fill="url(#cyan-grad)" opacity="0.7" />
  <circle cx="725" cy="296" r="3" fill="#00f2fe" filter="url(#glow)" />

  <!-- Zusätzliche Features (Kleine Status-Indikatoren unter dem Strich) -->
  <g font-family="sans-serif" font-size="10" font-weight="bold" fill="#566a94" letter-spacing="1">
    <text x="495" y="320">MALWARE DETECTION</text>
    <text x="635" y="320">│  IDS / IPS</text>
  </g>
</svg>
