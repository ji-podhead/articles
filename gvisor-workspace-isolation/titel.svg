<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="60%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="layerA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="layerB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="layerC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M 0,75 L 1200,75 M 0,150 L 1200,150 M 0,225 L 1200,225 M 0,300 L 1200,300 M 0,375 L 1200,375 M 0,450 L 1200,450 M 0,525 L 1200,525 M 0,600 L 1200,600"/>
    <path d="M 150,0 L 150,675 M 300,0 L 300,675 M 450,0 L 450,675 M 600,0 L 600,675 M 750,0 L 750,675 M 900,0 L 900,675 M 1050,0 L 1050,675"/>
  </g>

  <g opacity="0.15">
    <circle cx="950" cy="337" r="280" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="12,6"/>
    <circle cx="950" cy="337" r="200" fill="none" stroke="#818cf8" stroke-width="4"/>
    <circle cx="950" cy="337" r="120" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="4,4"/>
  </g>

  <!-- left: typography -->
  <g transform="translate(90, 145)">
    <rect x="0" y="0" width="270" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="135" y="19" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1" text-anchor="middle">MULTI-TENANT WORKSPACE SECURITY</text>

    <text x="0" y="82" fill="#ffffff" font-weight="900" font-size="46" letter-spacing="-1">The Bouncer, the Wall,</text>
    <text x="0" y="136" fill="url(#accentGrad)" font-weight="900" font-size="46" letter-spacing="-1">and the Straitjacket</text>

    <text x="0" y="180" fill="#94a3b8" font-size="19">How gVisor, VLANs, and identity-routing actually</text>
    <text x="0" y="206" fill="#94a3b8" font-size="19">isolate strangers sharing the same server.</text>

    <g transform="translate(0, 250)" font-family="monospace" font-size="14" fill="#64748b">
      <text x="0" y="0"><tspan fill="#f43f5e"># </tspan>runtimeClassName: gvisor</text>
      <text x="0" y="26" fill="#a78bfa">➔ [vlan.id == 102] tenant traffic tagged, isolated</text>
      <text x="0" y="52" fill="#10b981">➔ [proxy] X-App-ID verified before any packet forwards</text>
    </g>
  </g>

  <!-- right: three stacked layers, the bouncer/wall/straitjacket motif -->
  <g transform="translate(945, 340)" filter="url(#softShadow)">
    <!-- straitjacket (gVisor, bottom/foundation) -->
    <rect x="-115" y="55" width="230" height="80" rx="12" fill="url(#layerC)" stroke="#052e16" stroke-width="2"/>
    <text x="0" y="90" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">gVisor</text>
    <text x="0" y="110" fill="#dcfce7" font-size="10" text-anchor="middle">kernel-syscall sandbox</text>

    <!-- wall (VLAN, middle) -->
    <rect x="-115" y="-35" width="230" height="80" rx="12" fill="url(#layerB)" stroke="#2e1065" stroke-width="2"/>
    <text x="0" y="0" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">VLAN / ipvlan</text>
    <text x="0" y="20" fill="#ede9fe" font-size="10" text-anchor="middle">local L2 segmentation</text>

    <!-- bouncer (proxy, top) -->
    <rect x="-115" y="-125" width="230" height="80" rx="12" fill="url(#layerA)" stroke="#431407" stroke-width="2"/>
    <text x="0" y="-90" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Identity Proxy</text>
    <text x="0" y="-70" fill="#fed7aa" font-size="10" text-anchor="middle">no exposed ports</text>
  </g>

  <!-- bottom-left: mesh-cube mark + wordmark -->
  <g color="#94a3b8">
    <g transform="translate(145, 592) scale(0.12)">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <g stroke-width="4" stroke-dasharray="8 5" opacity="0.55">
          <line x1="0" y1="-150" x2="0" y2="-240"/>
          <line x1="130" y1="-75" x2="208" y2="-120"/>
          <line x1="130" y1="75" x2="208" y2="120"/>
          <line x1="0" y1="150" x2="0" y2="240"/>
          <line x1="-130" y1="75" x2="-208" y2="120"/>
          <line x1="-130" y1="-75" x2="-208" y2="-120"/>
        </g>
        <g stroke-width="3">
          <circle cx="0" cy="-240" r="8"/>
          <circle cx="208" cy="-120" r="8"/>
          <circle cx="208" cy="120" r="8"/>
          <circle cx="0" cy="240" r="8"/>
          <circle cx="-208" cy="120" r="8"/>
          <circle cx="-208" cy="-120" r="8"/>
        </g>
        <g stroke-width="2.5" stroke-dasharray="6 4" opacity="0.35">
          <line x1="0" y1="0" x2="0" y2="-150"/>
          <line x1="0" y1="0" x2="-130" y2="75"/>
          <line x1="0" y1="0" x2="130" y2="75"/>
        </g>
        <g stroke-width="8">
          <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75"/>
          <line x1="0" y1="0" x2="130" y2="-75"/>
          <line x1="0" y1="0" x2="-130" y2="-75"/>
        </g>
      </g>
    </g>
    <text x="190" y="598" fill="#94a3b8" font-size="17" font-weight="900" letter-spacing="4">JIMESH</text>
  </g>
</svg>
