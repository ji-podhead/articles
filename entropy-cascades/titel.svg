<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="60%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="barFlat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="barSpike" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M 0,75 L 1200,75 M 0,150 L 1200,150 M 0,225 L 1200,225 M 0,300 L 1200,300 M 0,375 L 1200,375 M 0,450 L 1200,450 M 0,525 L 1200,525 M 0,600 L 1200,600"/>
    <path d="M 150,0 L 150,675 M 300,0 L 300,675 M 450,0 L 450,675 M 600,0 L 600,675 M 750,0 L 750,675 M 900,0 L 900,675 M 1050,0 L 1050,675"/>
  </g>

  <g opacity="0.15">
    <circle cx="950" cy="337" r="280" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="12,6"/>
    <circle cx="950" cy="337" r="200" fill="none" stroke="#818cf8" stroke-width="4"/>
    <circle cx="950" cy="337" r="120" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="4,4"/>
  </g>

  <!-- left: typography -->
  <g transform="translate(100, 170)">
    <text x="0" y="50" fill="#ffffff" font-weight="900" font-size="50" letter-spacing="-1">The Confidence Signal</text>
    <text x="0" y="113" fill="url(#accentGrad)" font-weight="900" font-size="50" letter-spacing="-1">Is Already in the Response</text>

    <text x="0" y="175" fill="#94a3b8" font-size="20">Entropy-Gated Model Cascades — no classifier,</text>
    <text x="0" y="201" fill="#94a3b8" font-size="20">no labeled data, no extra infrastructure</text>

    <g transform="translate(0, 245)" font-family="monospace" font-size="15" fill="#64748b">
      <text x="0" y="0"><tspan fill="#f43f5e"># </tspan>{ <tspan fill="#10b981">"logprobs": true, "top_logprobs": 5</tspan> }</text>
      <text x="0" y="30" fill="#475569">➔ [entropy] H_norm = 0.31 &lt; 0.45 → serve routing model</text>
      <text x="0" y="55" fill="#f97316">➔ [entropy] H_norm = 0.71 ≥ 0.45 → discard, escalate</text>
    </g>
  </g>

  <!-- right: hexagon with token distributions -->
  <g transform="translate(950, 337)" filter="url(#softShadow)">
    <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="3"/>
    <!-- uncertain distribution (top) -->
    <g transform="translate(-75, -100)">
      <rect x="0"   y="28" width="26" height="42" fill="url(#barFlat)" rx="3"/>
      <rect x="32"  y="24" width="26" height="46" fill="url(#barFlat)" rx="3"/>
      <rect x="64"  y="32" width="26" height="38" fill="url(#barFlat)" rx="3"/>
      <rect x="96"  y="26" width="26" height="44" fill="url(#barFlat)" rx="3"/>
      <rect x="128" y="30" width="26" height="40" fill="url(#barFlat)" rx="3"/>
    </g>
    <text x="0" y="-86" fill="#fb923c" font-size="11" text-anchor="middle" font-family="monospace">H ≥ 0.45 → escalate</text>
    <!-- confident distribution (bottom) -->
    <g transform="translate(-75, 8)">
      <rect x="0"   y="62" width="26" height="14" fill="url(#barSpike)" rx="3"/>
      <rect x="32"  y="8"  width="26" height="68" fill="url(#barSpike)" rx="3"/>
      <rect x="64"  y="66" width="26" height="10" fill="url(#barSpike)" rx="3"/>
      <rect x="96"  y="62" width="26" height="14" fill="url(#barSpike)" rx="3"/>
      <rect x="128" y="64" width="26" height="12" fill="url(#barSpike)" rx="3"/>
    </g>
    <text x="0" y="115" fill="#4ade80" font-size="11" text-anchor="middle" font-family="monospace">H &lt; 0.45 → serve</text>
  </g>

  <!-- bottom-left: mesh-cube mark + wordmark -->
  <g color="#94a3b8">
    <g transform="translate(145, 592) scale(0.12)">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <g stroke-width="4" stroke-dasharray="8 5" opacity="0.55">
          <line x1="0" y1="-150" x2="0" y2="-240"/>
          <line x1="130" y1="-75" x2="208" y2="-120"/>
          <line x1="130" y1="75" x2="208" y2="120"/>
          <line x1="0" y1="150" x2="0" y2="240"/>
          <line x1="-130" y1="75" x2="-208" y2="120"/>
          <line x1="-130" y1="-75" x2="-208" y2="-120"/>
        </g>
        <g stroke-width="3">
          <circle cx="0" cy="-240" r="8"/>
          <circle cx="208" cy="-120" r="8"/>
          <circle cx="208" cy="120" r="8"/>
          <circle cx="0" cy="240" r="8"/>
          <circle cx="-208" cy="120" r="8"/>
          <circle cx="-208" cy="-120" r="8"/>
        </g>
        <g stroke-width="2.5" stroke-dasharray="6 4" opacity="0.35">
          <line x1="0" y1="0" x2="0" y2="-150"/>
          <line x1="0" y1="0" x2="-130" y2="75"/>
          <line x1="0" y1="0" x2="130" y2="75"/>
        </g>
        <g stroke-width="8">
          <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75"/>
          <line x1="0" y1="0" x2="130" y2="-75"/>
          <line x1="0" y1="0" x2="-130" y2="-75"/>
        </g>
      </g>
    </g>
    <text x="190" y="598" fill="#94a3b8" font-size="17" font-weight="900" letter-spacing="4">JIMESH</text>
  </g>
</svg>
