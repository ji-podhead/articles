<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="300" viewBox="0 0 1050 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="1050" height="300" fill="#0f172a"/>

  <!-- client -->
  <rect x="30" y="120" width="130" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="95" y="145" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="bold">Client</text>
  <text x="95" y="163" fill="#94a3b8" font-size="11" text-anchor="middle">request</text>

  <!-- entropy gate -->
  <rect x="220" y="105" width="190" height="90" rx="10" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
  <text x="315" y="132" fill="#e0e7ff" font-size="14" text-anchor="middle" font-weight="bold">Entropy Gate</text>
  <text x="315" y="152" fill="#c7d2fe" font-size="11" text-anchor="middle">logprobs · top_logprobs=5</text>
  <text x="315" y="170" fill="#c7d2fe" font-size="11" text-anchor="middle">H_norm = H / log₂(k)</text>
  <text x="315" y="186" fill="#a5b4fc" font-size="11" text-anchor="middle">avg over response · thr 0.45</text>

  <!-- phase 1 routing model -->
  <rect x="490" y="30" width="200" height="70" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="590" y="58" fill="#dcfce7" font-size="14" text-anchor="middle" font-weight="bold">Phase 1: Routing Model</text>
  <text x="590" y="78" fill="#86efac" font-size="11" text-anchor="middle">cheap · full response · stream=false</text>

  <!-- reasoning model -->
  <rect x="490" y="200" width="200" height="70" rx="10" fill="#7c2d12" stroke="#f97316" stroke-width="2"/>
  <text x="590" y="228" fill="#ffedd5" font-size="14" text-anchor="middle" font-weight="bold">Reasoning Model</text>
  <text x="590" y="248" fill="#fdba74" font-size="11" text-anchor="middle">expensive · chain routing</text>

  <!-- accept path -->
  <path d="M 410 130 L 445 130 Q 460 130 460 100 L 460 75 Q 460 65 475 65 L 490 65" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <text x="452" y="52" fill="#4ade80" font-size="12" text-anchor="middle" font-weight="bold">probe</text>
  <rect x="700" y="42" width="150" height="46" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
  <text x="775" y="32" fill="#4ade80" font-size="12" text-anchor="middle" font-weight="bold">H &lt; 0.45</text>
  <text x="775" y="62" fill="#86efac" font-size="12" text-anchor="middle" font-weight="bold">✓ Serve directly</text>
  <text x="775" y="78" fill="#4ade80" font-size="10" text-anchor="middle">fast · cheap-model price</text>
  <path d="M 690 65 L 700 65" fill="none" stroke="#22c55e" stroke-width="2.5"/>

  <!-- discard + escalate path -->
  <path d="M 410 165 L 445 165 Q 460 165 460 205 L 460 230 Q 460 235 475 235 L 490 235" fill="none" stroke="#f97316" stroke-width="2.5"/>
  <text x="450" y="205" fill="#fb923c" font-size="12" text-anchor="middle" font-weight="bold">escalate</text>
  <rect x="700" y="212" width="330" height="46" rx="8" fill="#431407" stroke="#f97316" stroke-width="1.5"/>
  <text x="865" y="204" fill="#fb923c" font-size="12" text-anchor="middle" font-weight="bold">H ≥ 0.45</text>
  <text x="865" y="232" fill="#fdba74" font-size="12" text-anchor="middle" font-weight="bold">✗ Discard answer · re-route original request</text>
  <text x="865" y="248" fill="#fb923c" font-size="10" text-anchor="middle">normal chain: bandit · failover · quota · feedback</text>
  <path d="M 690 235 L 700 235" fill="none" stroke="#f97316" stroke-width="2.5"/>

  <!-- fail-open note -->
  <text x="315" y="218" fill="#64748b" font-size="10" text-anchor="middle">phase-1 error → fail-open:</text>
  <text x="315" y="231" fill="#64748b" font-size="10" text-anchor="middle">normal routing continues</text>

  <line x1="30" y1="285" x2="1020" y2="285" stroke="#334155" stroke-width="1"/>
  <text x="525" y="297" fill="#475569" font-size="10" text-anchor="middle">jimesh gateway · entropy-gated cascade · no classifier, no labeled data</text>
</svg>
