<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="60%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#3a506b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2496ed" />
      <stop offset="100%" stop-color="#1d7fd6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M 0,75 L 1200,75 M 0,150 L 1200,150 M 0,225 L 1200,225 M 0,300 L 1200,300 M 0,375 L 1200,375 M 0,450 L 1200,450 M 0,525 L 1200,525 M 0,600 L 1200,600" />
    <path d="M 150,0 L 150,675 M 300,0 L 300,675 M 450,0 L 450,675 M 600,0 L 600,675 M 750,0 L 750,675 M 900,0 L 900,675 M 1050,0 L 1050,675" />
  </g>

  <g opacity="0.15">
    <circle cx="950" cy="337" r="280" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="12,6"/>
    <circle cx="950" cy="337" r="200" fill="none" stroke="#818cf8" stroke-width="4"/>
    <circle cx="950" cy="337" r="120" fill="none" stroke="#2496ed" stroke-width="1" stroke-dasharray="4,4"/>
  </g>

  <!-- Left Side: Typography & Title -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="260" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="130" y="19" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1" text-anchor="middle">AGENTIC AUTOMATION</text>

    <text x="0" y="90" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="48" letter-spacing="-1">MCP Servers via Docker</text>
    <text x="0" y="150" fill="url(#accentGrad)" font-family="sans-serif" font-weight="900" font-size="48" letter-spacing="-1">+ SSE Transport</text>

    <text x="0" y="205" fill="#94a3b8" font-family="sans-serif" font-weight="normal" font-size="20">Wiring Google GenAI to real email workflows, isolated per agent</text>

    <g transform="translate(0, 255)" font-family="monospace" font-size="15" fill="#64748b">
      <text x="0" y="0"><tspan fill="#f43f5e"># </tspan>start-mcp-bridge.sh<tspan fill="#475569"> — docker run --network isolated </tspan><tspan fill="#2496ed">mcp-server:email</tspan></text>
      <text x="0" y="30" fill="#475569">➔ [SSE] remote transport bridge established...</text>
      <text x="0" y="55" fill="#38bdf8">➔ [litellm] 12 tools auto-fetched — no manual Pydantic</text>
    </g>
  </g>

  <!-- Right Side: docker container icon -->
  <g transform="translate(900, 337)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="110" fill="#2496ed" opacity="0.05" filter="url(#glow)"/>

    <polygon points="0,-120 100,-70 100,40 0,120 -100,40 -100,-70" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="4"/>
    <polygon points="0,-100 80,-60 80,30 0,100 -80,30 -80,-60" fill="url(#heroGrad)" opacity="0.18"/>

    <!-- container stack -->
    <g transform="translate(0, 20)">
      <rect x="-16" y="-55" width="14" height="14" fill="#2496ed" opacity="0.7"/>
      <rect x="1" y="-55" width="14" height="14" fill="#2496ed" opacity="0.55"/>
      <rect x="18" y="-55" width="14" height="14" fill="#2496ed" opacity="0.4"/>
      <path d="M -60,-35 C -60,-35 -70,5 -40,25 C -10,42 40,42 60,20 C 75,3 65,-35 65,-35 Z" fill="url(#heroGrad)" filter="url(#glow)"/>
      <circle cx="-30" cy="-5" r="7" fill="#ffffff" opacity="0.9"/>
      <circle cx="-5" cy="-5" r="7" fill="#ffffff" opacity="0.9"/>
      <circle cx="20" cy="-5" r="7" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>
</svg>
