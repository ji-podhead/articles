<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="MCP-SSE Docker Email Automation Architecture">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="dockerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2496ed"/>
      <stop offset="100%" stop-color="#1d7fd6"/>
    </linearGradient>
    <linearGradient id="genaiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="100%" stop-color="#34a853"/>
    </linearGradient>
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="sseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0,0 L 10,5 L 0,10" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
    <marker id="arrowSSE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0,0 L 10,5 L 0,10" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="none" stroke="#3a506b" stroke-width="1" opacity="0.3"/>

  <text x="600" y="42" text-anchor="middle" fill="#fafafa" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="900" letter-spacing="1.5">
    MCP-SSE DOCKER EMAIL AUTOMATION
  </text>
  <text x="600" y="64" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="13">
    remote MCP servers via SSE transport → GenAI agents → email workflows
  </text>

  <!-- ═══ GOOGLE GENAI (top-left) ═══ -->
  <g transform="translate(50, 100)">
    <rect width="280" height="200" rx="14" fill="#0f172a" stroke="url(#genaiGrad)" stroke-width="2"/>
    <rect width="280" height="46" rx="14" fill="url(#genaiGrad)" opacity="0.15"/>
    <text x="140" y="24" text-anchor="middle" fill="#4285f4" font-family="Segoe UI" font-size="16" font-weight="900">
      Google GenAI
    </text>
    <text x="140" y="40" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">
      the LLM agent layer
    </text>

    <!-- Brain/AI icon -->
    <g transform="translate(100, 60)">
      <circle cx="40" cy="30" r="28" fill="none" stroke="#4285f4" stroke-width="2"/>
      <circle cx="30" cy="22" r="8" fill="none" stroke="#34a853" stroke-width="1.5"/>
      <circle cx="52" cy="22" r="8" fill="none" stroke="#ea4335" stroke-width="1.5"/>
      <circle cx="40" cy="42" r="8" fill="none" stroke="#fbbc04" stroke-width="1.5"/>
      <line x1="38" y1="25" x2="44" y2="28" stroke="#4285f4" stroke-width="1"/>
      <line x1="48" y1="26" x2="44" y2="34" stroke="#4285f4" stroke-width="1"/>
      <line x1="34" y1="36" x2="42" y2="40" stroke="#4285f4" stroke-width="1"/>
    </g>
    <text x="140" y="125" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">litellm module</text>
    <text x="140" y="140" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">simplified tool parsing</text>
    <text x="140" y="158" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">no manual Pydantic errors</text>
    <text x="140" y="176" text-anchor="middle" fill="#34a853" font-family="monospace" font-size="9" font-weight="bold">✓ auto-fetches all tools</text>
  </g>

  <!-- ═══ SSE TRANSPORT (top-center arrow) ═══ -->
  <g transform="translate(380, 160)">
    <rect width="200" height="80" rx="10" fill="#0f172a" stroke="url(#sseGrad)" stroke-width="1.5"/>
    <text x="100" y="28" text-anchor="middle" fill="#f59e0b" font-family="Segoe UI" font-size="14" font-weight="900">
      SSE Transport
    </text>
    <text x="100" y="48" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">
      Server-Sent Events
    </text>
    <text x="100" y="66" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">
      remote access bridge
    </text>
    <!-- Animated arrows -->
    <line x1="20" y1="40" x2="60" y2="40" stroke="#f59e0b" stroke-width="2" opacity="0.7">
      <animate attributeName="x1" values="20;50;20" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="60;90;60" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="140" y1="40" x2="180" y2="40" stroke="#f59e0b" stroke-width="2" opacity="0.7">
      <animate attributeName="x1" values="140;170;140" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="180;200;180" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Flow arrows GenAI → SSE -->
  <line x1="330" y1="200" x2="380" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="200" x2="630" y2="200" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowSSE)"/>

  <!-- ═══ DOCKER CONTAINER (top-right) ═══ -->
  <g transform="translate(630, 100)">
    <rect width="300" height="200" rx="14" fill="#0f172a" stroke="url(#dockerGrad)" stroke-width="2" filter="url(#glow)"/>
    <rect width="300" height="46" rx="14" fill="url(#dockerGrad)" opacity="0.15"/>
    <text x="150" y="24" text-anchor="middle" fill="#2496ed" font-family="Segoe UI" font-size="16" font-weight="900">
      Docker Container
    </text>
    <text x="150" y="40" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">
      isolated per-agent environment
    </text>

    <!-- Docker whale simplified -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="50" height="30" rx="4" fill="#2496ed" opacity="0.3"/>
      <rect x="5" y="-10" width="10" height="10" fill="#2496ed" opacity="0.6"/>
      <rect x="20" y="-10" width="10" height="10" fill="#2496ed" opacity="0.5"/>
      <rect x="35" y="-10" width="10" height="10" fill="#2496ed" opacity="0.4"/>
      <text x="25" y="20" text-anchor="middle" fill="#2496ed" font-family="monospace" font-size="8">base image</text>
    </g>

    <!-- MCP Bridge inside container -->
    <g transform="translate(90, 55)">
      <rect x="0" y="0" width="180" height="60" rx="8" fill="#1e293b" stroke="url(#mcpGrad)" stroke-width="1.5"/>
      <text x="90" y="20" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="10" font-weight="bold">MCP-Bridge</text>
      <text x="90" y="36" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">remote access via SSE</text>
      <text x="90" y="50" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">script to start it</text>
    </g>

    <!-- MCP Server inside container -->
    <g transform="translate(90, 130)">
      <rect x="0" y="0" width="180" height="55" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
      <text x="90" y="20" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="10" font-weight="bold">MCP Server (JS)</text>
      <text x="90" y="36" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">email automation tools</text>
      <text x="90" y="48" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="8">🔒 credentials stored here</text>
    </g>
  </g>

  <!-- ═══ BENEFITS BAR (middle) ═══ -->
  <g transform="translate(50, 330)">
    <rect width="1100" height="140" rx="14" fill="#0f172a" stroke="#3a506b" stroke-width="1"/>
    <text x="550" y="28" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI" font-size="14" font-weight="700" letter-spacing="1">
      WHY THIS ARCHITECTURE
    </text>

    <g transform="translate(60, 50)">
      <rect width="240" height="70" rx="8" fill="#2496ed" opacity="0.08"/>
      <rect x="0" y="0" width="4" height="70" fill="#2496ed" rx="2"/>
      <text x="12" y="22" fill="#2496ed" font-family="Segoe UI" font-size="12" font-weight="700">CI/CD SEAMLESS</text>
      <text x="12" y="40" fill="#94a3b8" font-family="monospace" font-size="9">Docker enables automated</text>
      <text x="12" y="54" fill="#94a3b8" font-family="monospace" font-size="9">build + deploy pipelines</text>
    </g>

    <g transform="translate(330, 50)">
      <rect width="240" height="70" rx="8" fill="#34d399" opacity="0.08"/>
      <rect x="0" y="0" width="4" height="70" fill="#34d399" rx="2"/>
      <text x="12" y="22" fill="#34d399" font-family="Segoe UI" font-size="12" font-weight="700">SECURE ISOLATION</text>
      <text x="12" y="40" fill="#94a3b8" font-family="monospace" font-size="9">Docker containers provide</text>
      <text x="12" y="54" fill="#94a3b8" font-family="monospace" font-size="9">isolated, portable runtime</text>
    </g>

    <g transform="translate(600, 50)">
      <rect width="240" height="70" rx="8" fill="#f59e0b" opacity="0.08"/>
      <rect x="0" y="0" width="4" height="70" fill="#f59e0b" rx="2"/>
      <text x="12" y="22" fill="#f59e0b" font-family="Segoe UI" font-size="12" font-weight="700">NETWORK SEGMENTATION</text>
      <text x="12" y="40" fill="#94a3b8" font-family="monospace" font-size="9">each agent = own container</text>
      <text x="12" y="54" fill="#94a3b8" font-family="monospace" font-size="9">restrict access per network</text>
    </g>

    <g transform="translate(870, 50)">
      <rect width="200" height="70" rx="8" fill="#8b5cf6" opacity="0.08"/>
      <rect x="0" y="0" width="4" height="70" fill="#8b5cf6" rx="2"/>
      <text x="12" y="22" fill="#a78bfa" font-family="Segoe UI" font-size="12" font-weight="700">NO MANUAL TOOLS</text>
      <text x="12" y="40" fill="#94a3b8" font-family="monospace" font-size="9">install all MCPs → fetch</text>
      <text x="12" y="54" fill="#94a3b8" font-family="monospace" font-size="9">all tools at once</text>
    </g>
  </g>

  <!-- ═══ WHAT'S NEXT (bottom) ═══ -->
  <g transform="translate(50, 500)">
    <rect width="1100" height="140" rx="14" fill="#0f172a" stroke="#3a506b" stroke-width="1"/>
    <text x="550" y="28" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI" font-size="14" font-weight="700" letter-spacing="1">
      🔮 WHAT'S NEXT
    </text>

    <g transform="translate(60, 50)">
      <rect width="300" height="65" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="150" y="25" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI" font-size="12" font-weight="700">FastAPI Dashboard Integration</text>
      <text x="150" y="45" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">dashboard + websockets</text>
    </g>

    <g transform="translate(390, 50)">
      <rect width="300" height="65" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="150" y="25" text-anchor="middle" fill="#a5b4fc" font-family="Segoe UI" font-size="12" font-weight="700">Cronjobs + Webhooks</text>
      <text x="150" y="45" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">scheduled + event-driven workflows</text>
    </g>

    <g transform="translate(720, 50)">
      <rect width="330" height="65" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="165" y="25" text-anchor="middle" fill="#34d399" font-family="Segoe UI" font-size="12" font-weight="700">vs Claude Desktop</text>
      <text x="165" y="45" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">our approach: remote deployment + SSE transport</text>
    </g>
  </g>

  <text x="600" y="665" text-anchor="middle" fill="#475569" font-family="monospace" font-size="10">
    #MCP #Docker #GenAI #EmailAutomation #Agentics #SSE #CI/CD
  </text>
</svg>
