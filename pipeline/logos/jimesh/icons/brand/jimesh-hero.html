<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JiMesh — Brand Loop</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #070b14;
    overflow: hidden;
  }
  body {
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* ---- Atmosphaerischer Hintergrund: zwei langsam driftende Glow-Blobs ---- */
  .aurora {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .aurora span {
    position: absolute;
    width: 60vmax;
    height: 60vmax;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.22;
  }
  .aurora span:nth-child(1) {
    background: #00e5ff;
    top: -20%;
    left: -15%;
    animation: drift1 22s ease-in-out infinite alternate;
  }
  .aurora span:nth-child(2) {
    background: #00ffcc;
    bottom: -25%;
    right: -15%;
    animation: drift2 26s ease-in-out infinite alternate;
  }
  @keyframes drift1 {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(6vmax, 4vmax) scale(1.15); }
  }
  @keyframes drift2 {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(-5vmax, -6vmax) scale(1.1); }
  }

  /* ---- Marke: Icon (immer sichtbar, feste x-Position) + Text-Panel (klappt periodisch auf) ----
     .brand haengt per left:50% + fixem margin-left (halbe Icon-Breite) an einem fixen Punkt -
     das Text-Panel wird dahinter aufgeklappt/ausgeklappt, verschiebt das Icon aber nie, weil
     der Anker (margin-left) unabhaengig von der Textbreite ist. */
  .brand {
    position: absolute;
    top: 50%;
    left: 50%;
    margin-left: -100px; /* halbe Icon-Breite (200px/2) -> Icon bleibt am fixen Punkt */
    transform: translateY(-50%);
    z-index: 1;
    display: inline-flex;
    align-items: center;
  }

  .icon-wrap {
    position: relative;
    width: 200px;
    height: 200px;
    flex: 0 0 auto;
    animation: heartbeat 4.6s ease-in-out infinite;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.015); }
  }

  .icon-svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 0 22px rgba(56, 189, 248, 0.35));
  }

  /* Lichtstreif, der ueber den Schriftzug faehrt ("Tech-Intro"-Sweep). Sitzt jetzt auf dem
     Wordmark statt dem Icon - Icon bleibt ruhig (nur Heartbeat), Blinken passiert am Text. */
  .wordmark-wrap {
    position: relative;
    height: 92px;
    margin-left: 16px;
    flex: 0 0 auto;
    overflow: hidden;
  }
  .wordmark-shine {
    position: absolute;
    inset: -25%;
    background: linear-gradient(
      100deg,
      transparent 42%,
      rgba(255, 255, 255, 0.95) 49%,
      rgba(165, 243, 252, 0.95) 51%,
      transparent 58%
    );
    background-size: 320% 320%;
    background-repeat: no-repeat;
    mix-blend-mode: screen;
    pointer-events: none;
    opacity: 0;
    background-position: 0% 0%;
    animation: shineSweep 10s linear infinite;
  }
  @keyframes shineSweep {
    0%   { background-position: 0% 0%;   opacity: 0; }
    5%   { opacity: 1; }
    10%  { background-position: 100% 0%; opacity: 1; }
    15%  { opacity: 0; }
    100% { background-position: 100% 0%; opacity: 0; }
  }

  /* Trennstrich zwischen Icon und Text: ruht als statischer Divider an x=0 der Text-Area,
     wird aber per JS auch als bewegter Wipe-Cursor benutzt (erster String rein, letzter raus -
     beide Male links->rechts, siehe Script). */
  .divider {
    position: absolute;
    left: 0;
    top: 50%;
    width: 2px;
    height: 46px;
    transform: translateY(-50%);
    background: linear-gradient(180deg, transparent, rgba(165, 243, 252, 0.95), transparent);
    box-shadow: 0 0 8px rgba(56, 189, 248, 0.7);
    opacity: 0;
    pointer-events: none;
  }

  /* Statischer JiMesh-Schriftzug direkt neben dem Icon (Navbar-Look) */
  .wordmark {
    height: 100%;
    width: auto;
    display: block;
    filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.3));
  }

  /* Dezentes Sternenfeld: winzige, langsam blinkende Punkte hinter allem */
  .stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: #e0f2fe;
    opacity: var(--o, 0.3);
    animation: twinkle var(--d, 3s) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: calc(var(--o, 0.3) * 0.25); }
    to   { opacity: var(--o, 0.3); }
  }

  .text-area {
    position: relative;
  }

  .text-wrap {
    max-width: 0;
    margin-left: 0;
    overflow: hidden;
    white-space: nowrap;
    transition:
      max-width 0.7s cubic-bezier(.4,0,.2,1),
      margin-left 0.7s cubic-bezier(.4,0,.2,1);
  }
  .text-wrap.expanded {
    max-width: 720px;
    margin-left: 32px;
  }

  /* Weicher Glow-Backdrop hinter dem Text - zusaetzliche Ebene neben Scramble/Wipe,
     blurred + skaliert beim Auf-/Zuklappen des Panels rein/raus. */
  .text-glow {
    position: absolute;
    left: -20px;
    top: 50%;
    width: calc(100% + 40px);
    height: 84px;
    transform: translateY(-50%) scaleX(0.82);
    background: radial-gradient(ellipse 55% 100% at 25% 50%, rgba(56, 189, 248, 0.4), transparent 72%);
    filter: blur(18px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s ease, transform 0.45s cubic-bezier(.4,0,.2,1);
  }
  .text-glow.active {
    opacity: 1;
    transform: translateY(-50%) scaleX(1);
  }

  .tagline {
    display: inline-block;
    font-size: 48px;
    font-weight: 700;
    letter-spacing: 0.3px;
    font-variant-numeric: tabular-nums;
    clip-path: inset(0 100% 0 0);
    background: linear-gradient(90deg, #00e5ff, #00ffcc);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  /* Bei geskripteten Zeichen (Scramble) braucht jedes <span> seinen eigenen Verlauf,
     background-clip:text greift nur auf dem Element, das den Hintergrund traegt. */
  .tagline .ch {
    display: inline-block;
    background: linear-gradient(90deg, #00e5ff, #00ffcc);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    will-change: transform, filter, opacity;
  }

  /* ---- prefers-reduced-motion: statisches Frame, keine Bewegung ---- */
  @media (prefers-reduced-motion: reduce) {
    .icon-wrap, .wordmark-shine { animation: none !important; }
    .wordmark-shine { opacity: 0; }
    .aurora span { animation: none !important; }
    .star { animation: none !important; }
    .text-wrap {
      max-width: 720px;
      margin-left: 32px;
    }
    .tagline { clip-path: inset(0 0 0 0); }
    .divider { opacity: 0.35; }
  }
</style>
</head>
<body>

<div class="aurora" aria-hidden="true"><span></span><span></span></div>
<div class="stars" id="stars" aria-hidden="true"></div>

<div class="brand">
  <div class="icon-wrap">
<img class="icon-svg" src="svg/jimesh-mesh-cube-neon-small.svg" alt="JiMesh Logo">









  </div>

  <div class="wordmark-wrap">
  <img class="wordmark" src="svg/jimesh-text-solo-plain.svg" alt="JiMesh">
    <div class="wordmark-shine" aria-hidden="true"></div>
  </div>

  <div class="text-area">
    <div class="divider" id="divider" aria-hidden="true"></div>
    <div class="text-glow" id="textGlow" aria-hidden="true"></div>
    <div class="text-wrap" id="textWrap">
      <span class="tagline" id="taglineText"><span class="ch">L</span><span class="ch">L</span><span class="ch">M</span><span class="ch">&nbsp;</span><span class="ch">P</span><span class="ch">r</span><span class="ch">o</span><span class="ch">x</span><span class="ch">y</span><span class="ch">&nbsp;</span><span class="ch">R</span><span class="ch">o</span><span class="ch">u</span><span class="ch">t</span><span class="ch">e</span><span class="ch">r</span></span>
    </div>
  </div>
</div>

<noscript>
  <style>
    .text-wrap{max-width:720px;margin-left:32px}
    .tagline{clip-path:inset(0 0 0 0)}
    .divider{opacity:0.35}
    .icon-wrap,.wordmark-shine{animation:none}
  </style>
</noscript>

<script>
'use strict';

/* ===== Text-Morph-Loop: Logo bleibt die ganze Zeit sichtbar (Heartbeat + Shine
   laufen unabhaengig per CSS). Alle IDLE_MS klappt das Text-Panel rechts vom
   Logo auf, scrambled durch STRINGS und klappt danach wieder auf Logo-Breite
   zu. prefers-reduced-motion -> statisches Frame, keine Timer. ===== */

const STRINGS = [
  'LLM Proxy Router',
  'Multi-Agent Platform',
  'Agent Skills & MCP',
  'Dockerized MCP Library',
  'Sandboxed Infrastructure',
  'Container Security',
  'LLM & Agent Security',
  'Remote Explorer',
  'App Detection & Monitoring',
  'Adaptive Gateway',
  'Ship. Scale. Repeat.'
];
const IDLE_MS = 6000;
const EXPAND_MS = 550;
const REVEAL_MS = 360;
const HOLD_MS = 2800;
const HIDE_MS = 320;
const COLLAPSE_WAIT_MS = 500;

/* Sternenfeld: 70 winzige Punkte, jeweils eigene Blinkdauer/Phase (negativer Delay) */
(function makeStars() {
  const holder = document.getElementById('stars');
  if (!holder) return;
  for (let i = 0; i < 70; i++) {
    const st = document.createElement('span');
    st.className = 'star';
    const size = (Math.random() * 1.6 + 0.8).toFixed(2);
    st.style.width = size + 'px';
    st.style.height = size + 'px';
    st.style.left = (Math.random() * 100).toFixed(2) + '%';
    st.style.top = (Math.random() * 100).toFixed(2) + '%';
    st.style.setProperty('--o', (Math.random() * 0.4 + 0.15).toFixed(2));
    st.style.setProperty('--d', (Math.random() * 2.6 + 1.6).toFixed(2) + 's');
    st.style.animationDelay = (-Math.random() * 4).toFixed(2) + 's';
    holder.appendChild(st);
  }
})();

const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const forcedStill = /(?:^|[?&])still=1(?:&|$)/.test(location.search);

const textWrap = document.getElementById('textWrap');
const taglineEl = document.getElementById('taglineText');
const divider = document.getElementById('divider');
const textGlow = document.getElementById('textGlow');

const SCRAMBLE_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#/·';
const GLITCH_MS = 160;
const EDGE_SOFTNESS_PX = 34; /* Breite der Scramble/Blur-Zone direkt an der wandernden Sweep-Kante */

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function easeOutCubic(x) {
  return 1 - Math.pow(1 - x, 3);
}

/* Kurzer Glitch-Burst (RGB-Split + Skew-Jitter) als eigene Ebene ueber jeder
   Text-Umschaltung - klingt in GLITCH_MS linear ab. */
function glitchFrame(el, elapsed) {
  if (elapsed >= GLITCH_MS) {
    el.style.transform = '';
    el.style.textShadow = '';
    return;
  }
  const k = 1 - elapsed / GLITCH_MS;
  const dx = (Math.random() - 0.5) * 7 * k;
  const skew = (Math.random() - 0.5) * 4 * k;
  el.style.transform = `translateX(${dx.toFixed(2)}px) skewX(${skew.toFixed(2)}deg)`;
  el.style.textShadow =
    `${((Math.random() - 0.5) * 6 * k).toFixed(2)}px 0 rgba(34,211,238,0.75), ` +
    `${((Math.random() - 0.5) * 6 * k).toFixed(2)}px 0 rgba(167,139,250,0.75)`;
}

/* Wipe-Reveal: der Divider wandert links->rechts; jedes Zeichen loest sich per Scramble
   GENAU dann auf, wenn die Sweep-Kante seine echte Pixel-Position erreicht (nicht mehr
   zeitbasiert gestaffelt) - Kante und Text-Decode laufen dadurch exakt synchron. */
function wipeReveal(el, dividerEl, target, duration) {
  return new Promise(resolve => {
    const chars = target.split('');
    el.innerHTML = '';
    const spans = chars.map(ch => {
      const span = document.createElement('span');
      span.className = 'ch';
      span.textContent = ch === ' ' ? ' ' : ch;
      span.style.opacity = '0';
      el.appendChild(span);
      return span;
    });
    const width = el.getBoundingClientRect().width || 1;
    const positions = spans.map(s => s.offsetLeft);
    const start = performance.now();
    function frame(now) {
      const elapsed = now - start;
      const t = Math.min(1, elapsed / duration);
      const eased = easeOutCubic(t);
      glitchFrame(el, elapsed);
      const edgeX = eased * width;
      dividerEl.style.left = edgeX + 'px';
      for (let i = 0; i < spans.length; i++) {
        const span = spans[i];
        const local = Math.min(1, Math.max(0, (edgeX - positions[i]) / EDGE_SOFTNESS_PX + 0.5));
        if (chars[i] !== ' ') {
          span.textContent = local >= 1
            ? chars[i]
            : (local > 0 ? SCRAMBLE_CHARS[Math.floor(Math.random() * SCRAMBLE_CHARS.length)] : chars[i]);
        }
        span.style.opacity = String(Math.min(1, local * 1.3));
        span.style.filter = `blur(${((1 - local) * 4).toFixed(2)}px)`;
        span.style.transform = `translateY(${((1 - local) * 7).toFixed(2)}px)`;
      }
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        spans.forEach((span, i) => {
          span.textContent = chars[i] === ' ' ? ' ' : chars[i];
          span.style.opacity = '1';
          span.style.filter = 'none';
          span.style.transform = 'none';
        });
        el.style.transform = '';
        el.style.textShadow = '';
        dividerEl.style.left = width + 'px';
        resolve();
      }
    }
    requestAnimationFrame(frame);
  });
}

/* Wipe-Hide: derselbe Divider wandert nochmal links->rechts (gleiche Richtung, nicht
   rueckwaerts) ueber die AKTUELLEN Zeichen-Spans und blendet/verwischt sie dabei aus. */
function wipeHide(el, dividerEl, duration) {
  return new Promise(resolve => {
    const spans = Array.from(el.querySelectorAll('.ch'));
    if (spans.length === 0) { resolve(); return; }
    const width = el.getBoundingClientRect().width || 1;
    const positions = spans.map(s => s.offsetLeft);
    const start = performance.now();
    function frame(now) {
      const elapsed = now - start;
      const t = Math.min(1, elapsed / duration);
      const eased = easeOutCubic(t);
      glitchFrame(el, elapsed);
      const edgeX = eased * width;
      dividerEl.style.left = edgeX + 'px';
      for (let i = 0; i < spans.length; i++) {
        const local = Math.min(1, Math.max(0, (edgeX - positions[i]) / EDGE_SOFTNESS_PX + 0.5));
        spans[i].style.opacity = String(1 - Math.min(1, local * 1.3));
        spans[i].style.filter = `blur(${(local * 4).toFixed(2)}px)`;
        spans[i].style.transform = `translateY(${(-local * 7).toFixed(2)}px)`;
      }
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        el.innerHTML = '';
        el.style.transform = '';
        el.style.textShadow = '';
        resolve();
      }
    }
    requestAnimationFrame(frame);
  });
}

async function loop() {
  await sleep(IDLE_MS);
  textWrap.classList.add('expanded');
  textGlow.classList.add('active');
  divider.style.left = '0px';
  divider.style.opacity = '1';
  await sleep(EXPAND_MS);
  await wipeReveal(taglineEl, divider, STRINGS[0], REVEAL_MS);
  await sleep(HOLD_MS);
  for (const s of STRINGS.slice(1)) {
    await wipeHide(taglineEl, divider, HIDE_MS);
    await wipeReveal(taglineEl, divider, s, REVEAL_MS);
    await sleep(HOLD_MS);
  }
  await wipeHide(taglineEl, divider, HIDE_MS);
  divider.style.opacity = '0';
  textGlow.classList.remove('active');
  textWrap.classList.remove('expanded');
  await sleep(COLLAPSE_WAIT_MS);
  loop();
}

if (reduced || forcedStill) {
  taglineEl.textContent = STRINGS[0];
  taglineEl.style.clipPath = 'inset(0 0 0 0)';
  divider.style.left = '0px';
  divider.style.opacity = '0.35';
  textWrap.classList.add('expanded');
} else {
  loop();
}
</script>

</body>
</html>
