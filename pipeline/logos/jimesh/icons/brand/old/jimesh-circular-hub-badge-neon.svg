<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="JiMesh Igel-Variante: Circular Hub Badge Neon (App-Icon/Favicon)">
  <defs>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Gefuellte Kreis-Flaeche: funktioniert auch klein (Favicon/Avatar) -->
  <circle cx="400" cy="400" r="380" fill="url(#badgeBg)"/>
  <circle cx="400" cy="400" r="360" fill="none" stroke="#334155" stroke-width="4"/>
  <!-- Technische Deko: feine gestrichelte Zier-Ringe -->
  <circle cx="400" cy="400" r="344" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="3 14" opacity="0.8"/>
  <circle cx="400" cy="400" r="258" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-dasharray="2 10" opacity="0.9"/>

  <g transform="translate(400, 400)">
    <!-- Ring + Nodes in hellem Cyan, damit sie auf dem dunklen Badge-Grund tragen -->
    <circle cx="0" cy="0" r="230" fill="none" stroke="url(#ringGrad)" stroke-width="16" opacity="0.9" filter="url(#glow)"/>

    <g stroke="url(#beamGrad)" stroke-width="14" stroke-linecap="round" filter="url(#softGlow)">
      <line x1="-94" y1="-94" x2="-162" y2="-162"/>
      <line x1="-162" y1="-162" x2="-249" y2="-249"/>
      <line x1="0" y1="-133" x2="0" y2="-230"/>
      <line x1="0" y1="-230" x2="0" y2="-350"/>
      <line x1="94" y1="-94" x2="162" y2="-162"/>
      <line x1="162" y1="-162" x2="249" y2="-249"/>
      <line x1="-133" y1="0" x2="-230" y2="0"/>
      <line x1="-230" y1="0" x2="-350" y2="0"/>
    </g>
    <!-- Signal-Pulse: feine weisse Dash-Overlays auf denselben Beams (kein Versatz) -->
    <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 18" opacity="0.7">
      <line x1="-94" y1="-94" x2="-162" y2="-162"/>
      <line x1="-162" y1="-162" x2="-249" y2="-249"/>
      <line x1="0" y1="-133" x2="0" y2="-230"/>
      <line x1="0" y1="-230" x2="0" y2="-350"/>
      <line x1="94" y1="-94" x2="162" y2="-162"/>
      <line x1="162" y1="-162" x2="249" y2="-249"/>
      <line x1="-133" y1="0" x2="-230" y2="0"/>
      <line x1="-230" y1="0" x2="-350" y2="0"/>
    </g>

    <!-- Nodes mit Halo-Ring + Glanzpunkt -->
    <g filter="url(#softGlow)">
      <circle cx="-249" cy="-249" r="48" fill="none" stroke="#10b981" stroke-width="3" opacity="0.35"/>
      <circle cx="-249" cy="-249" r="34" fill="#10b981"/>
      <circle cx="-260" cy="-260" r="9" fill="#a7f3d0" opacity="0.9"/>

      <circle cx="0" cy="-350" r="60" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.35"/>
      <circle cx="0" cy="-350" r="44" fill="#38bdf8"/>
      <circle cx="-14" cy="-364" r="11" fill="#e0f2fe" opacity="0.9"/>

      <circle cx="249" cy="-249" r="48" fill="none" stroke="#10b981" stroke-width="3" opacity="0.35"/>
      <circle cx="249" cy="-249" r="34" fill="#10b981"/>
      <circle cx="238" cy="-260" r="9" fill="#a7f3d0" opacity="0.9"/>

      <circle cx="-350" cy="0" r="41" fill="none" stroke="#94a3b8" stroke-width="3" opacity="0.35"/>
      <circle cx="-350" cy="0" r="29" fill="#94a3b8"/>
      <circle cx="-359" cy="-9" r="8" fill="#e2e8f0" opacity="0.9"/>
    </g>

    <!-- Akzent-Bogen um den Kern (offener Kreis-Segment-Look) -->
    <circle cx="0" cy="0" r="158" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"
            stroke-dasharray="170 823" transform="rotate(-125)" opacity="0.55"/>

    <!-- Igel-Kern: eingerollte Kugelform, hell auf dunklem Badge-Grund -->
    <g transform="translate(0, -17)">
      <circle cx="0" cy="0" r="133" fill="#f8fafc"/>
      <circle cx="94" cy="65" r="34" fill="#f8fafc"/>
      <circle cx="44" cy="2" r="24" fill="#0f172a"/>
      <circle cx="51" cy="-5" r="8.5" fill="#38bdf8"/>
    </g>
  </g>
</svg>
