<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 100" width="100%" height="100%">
  <defs>
    <!-- Deep Tech Text Gradient (Passend zum Shield-Verlauf) -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
  </defs>

  <style>
    /* Hauptmarke: Extrem fett, moderner Cyber-Schnitt, weites Letter-Spacing */
    .brand-text-solo {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 900;
      font-size: 64px;
      fill: url(#text-grad);
      letter-spacing: 12px;
      text-anchor: middle;
    }
  </style>

  <!-- Hintergrund ist transparent für maximale Flexibilität -->
  <g transform="translate(350, 50)">
    <!-- Hauptschriftzug (JiMesh) - ohne Untertitel, fuer Platzierung ueber eigenem animierten Text -->
    <text x="6" y="0" class="brand-text-solo">JIMESH</text>
  </g>
</svg>
