<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="60%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="badgeA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="badgeB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="badgeC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M 0,75 L 1200,75 M 0,150 L 1200,150 M 0,225 L 1200,225 M 0,300 L 1200,300 M 0,375 L 1200,375 M 0,450 L 1200,450 M 0,525 L 1200,525 M 0,600 L 1200,600"/>
    <path d="M 150,0 L 150,675 M 300,0 L 300,675 M 450,0 L 450,675 M 600,0 L 600,675 M 750,0 L 750,675 M 900,0 L 900,675 M 1050,0 L 1050,675"/>
  </g>

  <g opacity="0.15">
    <circle cx="950" cy="360" r="280" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="12,6"/>
    <circle cx="950" cy="360" r="200" fill="none" stroke="#818cf8" stroke-width="4"/>
    <circle cx="950" cy="360" r="120" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="4,4"/>
  </g>

  <!-- left: typography, no badge box (current convention) -->
  <g transform="translate(80, 165)">
    <text x="0" y="0" fill="#ffffff" font-weight="900" font-size="52" letter-spacing="-1">The Badge, Not</text>
    <text x="0" y="62" fill="url(#accentGrad)" font-weight="900" font-size="52" letter-spacing="-1">the Master Key</text>

    <text x="0" y="112" fill="#94a3b8" font-size="20">Why AI agents need their own identity,</text>
    <text x="0" y="140" fill="#94a3b8" font-size="20">not a shared service account, and what a</text>
    <text x="0" y="168" fill="#94a3b8" font-size="20">real 2026 incident proved about it.</text>

    <g transform="translate(0, 216)" font-family="monospace" font-size="14" fill="#64748b">
      <text x="0" y="0"><tspan fill="#f43f5e"># </tspan>X-Agent-Identity: stripped on every request, always</text>
      <text x="0" y="26" fill="#a78bfa">➔ identity resolved server-side, from the credential</text>
      <text x="0" y="52" fill="#10b981">➔ policy = deterministic code, never a model call</text>
    </g>
  </g>

  <!-- right: master key crossed out, badges flowing into a gateway -->
  <g transform="translate(945, 340)" filter="url(#softShadow)">
    <g transform="translate(0,-150)">
      <circle cx="-38" cy="0" r="22" fill="none" stroke="#fca5a5" stroke-width="7"/>
      <rect x="-16" y="-4" width="70" height="8" fill="#fca5a5"/>
      <rect x="30" y="-4" width="14" height="18" fill="#fca5a5"/>
      <rect x="52" y="-4" width="10" height="24" fill="#fca5a5"/>
      <line x1="-60" y1="-26" x2="70" y2="26" stroke="#f43f5e" stroke-width="6"/>
      <text x="4" y="46" fill="#fca5a5" font-size="12" text-anchor="middle" font-weight="bold">ONE SHARED SERVICE ACCOUNT</text>
    </g>

    <rect x="-110" y="-40" width="220" height="80" rx="12" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="3"/>
    <text x="0" y="-6" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">GATEWAY</text>
    <text x="0" y="16" fill="#93c5fd" font-size="10" text-anchor="middle">deterministic policy, per request</text>

    <g transform="translate(-170, 130)">
      <rect x="0" y="0" width="90" height="56" rx="8" fill="url(#badgeA)"/>
      <text x="45" y="24" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">Agent A</text>
      <text x="45" y="40" fill="#e0f2fe" font-size="8" text-anchor="middle">own key</text>
      <line x1="45" y1="0" x2="0" y2="-50" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 3"/>
    </g>
    <g transform="translate(-45, 130)">
      <rect x="0" y="0" width="90" height="56" rx="8" fill="url(#badgeB)"/>
      <text x="45" y="24" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">Agent B</text>
      <text x="45" y="40" fill="#ede9fe" font-size="8" text-anchor="middle">own key</text>
      <line x1="45" y1="0" x2="30" y2="-50" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 3"/>
    </g>
    <g transform="translate(80, 130)">
      <rect x="0" y="0" width="90" height="56" rx="8" fill="url(#badgeC)"/>
      <text x="45" y="24" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">Agent C</text>
      <text x="45" y="40" fill="#dcfce7" font-size="8" text-anchor="middle">own key</text>
      <line x1="45" y1="0" x2="60" y2="-50" stroke="#22c55e" stroke-width="2" stroke-dasharray="4 3"/>
    </g>
  </g>

  <!-- bottom-left: mesh-cube mark + wordmark -->
  <g color="#94a3b8">
    <g transform="translate(145, 592) scale(0.12)">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <g stroke-width="4" stroke-dasharray="8 5" opacity="0.55">
          <line x1="0" y1="-150" x2="0" y2="-240"/>
          <line x1="130" y1="-75" x2="208" y2="-120"/>
          <line x1="130" y1="75" x2="208" y2="120"/>
          <line x1="0" y1="150" x2="0" y2="240"/>
          <line x1="-130" y1="75" x2="-208" y2="120"/>
          <line x1="-130" y1="-75" x2="-208" y2="-120"/>
        </g>
        <g stroke-width="3">
          <circle cx="0" cy="-240" r="8"/>
          <circle cx="208" cy="-120" r="8"/>
          <circle cx="208" cy="120" r="8"/>
          <circle cx="0" cy="240" r="8"/>
          <circle cx="-208" cy="120" r="8"/>
          <circle cx="-208" cy="-120" r="8"/>
        </g>
        <g stroke-width="2.5" stroke-dasharray="6 4" opacity="0.35">
          <line x1="0" y1="0" x2="0" y2="-150"/>
          <line x1="0" y1="0" x2="-130" y2="75"/>
          <line x1="0" y1="0" x2="130" y2="75"/>
        </g>
        <g stroke-width="8">
          <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75"/>
          <line x1="0" y1="0" x2="130" y2="-75"/>
          <line x1="0" y1="0" x2="-130" y2="-75"/>
        </g>
      </g>
    </g>
    <text x="190" y="598" fill="#94a3b8" font-size="17" font-weight="900" letter-spacing="4">JIMESH</text>
  </g>
</svg>
