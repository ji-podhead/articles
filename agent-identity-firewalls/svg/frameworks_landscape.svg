<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1111" viewBox="0 0 1200 1111" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="1111" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">The real open-source landscape (every one of these</text>
<text x="40" y="94" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">independently verified, not taken on an AI summary's word)</text>
<rect x="40" y="110" width="410" height="45" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="136" font-size="15" font-weight="bold" fill="#8b949e">Tool</text>
<rect x="454" y="110" width="270" height="45" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="472" y="136" font-size="15" font-weight="bold" fill="#8b949e">Layer</text>
<rect x="728" y="110" width="432" height="45" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="746" y="136" font-size="15" font-weight="bold" fill="#8b949e">What it actually does</text>
<rect x="40" y="159" width="410" height="150" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="185" font-size="15" font-weight="bold" fill="#8b949e">Pipelock</text>
<text x="58" y="206" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">github.com/luckyPipewrench/pipelock</text>
<text x="58" y="227" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Apache 2.0 core, Go</text>
<text x="58" y="248" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="58" y="269" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="58" y="290" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<rect x="454" y="159" width="270" height="150" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="454" y="159" width="5" height="150" rx="2.5" fill="#60a5fa"/>
<text x="472" y="185" font-size="15" font-weight="bold" fill="#60a5fa">Network mediation</text>
<text x="472" y="206" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="472" y="227" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="472" y="248" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="472" y="269" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="472" y="290" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<rect x="728" y="159" width="432" height="150" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="746" y="185" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Agent holds secrets but no direct network access;</text>
<text x="746" y="206" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Pipelock holds network access but no agent secrets.</text>
<text x="746" y="227" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Emits mediator-signed action receipts per call,</text>
<text x="746" y="248" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">offline-verifiable proof of which agent/thread did</text>
<text x="746" y="269" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">what, without a shared credential ever being</text>
<text x="746" y="290" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">trusted.</text>
<rect x="40" y="313" width="410" height="129" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="339" font-size="15" font-weight="bold" fill="#8b949e">Agent Wall</text>
<text x="58" y="360" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">github.com/agent-wall/agent-wall</text>
<text x="58" y="381" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">MIT</text>
<text x="58" y="402" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="58" y="423" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<rect x="454" y="313" width="270" height="129" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="454" y="313" width="5" height="129" rx="2.5" fill="#60a5fa"/>
<text x="472" y="339" font-size="15" font-weight="bold" fill="#60a5fa">MCP reverse proxy</text>
<text x="472" y="360" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="472" y="381" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="472" y="402" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="472" y="423" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<rect x="728" y="313" width="432" height="129" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="746" y="339" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">&quot;Cloudflare for AI agents&quot;, wraps an MCP server</text>
<text x="746" y="360" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">transparently. Inbound: kill switches, injection</text>
<text x="746" y="381" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">detection. Outbound: scans responses for 14 secret</text>
<text x="746" y="402" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">+ 5 PII patterns before they reach the LLM. YAML</text>
<text x="746" y="423" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">policy, allow/deny/prompt per rule.</text>
<rect x="40" y="446" width="410" height="108" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="472" font-size="15" font-weight="bold" fill="#8b949e">LlamaFirewall</text>
<text x="58" y="493" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">arxiv.org/abs/2505.03574 (Meta)</text>
<text x="58" y="514" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Purple Llama, open source</text>
<text x="58" y="535" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<rect x="454" y="446" width="270" height="108" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="454" y="446" width="5" height="108" rx="2.5" fill="#60a5fa"/>
<text x="472" y="472" font-size="15" font-weight="bold" fill="#60a5fa">Content safety</text>
<text x="472" y="493" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="472" y="514" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="472" y="535" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<rect x="728" y="446" width="432" height="108" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="746" y="472" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">PromptGuard 2 + Agent Alignment Checks</text>
<text x="746" y="493" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">(chain-of-thought auditor) + CodeShield.</text>
<text x="746" y="514" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Not authorization, see the Big Tech diagram for why</text>
<text x="746" y="535" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">this is a separate layer.</text>
<rect x="40" y="558" width="410" height="129" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="584" font-size="15" font-weight="bold" fill="#8b949e">Cedar / Open Policy Agent</text>
<text x="58" y="605" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">cedarpolicy.com/en · openpolicyagent.org</text>
<text x="58" y="626" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Cedar: AWS. OPA: CNCF-graduated.</text>
<text x="58" y="647" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="58" y="668" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<rect x="454" y="558" width="270" height="129" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="454" y="558" width="5" height="129" rx="2.5" fill="#60a5fa"/>
<text x="472" y="584" font-size="15" font-weight="bold" fill="#60a5fa">Policy-as-code</text>
<text x="472" y="605" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="472" y="626" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="472" y="647" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="472" y="668" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<rect x="728" y="558" width="432" height="129" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="746" y="584" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Deterministic, formally-checkable allow/deny</text>
<text x="746" y="605" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">languages. The decision is plain code, an LLM</text>
<text x="746" y="626" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">cannot argue its way past a Rego or Cedar policy. A</text>
<text x="746" y="647" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">platform can already build its own capability gate</text>
<text x="746" y="668" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">on top of either engine directly.</text>
<rect x="40" y="691" width="410" height="129" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="717" font-size="15" font-weight="bold" fill="#8b949e">SPIFFE / SPIRE</text>
<text x="58" y="738" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">spiffe.io</text>
<text x="58" y="759" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">CNCF standard</text>
<text x="58" y="780" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="58" y="801" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<rect x="454" y="691" width="270" height="129" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="454" y="691" width="5" height="129" rx="2.5" fill="#60a5fa"/>
<text x="472" y="717" font-size="15" font-weight="bold" fill="#60a5fa">Workload identity</text>
<text x="472" y="738" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="472" y="759" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="472" y="780" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="472" y="801" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<rect x="728" y="691" width="432" height="129" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="746" y="717" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Short-lived X.509 (X.509-SVID) or JWT (JWT-SVID)</text>
<text x="746" y="738" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">issued after a local attestor verifies HOW a process</text>
<text x="746" y="759" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">launched, distinguishes process A from process B on</text>
<text x="746" y="780" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">the same host, even sharing one container image</text>
<text x="746" y="801" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">and one IAM role.</text>
<rect x="40" y="824" width="410" height="129" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="850" font-size="15" font-weight="bold" fill="#8b949e">Coder</text>
<text x="58" y="871" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">coder.com/docs</text>
<text x="58" y="892" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">verified via own docs</text>
<text x="58" y="913" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="58" y="934" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<rect x="454" y="824" width="270" height="129" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="454" y="824" width="5" height="129" rx="2.5" fill="#60a5fa"/>
<text x="472" y="850" font-size="15" font-weight="bold" fill="#60a5fa">Control-plane isolation</text>
<text x="472" y="871" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="472" y="892" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="472" y="913" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="472" y="934" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<rect x="728" y="824" width="432" height="129" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="746" y="850" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">The agent LOOP runs in Coder's control plane, never</text>
<text x="746" y="871" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">inside the workspace, so a workspace never holds</text>
<text x="746" y="892" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">an LLM-calling credential at all, by construction. No</text>
<text x="746" y="913" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">dedicated agent firewall or per-project RBAC</text>
<text x="746" y="934" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">described in their own docs, though.</text>
<rect x="40" y="969" width="1120" height="108" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="995" font-size="15" font-weight="bold" fill="#8b949e">None of these is a substitute for the others, and none of them is &quot;infrastructure&quot;</text>
<text x="58" y="1016" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Every tool above is a layer you bolt onto a network/containers/agents you already have. A platform that provisions the network, the egress</text>
<text x="58" y="1037" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">firewall, and the containers itself gets that isolation by construction, the tools above add it gets deployed in the first place. The ideas above are</text>
<text x="58" y="1058" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">worth adopting selectively, see the full research for exactly which two.</text>
</svg>