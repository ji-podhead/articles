<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="672" viewBox="0 0 1200 672" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="672" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">Ingress-derived-only: the gateway is the only place identity is</text>
<text x="40" y="94" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">ever decided</text>
<rect x="391" y="110" width="418" height="66" rx="11" fill="#161b22" stroke="#f87171" stroke-width="2"/>
<rect x="391" y="110" width="5" height="66" rx="2.5" fill="#f87171"/>
<text x="409" y="136" font-size="15" font-weight="bold" fill="#f87171">Agent's own request arrives</text>
<text x="409" y="157" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">carrying whatever identity claim it wants</text>
<rect x="40" y="194" width="1120" height="87" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="220" font-size="15" font-weight="bold" fill="#8b949e">STEP 1, Strip every client-supplied identity header, unconditionally</text>
<text x="58" y="241" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Before any other logic runs. A client-supplied copy of an identity claim is treated as spoofing by definition, it never even reaches a decision.</text>
<text x="58" y="262" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">This is the step most home-grown gateways skip, trusting a header the caller itself set.</text>
<rect x="40" y="299" width="1120" height="108" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="325" font-size="15" font-weight="bold" fill="#8b949e">STEP 2, Resolve real identity server-side, from the credential that actually authenticated</text>
<text x="58" y="346" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Not from anything the client claims. The credential is looked up against a store that distinguishes a human, a workspace, and one specific</text>
<text x="58" y="367" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">agent instance.</text>
<text x="58" y="388" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Each agent instance gets its own row, independently revocable, independently attributable, never shared.</text>
<rect x="40" y="425" width="1120" height="108" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="58" y="451" font-size="15" font-weight="bold" fill="#8b949e">STEP 3, Re-stamp the identity headers from the VERIFIED row, only now</text>
<text x="58" y="472" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Every downstream handler reads a workspace/agent identity header, but the value now came from the database row the credential resolved</text>
<text x="58" y="493" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">to, never from the client.</text>
<text x="58" y="514" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">One ingress point re-stamps, everywhere else just trusts, no downstream code re-derives identity on its own.</text>
<rect x="40" y="551" width="1120" height="87" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="40" y="551" width="5" height="87" rx="2.5" fill="#4ade80"/>
<text x="58" y="577" font-size="15" font-weight="bold" fill="#4ade80">STEP 4, Deterministic policy decides, outside the model entirely</text>
<text x="58" y="598" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">A policy-as-code engine (Rego, Cedar) evaluates the verified identity against granted capabilities, allow, escalate for approval, or deny.</text>
<text x="58" y="619" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Fail-closed on any error.</text>
<marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker>
<polyline points="600,176 600,194" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="600,281 600,299" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="600,407 600,425" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="600,533 600,551" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
</svg>