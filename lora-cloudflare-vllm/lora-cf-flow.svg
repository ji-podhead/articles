<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="382" viewBox="0 0 1200 382" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="382" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">Cloudflare Workers AI, end to end: train, upload, swap</text>
<text x="40" y="100" font-size="17" fill="#8b949e">BYO-LoRA is four steps, open beta, free during beta</text>
<rect x="261" y="106" width="288" height="108" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="261" y="106" width="5" height="108" rx="2.5" fill="#4ade80"/>
<text x="279" y="132" font-size="15" font-weight="bold" fill="#4ade80">1. TRAIN</text>
<text x="279" y="153" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">PEFT/LoRA run on your data,</text>
<text x="279" y="174" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">rank r &lt;= 8 (up to 32),</text>
<text x="279" y="195" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">save safetensors</text>
<rect x="569" y="106" width="371" height="108" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="569" y="106" width="5" height="108" rx="2.5" fill="#4ade80"/>
<text x="587" y="132" font-size="15" font-weight="bold" fill="#4ade80">2. TWO FILES</text>
<text x="587" y="153" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">adapter_model.safetensors (&lt; 300 MB)</text>
<text x="587" y="174" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">adapter_config.json with model_type:</text>
<text x="587" y="195" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">mistral, gemma or llama</text>
<rect x="238" y="240" width="380" height="108" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="238" y="240" width="5" height="108" rx="2.5" fill="#60a5fa"/>
<text x="256" y="266" font-size="15" font-weight="bold" fill="#60a5fa">3. UPLOAD</text>
<text x="256" y="287" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">wrangler ai finetune create</text>
<text x="256" y="308" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">&lt;model&gt; &lt;finetune&gt; &lt;folder&gt;</text>
<text x="256" y="329" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">or REST: /ai/finetunes/{id}/finetune-assets/</text>
<rect x="638" y="240" width="325" height="108" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="638" y="240" width="5" height="108" rx="2.5" fill="#60a5fa"/>
<text x="656" y="266" font-size="15" font-weight="bold" fill="#60a5fa">4. SWAP PER REQUEST</text>
<text x="656" y="287" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">env.AI.run(model, { messages,</text>
<text x="656" y="308" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">raw: true, lora: finetuneId })</text>
<text x="656" y="329" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">no edit after upload: re-create</text>
<marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/></marker>
<polyline points="549,160 569,160" fill="none" stroke="#4ade80" stroke-width="2.2" marker-end="url(#ar1)"/>
<rect x="531" y="148" width="56" height="25" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="559" y="163" font-size="13" fill="#8b949e" text-anchor="middle">export</text>
<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/></marker>
<polyline points="755,214 428,240" fill="none" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#ar2)"/>
<rect x="524" y="215" width="135" height="25" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="591" y="230" font-size="13" fill="#8b949e" text-anchor="middle">2 files exactly</text>
<polyline points="618,294 638,294" fill="none" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#ar2)"/>
<rect x="577" y="282" width="103" height="25" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="628" y="297" font-size="13" fill="#8b949e" text-anchor="middle">finetune id</text>
</svg>