<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect width="1200" height="675" fill="#0d1117"/>

  <!-- Headline -->
  <text x="60" y="96" font-size="46" font-weight="bold" fill="#ffffff">Adapters as Skills,</text>
  <text x="60" y="150" font-size="46" font-weight="bold" fill="#4ade80">Adapters as Conscience</text>
  <text x="60" y="192" font-size="19" fill="#8b949e">LoRA agents on Cloudflare Workers and self-hosted vLLM</text>

  <!-- Diagram: three adapter cards feeding a base model -->
  <rect x="60" y="240" width="300" height="88" rx="10" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
  <text x="80" y="275" font-size="19" font-weight="bold" fill="#4ade80">SKILL adapter</text>
  <text x="80" y="302" font-size="15" fill="#c9d1d9">SSH deploys, firewall ops, agent tools</text>

  <rect x="60" y="346" width="300" height="88" rx="10" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
  <text x="80" y="381" font-size="19" font-weight="bold" fill="#60a5fa">MEMORY adapter</text>
  <text x="80" y="408" font-size="15" fill="#c9d1d9">knowledge baked in, not a claude.md</text>

  <rect x="60" y="452" width="300" height="88" rx="10" fill="#161b22" stroke="#f59e0b" stroke-width="2"/>
  <text x="80" y="487" font-size="19" font-weight="bold" fill="#f59e0b">GUARDRAIL adapter</text>
  <text x="80" y="514" font-size="15" fill="#c9d1d9">expert switching, second persona</text>

  <!-- arrows into base model -->
  <line x1="360" y1="284" x2="470" y2="284" stroke="#4ade80" stroke-width="3"/>
  <polygon points="470,278 482,284 470,290" fill="#4ade80"/>
  <line x1="360" y1="390" x2="470" y2="360" stroke="#60a5fa" stroke-width="3"/>
  <polygon points="470,354 482,360 470,366" fill="#60a5fa"/>
  <line x1="360" y1="496" x2="470" y2="436" stroke="#f59e0b" stroke-width="3"/>
  <polygon points="470,430 482,436 470,442" fill="#f59e0b"/>

  <!-- base model block -->
  <rect x="482" y="250" width="330" height="210" rx="12" fill="#1c2128" stroke="#8b949e" stroke-width="2"/>
  <text x="502" y="292" font-size="22" font-weight="bold" fill="#ffffff">Base Model</text>
  <text x="502" y="322" font-size="15" fill="#8b949e">serverless edge (Workers AI)</text>
  <text x="502" y="344" font-size="15" fill="#8b949e">or self-hosted GPU (vLLM)</text>
  <text x="502" y="386" font-size="15" fill="#c9d1d9">same request, swapped adapter:</text>
  <text x="502" y="410" font-size="15" fill="#c9d1d9">one GPU, many experts</text>

  <!-- honest persona head -->
  <rect x="850" y="250" width="290" height="120" rx="12" fill="#1c2128" stroke="#a78bfa" stroke-width="2"/>
  <text x="870" y="288" font-size="19" font-weight="bold" fill="#a78bfa">honest persona (SPT)</text>
  <text x="870" y="315" font-size="15" fill="#c9d1d9">reviews the main model's outputs,</text>
  <text x="870" y="338" font-size="15" fill="#c9d1d9">cannot influence them</text>

  <!-- review loop -->
  <line x1="812" y1="310" x2="850" y2="310" stroke="#a78bfa" stroke-width="3"/>
  <polygon points="850,304 862,310 850,316" fill="#a78bfa"/>
  <line x1="995" y1="370" x2="995" y2="440" stroke="#a78bfa" stroke-width="3"/>
  <polygon points="989,440 995,452 1001,440" fill="#a78bfa"/>
  <text x="1010" y="425" font-size="14" fill="#a78bfa">flags, never edits</text>

  <!-- review result strip -->
  <rect x="850" y="452" width="290" height="88" rx="10" fill="#161b22" stroke="#a78bfa" stroke-width="2"/>
  <text x="870" y="487" font-size="16" font-weight="bold" fill="#a78bfa">alignment faking: 93-99% flagged</text>
  <text x="870" y="514" font-size="14" fill="#8b949e">baseline without SPT: 0%</text>

  <!-- bottom stat chips -->
  <rect x="60" y="586" width="330" height="56" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="78" y="621" font-size="16" fill="#c9d1d9">100 adapters per account, open beta</text>
  <rect x="410" y="586" width="330" height="56" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="428" y="621" font-size="16" fill="#c9d1d9">rank &#8804; 8 (to 32), adapter &lt; 300 MB</text>
  <rect x="760" y="586" width="380" height="56" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="778" y="621" font-size="16" fill="#c9d1d9">one adapter file, one responsibility swap</text>
</svg>
