<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="403" viewBox="0 0 1200 403" font-family="DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="403" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">Cloudflare Workers AI, end to end: train, upload, swap</text>
<text x="40" y="100" font-size="17" fill="#8b949e">BYO-LoRA is four steps, open beta, free during beta</text>
<rect x="273" y="106" width="277" height="108" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="273" y="106" width="5" height="108" rx="2.5" fill="#4ade80"/>
<text x="293" y="132" font-size="15" font-weight="bold" fill="#4ade80">1. TRAIN</text>
<text x="293" y="153" font-size="15" fill="#c9d1d9">PEFT/LoRA run on your data,</text>
<text x="293" y="174" font-size="15" fill="#c9d1d9">rank r &lt;= 8 (up to 32),</text>
<text x="293" y="195" font-size="15" fill="#c9d1d9">save safetensors</text>
<rect x="570" y="106" width="358" height="108" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="570" y="106" width="5" height="108" rx="2.5" fill="#4ade80"/>
<text x="590" y="132" font-size="15" font-weight="bold" fill="#4ade80">2. TWO FILES</text>
<text x="590" y="153" font-size="15" fill="#c9d1d9">adapter_model.safetensors (&lt; 300 MB)</text>
<text x="590" y="174" font-size="15" fill="#c9d1d9">adapter_config.json with model_type:</text>
<text x="590" y="195" font-size="15" fill="#c9d1d9">mistral, gemma or llama</text>
<rect x="259" y="240" width="349" height="129" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="259" y="240" width="5" height="129" rx="2.5" fill="#60a5fa"/>
<text x="279" y="266" font-size="15" font-weight="bold" fill="#60a5fa">3. UPLOAD</text>
<text x="279" y="287" font-size="15" fill="#c9d1d9">wrangler ai finetune create</text>
<text x="279" y="308" font-size="15" fill="#c9d1d9">&lt;model&gt; &lt;finetune&gt; &lt;folder&gt;</text>
<text x="279" y="329" font-size="15" fill="#c9d1d9">or REST:</text>
<text x="279" y="350" font-size="15" fill="#c9d1d9">/ai/finetunes/{id}/finetune-assets/</text>
<rect x="628" y="240" width="313" height="108" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="628" y="240" width="5" height="108" rx="2.5" fill="#60a5fa"/>
<text x="648" y="266" font-size="15" font-weight="bold" fill="#60a5fa">4. SWAP PER REQUEST</text>
<text x="648" y="287" font-size="15" fill="#c9d1d9">env.AI.run(model, { messages,</text>
<text x="648" y="308" font-size="15" fill="#c9d1d9">raw: true, lora: finetuneId })</text>
<text x="648" y="329" font-size="15" fill="#c9d1d9">no edit after upload: re-create</text>
<marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/></marker>
<line x1="550" y1="160" x2="570" y2="160" stroke="#4ade80" stroke-width="2.2" marker-end="url(#ar1)"/>
<rect x="530" y="148" width="61" height="25" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="560" y="163" font-size="13" fill="#8b949e" text-anchor="middle">export</text>
<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/></marker>
<line x1="570" y1="160" x2="608" y2="305" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#ar2)"/>
<rect x="524" y="220" width="131" height="25" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="589" y="235" font-size="13" fill="#8b949e" text-anchor="middle">2 files exactly</text>
<line x1="608" y1="305" x2="628" y2="294" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#ar2)"/>
<rect x="568" y="287" width="100" height="25" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="618" y="302" font-size="13" fill="#8b949e" text-anchor="middle">finetune id</text>
</svg>