<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 300" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>
  <rect width="1050" height="300" fill="#f8fafc" rx="12"/>

  <text x="525" y="32" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">WAF in the path — and how it learns</text>

  <!-- Client → WAF → Gateway → Upstream -->
  <rect x="30" y="70" width="130" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="95" y="60" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold">CLIENTS</text>
  <text x="95" y="96" fill="#334155" font-family="sans-serif" font-size="11" text-anchor="middle">Internet / API clients</text>
  <text x="95" y="116" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">bots · scanners · real users</text>

  <line x1="160" y1="105" x2="200" y2="105" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="200" y="70" width="210" height="70" rx="6" fill="#1e293b" stroke="#0f172a" filter="url(#shadow)"/>
  <text x="305" y="62" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold">EDGE (L7)</text>
  <text x="305" y="94" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">WAF / Shield</text>
  <text x="305" y="114" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">OWASP rulesets · rate limits · geo/IP allowlists · bot control</text>
  <text x="305" y="130" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">block: injection sequences · throttle: anomalous POST bursts</text>

  <line x1="410" y1="105" x2="240" y2="105" stroke="none"/>
  <line x1="410" y1="105" x2="450" y2="105" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="450" y="70" width="230" height="70" rx="6" fill="#1e293b" stroke="#0f172a" filter="url(#shadow)"/>
  <text x="565" y="62" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold">GATEWAY (the only guaranteed plaintext)</text>
  <text x="565" y="94" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">JiMesh /v1 Gateway</text>
  <text x="565" y="114" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">identity (minted session) · budgets · payload scanning</text>
  <text x="565" y="130" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">JWT/mTLS · schema check · per-consumer rate limits</text>

  <line x1="680" y1="105" x2="720" y2="105" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="720" y="70" width="150" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="795" y="96" fill="#334155" font-family="sans-serif" font-size="11" text-anchor="middle">Upstream models</text>
  <text x="795" y="116" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">egress-allowlisted only</text>

  <!-- Feedback loop -->
  <line x1="795" y1="140" x2="795" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="795" y1="180" x2="465" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="465" y1="180" x2="465" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="305" y1="140" x2="305" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="200" y="200" width="670" height="66" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="535" y="224" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">LEARNED BASELINE → WAF rule updates</text>
  <text x="535" y="244" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">learned paths/verbs/payload-shapes → block rule for injection sequences · throttle anomalous POST bursts · shadow-API detection (gateway traffic vs. documented routes)</text>
  <text x="535" y="260" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">OSS: ModSecurity/Coraza + OWASP CRS, WAF as containers · AWS: WAF + Shield (managed rule groups, bot control)</text>
</svg>
