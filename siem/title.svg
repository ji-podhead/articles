<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 200" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="1050" height="200" fill="#0f172a" rx="12"/>

  <text x="60" y="70" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="26">One Dashboard, Two Security Worlds:</text>
  <text x="60" y="106" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="22">Wazuh + Falco vs. AWS GuardDuty + Security Hub</text>
  <text x="60" y="140" fill="#94a3b8" font-family="sans-serif" font-size="14">How a container platform keeps the same security API under an open-source stack</text>
  <text x="60" y="160" fill="#94a3b8" font-family="sans-serif" font-size="14">and under a fully managed AWS stack — and why the identity chain decides, not the vendor.</text>

  <!-- accent blocks -->
  <rect x="820" y="55" width="90" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="865" y="92" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="13" text-anchor="middle">nft drop</text>
  <text x="865" y="110" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">169.254.169.254</text>
  <text x="865" y="126" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">SIGSTOP</text>
</svg>
