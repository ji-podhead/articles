<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 300" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="1050" height="300" fill="#f8fafc" rx="12"/>

  <text x="525" y="32" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">Same dashboard, two provider worlds — choose by constraint, not by hype</text>

  <!-- Header row -->
  <rect x="30" y="55" width="250" height="34" rx="6" fill="#1e293b" stroke="#0f172a"/>
  <text x="155" y="77" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Dimension</text>
  <rect x="290" y="55" width="350" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="465" y="77" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">OSS: Wazuh + Falco + Suricata</text>
  <rect x="650" y="55" width="370" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="835" y="77" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">AWS-native: GuardDuty + Security Hub</text>

  <!-- Row template: 5 rows -->
  <rect x="30" y="95" width="250" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="155" y="118" fill="#334155" font-family="sans-serif" font-size="11" text-anchor="middle">Hosting</text>
  <rect x="290" y="95" width="350" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="465" y="118" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">self-hosted docker-compose (~4 GB RAM)</text>
  <rect x="650" y="95" width="370" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="835" y="118" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">fully managed</text>

  <rect x="30" y="135" width="250" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="155" y="158" fill="#334155" font-family="sans-serif" font-size="11" text-anchor="middle">Cost model</text>
  <rect x="290" y="135" width="350" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="465" y="158" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">flat (hardware)</text>
  <rect x="650" y="135" width="370" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="835" y="158" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">volume-based (expensive at high log volume)</text>

  <rect x="30" y="175" width="250" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="155" y="198" fill="#334155" font-family="sans-serif" font-size="11" text-anchor="middle">ML detection</text>
  <rect x="290" y="175" width="350" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="465" y="198" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">open: ML Commons / MLflow / own models</text>
  <rect x="650" y="175" width="370" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="835" y="198" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">GuardDuty ML instantly, but black-box</text>

  <rect x="30" y="215" width="250" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="155" y="238" fill="#334155" font-family="sans-serif" font-size="11" text-anchor="middle">Compliance dashboards</text>
  <rect x="290" y="215" width="350" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="465" y="238" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Wazuh compliance module (PCI/GDPR/HIPAA)</text>
  <rect x="650" y="215" width="370" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="835" y="238" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Security Hub (CIS / PCI-DSS / GDPR scoring)</text>

  <rect x="30" y="255" width="250" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="155" y="278" fill="#0284c7" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Attribution (the differentiator)</text>
  <rect x="290" y="255" width="350" height="36" rx="6" fill="#1e293b" stroke="#0f172a"/>
  <text x="465" y="278" fill="#38bdf8" font-family="sans-serif" font-size="10" text-anchor="middle">JiMesh security_events attribution — IDENTICAL</text>
  <rect x="650" y="255" width="370" height="36" rx="6" fill="#1e293b" stroke="#0f172a"/>
  <text x="835" y="278" fill="#38bdf8" font-family="sans-serif" font-size="10" text-anchor="middle">JiMesh security_events attribution — IDENTICAL</text>
</svg>
