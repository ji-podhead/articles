<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 340" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>
  <rect width="1050" height="340" fill="#f8fafc" rx="12"/>

  <text x="525" y="34" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">OSS stack: Wazuh core + Falco/Suricata sensors + the JiMesh event bridge</text>

  <!-- Sensors row -->
  <text x="40" y="62" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold">SENSORS (per node)</text>
  <rect x="40" y="72" width="180" height="64" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="130" y="96" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Falco (modern eBPF)</text>
  <text x="130" y="116" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">syscalls per container</text>

  <rect x="240" y="72" width="180" height="64" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="330" y="96" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Suricata (XDP)</text>
  <text x="330" y="116" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">packet IDS, eve.json</text>

  <rect x="440" y="72" width="180" height="64" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="530" y="96" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Wazuh Agent</text>
  <text x="530" y="116" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">FIM · vuln · Docker engine</text>

  <rect x="640" y="72" width="180" height="64" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="730" y="96" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">JiMesh (built-in)</text>
  <text x="730" y="116" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">scanner · freeze · egress · RBAC</text>

  <!-- Wazuh core (dark) -->
  <line x1="220" y1="104" x2="660" y2="168" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="104" x2="660" y2="168" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="136" x2="660" y2="168" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="136" x2="700" y2="168" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="400" y="168" width="380" height="76" rx="6" fill="#1e293b" stroke="#0f172a" filter="url(#shadow)"/>
  <text x="590" y="196" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Wazuh Manager (rules · correlation)</text>
  <text x="590" y="218" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">syslog/TCP 1514 ← JiMesh shipper (redacted JSON)</text>
  <text x="590" y="236" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">→ alerts.json (the return path)</text>

  <!-- Indexer + dashboard -->
  <line x1="780" y1="206" x2="830" y2="206" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="830" y="168" width="190" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="925" y="194" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Indexer + Dashboard</text>
  <text x="925" y="214" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">retention · search · compliance</text>
  <text x="925" y="232" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">~4 GB RAM, docker-compose</text>

  <!-- Return path (dashed) -->
  <line x1="400" y1="226" x2="250" y2="226" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="322" y="218" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">fsnotify tail</text>

  <!-- JiMesh ingestion (dark) -->
  <rect x="40" y="196" width="210" height="60" rx="6" fill="#1e293b" stroke="#0f172a" filter="url(#shadow)"/>
  <text x="145" y="222" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Ingest Mapper</text>
  <text x="145" y="242" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">→ security_events (+ project_id)</text>

  <!-- Dashboard -->
  <line x1="145" y1="272" x2="145" y2="296" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="296" width="500" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="290" y="318" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">JiMesh Security Sidebar — ONE threat feed, source badges, identical API</text>
</svg>
