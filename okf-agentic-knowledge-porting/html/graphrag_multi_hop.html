<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<link href="styles/_house.css" rel="stylesheet"/>
<style>
.root { gap: 28px; }
.flowstrip { display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--ink2); border-top: 1px solid var(--line); padding-top: 14px; }
.card.code .d { font-family: var(--font-mono); font-size: 13.5px; color: var(--code); }
.card.code { background: var(--elevated); }
.cardlogo { height: 24px; opacity: 0.85; margin-left: 12px; }
.arrow.green { color: var(--green); }
.arrow.blue { color: var(--blue); }
.arrow.amber { color: var(--amber); }
.arrow.red { color: var(--red); }
</style>
</head>
<body>
<h1>Multi-Hop GraphRAG Entity &amp; Chunk Traversal</h1>
<section class="col root"><section class="row"><section class="card blue"><div class="t">Domain</div><div class="d">networking</div></section>
<section class="arrow blue">→<span class="lbl">contains</span></section>
<section class="card green"><div class="t">OKF Document</div><div class="d">gVisor Sandboxing</div></section>
<section class="arrow blue">→<span class="lbl">extracts entity</span></section>
<section class="card"><div class="t">Entity</div><div class="d">gVisor Sentry</div></section>
<section class="card"><div class="t">Chunk</div><div class="d">300-800 Tokens</div></section>
<section class="card"><div class="t">Entity B</div><div class="d">Host Kernel</div></section></section></section>
<section class="flowstrip"><div>OKF Document → chunks into → Chunk</div>
<div>Entity → intercepts syscalls → Entity B</div></section>
</body>
</html>
