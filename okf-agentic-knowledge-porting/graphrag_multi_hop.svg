<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="100%" height="100%" style="background-color: #0f172a; border-radius: 8px;">
  <text x="450" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Multi-Hop GraphRAG Entity &amp; Chunk Traversal</text>

  <!-- Node 1: Domain -->
  <circle cx="150" cy="180" r="45" fill="#1e3a8a" stroke="#3b82f6" stroke-width="3"/>
  <text x="150" y="175" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Domain</text>
  <text x="150" y="195" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">networking</text>

  <!-- Edge 1 -->
  <path d="M 195 180 L 295 180" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" fill="none"/>
  <text x="245" y="170" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">contains</text>

  <!-- Node 2: OKF Document -->
  <circle cx="350" cy="180" r="50" fill="#065f46" stroke="#10b981" stroke-width="3"/>
  <text x="350" y="175" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">OKF Document</text>
  <text x="350" y="195" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">gVisor Sandboxing</text>

  <!-- Edge 2a -->
  <path d="M 390 150 L 530 100" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <text x="470" y="115" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">extracts entity</text>

  <!-- Edge 2b -->
  <path d="M 390 210 L 530 260" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <text x="470" y="250" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">chunks into</text>

  <!-- Node 3a: Entity -->
  <circle cx="580" cy="90" r="40" fill="#581c87" stroke="#a855f7" stroke-width="3"/>
  <text x="580" y="85" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Entity</text>
  <text x="580" y="102" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">gVisor Sentry</text>

  <!-- Node 3b: Chunk -->
  <circle cx="580" cy="270" r="40" fill="#701a75" stroke="#ec4899" stroke-width="3"/>
  <text x="580" y="265" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Chunk</text>
  <text x="580" y="282" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">300-800 Tokens</text>

  <!-- Edge 3 (Triple Relation) -->
  <path d="M 620 90 L 730 180" stroke="#a855f7" stroke-width="2" fill="none"/>
  <text x="690" y="125" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">intercepts syscalls</text>

  <!-- Node 4: Related Entity -->
  <circle cx="770" cy="180" r="45" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
  <text x="770" y="175" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Entity B</text>
  <text x="770" y="195" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Host Kernel</text>
</svg>
