<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="701" viewBox="0 0 1200 701" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="701" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">SANITATION STACK: MODELS &amp; GUARDRAILS</text>
<text x="40" y="100" font-size="17" fill="#8b949e">classify → generate → guard - the 3 AI layers between slop and clean OKF</text>
<rect x="56" y="106" width="288" height="87" rx="11" fill="#161b22" stroke="#f87171" stroke-width="2"/>
<rect x="56" y="106" width="5" height="87" rx="2.5" fill="#f87171"/>
<text x="74" y="132" font-size="15" font-weight="bold" fill="#f87171">RAW SLOP</text>
<text x="74" y="153" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">chat logs · exports · notes</text>
<text x="74" y="174" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">paths, IPs, filler, tickets</text>
<rect x="364" y="106" width="380" height="171" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="382" y="132" font-size="15" font-weight="bold" fill="#e6edf3">LAYER 1 · CLASSIFY &amp; FLAG PII</text>
<text x="382" y="153" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">DeBERTa-v3 (NER)</text>
<text x="382" y="174" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">flags IPs · passwords · AWS keys · paths</text>
<text x="382" y="195" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">all-MiniLM-L6-v2 (embedding)</text>
<text x="382" y="216" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">pre-matches raw text → proposes</text>
<text x="382" y="237" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">topic/subtopic</text>
<text x="382" y="258" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">local CPU · deterministic · cheap</text>
<rect x="764" y="106" width="380" height="192" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="782" y="132" font-size="15" font-weight="bold" fill="#e6edf3">LAYER 2 · EXTRACT &amp; RESTRUCTURE</text>
<text x="782" y="153" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Llama-3-8B / Mistral-7B (local, Ollama)</text>
<text x="782" y="174" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">strips filler · splits into heading sections</text>
<text x="782" y="195" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Gemini response_schema / structured</text>
<text x="782" y="216" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">outputs</text>
<text x="782" y="237" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">forces frontmatter to the OKF schema exactly</text>
<text x="782" y="258" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">transformation, not invention - low</text>
<text x="782" y="279" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">hallucination risk</text>
<rect x="233" y="322" width="334" height="108" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="233" y="322" width="5" height="108" rx="2.5" fill="#4ade80"/>
<text x="251" y="348" font-size="15" font-weight="bold" fill="#4ade80">CLEAN OKF</text>
<text x="251" y="369" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">frontmatter (v0.2 compliant)</text>
<text x="251" y="390" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">heading-bounded sections</text>
<text x="251" y="411" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">lifecycle · sources · provenance</text>
<rect x="587" y="322" width="380" height="234" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="605" y="348" font-size="15" font-weight="bold" fill="#e6edf3">LAYER 3 · PROGRAMMATIC GUARDRAILS</text>
<text x="605" y="369" font-size="15" font-weight="bold" fill="#e6edf3">(PRE-COMMIT)</text>
<text x="605" y="390" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">NeMo Guardrails (NVIDIA)</text>
<text x="605" y="411" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">blocks unverified code + conversational</text>
<text x="605" y="432" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">residue → triggers rewrite</text>
<text x="605" y="453" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Llama Guard 3</text>
<text x="605" y="474" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">final scan: no proprietary leak ships as</text>
<text x="605" y="495" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">visibility: public</text>
<text x="605" y="516" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">rules live in code - reviewable, testable,</text>
<text x="605" y="537" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">deterministic</text>
<rect x="314" y="580" width="176" height="45" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="332" y="606" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">⚠ ORDER MATTERS</text>
<rect x="506" y="580" width="380" height="87" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="524" y="606" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">redact PII with a CPU encoder BEFORE the</text>
<text x="524" y="627" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">generative pass - discovering it after it's</text>
<text x="524" y="648" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">woven into a summary is far too late</text>
