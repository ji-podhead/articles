<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="302" viewBox="0 0 1200 302" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="302" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">8-Stage Slop-to-Knowledge Deconstruction Pipeline</text>
<rect x="20" y="70" width="291" height="87" rx="11" fill="#161b22" stroke="#f87171" stroke-width="2"/>
<rect x="20" y="70" width="5" height="87" rx="2.5" fill="#f87171"/>
<text x="38" y="96" font-size="15" font-weight="bold" fill="#f87171">1. Raw Slop &amp; Transcripts</text>
<text x="38" y="117" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Chat logs, prompt dumps,</text>
<text x="38" y="138" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">unformatted notes</text>
<rect x="331" y="70" width="278" height="87" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="349" y="96" font-size="15" font-weight="bold" fill="#e6edf3">2. Slop &amp; Fluff Removal</text>
<text x="349" y="117" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Strip LLM greetings,</text>
<text x="349" y="138" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Q&amp;A headers &amp; transient UI</text>
<rect x="629" y="70" width="271" height="87" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="647" y="96" font-size="15" font-weight="bold" fill="#e6edf3">3. Dev Artifact Purging</text>
<text x="647" y="117" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Remove tickets, sprints,</text>
<text x="647" y="138" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">internal repo code paths</text>
<rect x="920" y="70" width="261" height="87" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="920" y="70" width="5" height="87" rx="2.5" fill="#4ade80"/>
<text x="938" y="96" font-size="15" font-weight="bold" fill="#4ade80">4. Redaction &amp; Privacy</text>
<text x="938" y="117" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Sanitize IPs, passwords,</text>
<text x="938" y="138" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">tokens &amp; developer paths</text>
<rect x="8" y="181" width="261" height="87" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="26" y="207" font-size="15" font-weight="bold" fill="#e6edf3">5. Pattern Abstraction</text>
<text x="26" y="228" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Convert product names</text>
<text x="26" y="249" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">to generic architectures</text>
<rect x="289" y="181" width="291" height="87" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="307" y="207" font-size="15" font-weight="bold" fill="#e6edf3">6. Audit-to-Guide Rewrite</text>
<text x="307" y="228" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Transform post-mortems</text>
<text x="307" y="249" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">into technical guidebooks</text>
<rect x="600" y="181" width="261" height="87" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="618" y="207" font-size="15" font-weight="bold" fill="#e6edf3">7. English Translation</text>
<text x="618" y="228" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Translate 100% of body</text>
<text x="618" y="249" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">&amp; headings into English</text>
<rect x="881" y="181" width="312" height="87" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="881" y="181" width="5" height="87" rx="2.5" fill="#4ade80"/>
<text x="899" y="207" font-size="15" font-weight="bold" fill="#4ade80">8. OKF + GraphRAG Synthesis</text>
<text x="899" y="228" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Prepend YAML frontmatter,</text>
<text x="899" y="249" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">optimize chunk boundaries</text>
<marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker>
<polyline points="311,114 331,114" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="609,114 629,114" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="900,114 920,114" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
</svg>