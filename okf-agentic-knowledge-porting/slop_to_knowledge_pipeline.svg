<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%" style="background-color: #0f172a; border-radius: 8px;">
  <text x="450" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">8-Stage Slop-to-Knowledge Deconstruction Pipeline</text>

  <!-- Stage Blocks -->
  <g transform="translate(30, 60)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="180" height="90" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="90" y="25" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">1. Raw Slop &amp; Transcripts</text>
    <text x="90" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Chat logs, prompt dumps,</text>
    <text x="90" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">unformatted notes</text>

    <!-- Arrow 1 -->
    <path d="M 185 45 L 215 45" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Box 2 -->
    <rect x="220" y="0" width="180" height="90" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="310" y="25" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">2. Slop &amp; Fluff Removal</text>
    <text x="310" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Strip LLM greetings,</text>
    <text x="310" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Q&amp;A headers &amp; transient UI</text>

    <!-- Arrow 2 -->
    <path d="M 405 45 L 435 45" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Box 3 -->
    <rect x="440" y="0" width="180" height="90" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="530" y="25" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">3. Dev Artifact Purging</text>
    <text x="530" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Remove tickets, sprints,</text>
    <text x="530" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">internal repo code paths</text>

    <!-- Arrow 3 -->
    <path d="M 625 45 L 655 45" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Box 4 -->
    <rect x="660" y="0" width="180" height="90" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="750" y="25" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">4. Redaction &amp; Privacy</text>
    <text x="750" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Sanitize IPs, passwords,</text>
    <text x="750" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">tokens &amp; developer paths</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(30, 180)">
    <!-- Box 5 -->
    <rect x="0" y="0" width="180" height="90" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="90" y="25" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">5. Pattern Abstraction</text>
    <text x="90" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Convert product names</text>
    <text x="90" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">to generic architectures</text>

    <!-- Arrow 5 -->
    <path d="M 185 45 L 215 45" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Box 6 -->
    <rect x="220" y="0" width="180" height="90" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
    <text x="310" y="25" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">6. Audit-to-Guide Rewrite</text>
    <text x="310" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Transform post-mortems</text>
    <text x="310" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">into technical guidebooks</text>

    <!-- Arrow 6 -->
    <path d="M 405 45 L 435 45" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Box 7 -->
    <rect x="440" y="0" width="180" height="90" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="530" y="25" fill="#a5f3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">7. English Translation</text>
    <text x="530" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Translate 100% of body</text>
    <text x="530" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&amp; headings into English</text>

    <!-- Arrow 7 -->
    <path d="M 625 45 L 655 45" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Box 8 -->
    <rect x="660" y="0" width="180" height="90" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="750" y="25" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">8. OKF + GraphRAG Synthesis</text>
    <text x="750" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Prepend YAML frontmatter,</text>
    <text x="750" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">optimize chunk boundaries</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>
</svg>
