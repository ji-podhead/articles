<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="815" viewBox="0 0 1200 815" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="815" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">AGENTIC TOOLS: METADATA FIRST, RAG SECOND</text>
<text x="40" y="100" font-size="17" fill="#8b949e">two SQL-grade tools over OKF instead of one blind vector search</text>
<rect x="20" y="106" width="269" height="66" rx="11" fill="#161b22" stroke="#f87171" stroke-width="2"/>
<rect x="20" y="106" width="5" height="66" rx="2.5" fill="#f87171"/>
<text x="38" y="132" font-size="15" font-weight="bold" fill="#f87171">✗ THE ANTI-PATTERN</text>
<text x="38" y="153" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">one generic &quot;search&quot; tool</text>
<rect x="20" y="188" width="315" height="66" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="38" y="214" font-size="15" font-weight="bold" fill="#e6edf3">User query</text>
<text x="38" y="235" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">&quot;kubernetes leads, still cold&quot;</text>
<rect x="20" y="270" width="371" height="87" rx="11" fill="#161b22" stroke="#f87171" stroke-width="2"/>
<rect x="20" y="270" width="5" height="87" rx="2.5" fill="#f87171"/>
<text x="38" y="296" font-size="15" font-weight="bold" fill="#f87171">search(vector_db, query)</text>
<text x="38" y="317" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">embeds everything, reranks noise</text>
<text x="38" y="338" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">cookie banners, menus, filler chunks</text>
<rect x="20" y="373" width="343" height="108" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="38" y="399" font-size="15" font-weight="bold" fill="#e6edf3">expensive + imprecise</text>
<text x="38" y="420" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">• embedding cost on every query</text>
<text x="38" y="441" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">• missed details in the noise</text>
<text x="38" y="462" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">• relevance guessed, not filtered</text>
<rect x="423" y="106" width="380" height="87" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="423" y="106" width="5" height="87" rx="2.5" fill="#4ade80"/>
<text x="441" y="132" font-size="15" font-weight="bold" fill="#4ade80">✓ THE OKF TOOL PATTERN</text>
<text x="441" y="153" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">catalog query first - body fetch only for the</text>
<text x="441" y="174" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">filtered few</text>
<rect x="423" y="209" width="353" height="129" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="423" y="209" width="5" height="129" rx="2.5" fill="#4ade80"/>
<text x="441" y="235" font-size="15" font-weight="bold" fill="#4ade80">search_knowledge_metadata()</text>
<text x="441" y="256" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">filters manifest.json only</text>
<text x="441" y="277" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">topic · tags · status · lifecycle</text>
<text x="441" y="298" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">→ milliseconds · zero body tokens</text>
<text x="441" y="319" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">deterministic - no LLM call needed</text>
<rect x="792" y="209" width="353" height="129" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="810" y="235" font-size="15" font-weight="bold" fill="#e6edf3">fetch_knowledge_document()</text>
<text x="810" y="256" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">loads body or ONE heading section</text>
<text x="810" y="277" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">by validated doc ID + anchor</text>
<text x="810" y="298" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">→ context budget spent only here</text>
<text x="810" y="319" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">heading-bounded jumps, no re-reads</text>
<rect x="423" y="354" width="371" height="87" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="423" y="354" width="5" height="87" rx="2.5" fill="#4ade80"/>
<text x="441" y="380" font-size="15" font-weight="bold" fill="#4ade80">manifest.json</text>
<text x="441" y="401" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">nodes: docs · topics · tags</text>
<text x="441" y="422" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">edges: shared taxonomy + cross-links</text>
<rect x="810" y="354" width="371" height="87" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="828" y="380" font-size="15" font-weight="bold" fill="#e6edf3">okf document bodies</text>
<text x="828" y="401" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">markdown · ## sections</text>
<text x="828" y="422" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">lifecycle-expired → refused by agent</text>
<rect x="423" y="457" width="380" height="213" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="423" y="457" width="5" height="213" rx="2.5" fill="#4ade80"/>
<text x="441" y="483" font-size="15" font-weight="bold" fill="#4ade80">THE RESULT</text>
<text x="441" y="504" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">&quot;find all enterprise leads on Kubernetes with</text>
<text x="441" y="525" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">status cold_outreach&quot;</text>
<text x="441" y="546" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">→ metadata filter returns 5 IDs in</text>
<text x="441" y="567" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">milliseconds → only those 5 bodies enter the</text>
<text x="441" y="588" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">context</text>
<text x="441" y="609" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">~95% token cost avoided · zero missed</text>
<text x="441" y="630" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">detail · relevance by structure, not cosine</text>
<text x="441" y="651" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">guessing</text>
<rect x="217" y="694" width="380" height="87" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="235" y="720" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">tool definitions (JSON schema for function</text>
<text x="235" y="741" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">calling) - same pattern for leads, runbooks,</text>
<text x="235" y="762" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">ADRs, research</text>
<rect x="613" y="694" width="371" height="66" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="631" y="720" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">#OKF #KnowledgeEngineering #GraphRAG</text>
<text x="631" y="741" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">#AIAgents #MLOps</text>
