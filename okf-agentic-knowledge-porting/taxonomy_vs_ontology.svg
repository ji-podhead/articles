<rect x="612" y="196" width="5" height="87" rx="2.5" fill="#4ade80"/>
<text x="630" y="222" font-size="15" font-weight="bold" fill="#4ade80">THE ONTOLOGY - relation web</text>
<text x="630" y="243" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Markdown cross-links · any document relates</text>
<text x="630" y="264" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">to any other</text>
<rect x="612" y="299" width="261" height="45" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="612" y="299" width="5" height="45" rx="2.5" fill="#4ade80"/>
<text x="630" y="325" font-size="15" font-weight="bold" fill="#4ade80">JOB: PRECISE TRAVERSAL</text>
