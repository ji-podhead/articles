<text x="226" y="573" font-size="15" font-weight="bold" fill="#60a5fa">JOB: INSTANT EXCLUSION</text>
<text x="226" y="594" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">filter: topic == &quot;general/networking&quot;</text>
<text x="226" y="615" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">→ irrelevant domains excluded with 100%</text>
<text x="226" y="636" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">certainty</text>
<text x="226" y="657" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">controlled vocabulary: no wild folder names</text>
<text x="226" y="678" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">allowed</text>
