<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Taxonomy vs Ontology — the two structures inside every OKF knowledge base">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <marker id="rel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0,0 L 10,5 L 0,10" fill="none" stroke="#34d399" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="600" y="48" text-anchor="middle" fill="#fafafa" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="900">
    TAXONOMY + ONTOLOGY = OKF'S SUPERPOWER
  </text>
  <text x="600" y="72" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="13">
    rigid hierarchy for filtering · relational graph for traversal
  </text>

  <!-- ═══ LEFT: TAXONOMY (tree) ═══ -->
  <g transform="translate(50, 110)">
    <rect width="530" height="420" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="530" height="52" rx="14" fill="#38bdf8" opacity="0.1"/>
    <text x="265" y="28" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI" font-size="16" font-weight="900">
      THE TAXONOMY — rigid tree
    </text>
    <text x="265" y="44" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">
      directory structure + topic / subtopic · one home per document
    </text>

    <!-- Tree -->
    <g transform="translate(40, 80)" font-family="monospace">
      <!-- Root -->
      <rect x="140" y="0" width="220" height="34" rx="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="250" y="21" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="bold">general/</text>

      <line x1="250" y1="34" x2="120" y2="62" stroke="#3a506b" stroke-width="1.4"/>
      <line x1="250" y1="34" x2="390" y2="62" stroke="#3a506b" stroke-width="1.4"/>

      <!-- Branch 1 -->
      <rect x="40" y="62" width="160" height="30" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="120" y="81" text-anchor="middle" fill="#94a3b8" font-size="10">networking/</text>
      <line x1="120" y1="92" x2="120" y2="118" stroke="#3a506b" stroke-width="1.2"/>
      <rect x="40" y="118" width="160" height="30" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="120" y="137" text-anchor="middle" fill="#94a3b8" font-size="10">container-networking/</text>
      <line x1="120" y1="148" x2="120" y2="174" stroke="#3a506b" stroke-width="1.2"/>
      <rect x="40" y="174" width="160" height="34" rx="6" fill="#052e16" stroke="#34d399" stroke-width="1.2"/>
      <text x="120" y="188" text-anchor="middle" fill="#34d399" font-size="10">gvisor.md</text>
      <text x="120" y="202" text-anchor="middle" fill="#475569" font-size="8">the document (leaf)</text>

      <!-- Branch 2 -->
      <rect x="310" y="62" width="160" height="30" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="390" y="81" text-anchor="middle" fill="#94a3b8" font-size="10">llm-orchestration/</text>
      <line x1="390" y1="92" x2="390" y2="118" stroke="#3a506b" stroke-width="1.2"/>
      <rect x="310" y="118" width="160" height="34" rx="6" fill="#052e16" stroke="#34d399" stroke-width="1.2"/>
      <text x="390" y="132" text-anchor="middle" fill="#34d399" font-size="10">llama3-security.md</text>
      <text x="390" y="146" text-anchor="middle" fill="#475569" font-size="8">the document (leaf)</text>
    </g>

    <g transform="translate(40, 300)">
      <rect width="450" height="94" rx="10" fill="#38bdf8" opacity="0.06"/>
      <text x="225" y="24" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI" font-size="12" font-weight="900">JOB: INSTANT EXCLUSION</text>
      <text x="225" y="46" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">filter: topic == "general/networking"</text>
      <text x="225" y="62" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">→ irrelevant domains excluded with 100% certainty</text>
      <text x="225" y="80" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">controlled vocabulary: no wild folder names allowed</text>
    </g>
  </g>

  <!-- ═══ RIGHT: ONTOLOGY (graph) ═══ -->
  <g transform="translate(620, 110)">
    <rect width="530" height="420" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <rect width="530" height="52" rx="14" fill="#34d399" opacity="0.1"/>
    <text x="265" y="28" text-anchor="middle" fill="#34d399" font-family="Segoe UI" font-size="16" font-weight="900">
      THE ONTOLOGY — relation web
    </text>
    <text x="265" y="44" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">
      Markdown cross-links · any document relates to any other
    </text>

    <!-- Graph nodes -->
    <g font-family="monospace">
      <!-- edges -->
      <line x1="265" y1="150" x2="110" y2="235" stroke="#34d399" stroke-width="1.4" opacity="0.7" marker-end="url(#rel)"/>
      <line x1="265" y1="150" x2="420" y2="235" stroke="#34d399" stroke-width="1.4" opacity="0.7" marker-end="url(#rel)"/>
      <line x1="110" y1="255" x2="265" y2="340" stroke="#34d399" stroke-width="1.4" opacity="0.7" marker-end="url(#rel)"/>
      <line x1="420" y1="255" x2="265" y2="340" stroke="#34d399" stroke-width="1.4" opacity="0.7" marker-end="url(#rel)"/>
      <line x1="265" y1="150" x2="265" y2="330" stroke="#34d399" stroke-width="1.2" opacity="0.5" stroke-dasharray="4,3"/>

      <!-- edge labels -->
      <text x="172" y="185" fill="#64748b" font-size="9" text-anchor="middle">isolates</text>
      <text x="355" y="185" fill="#64748b" font-size="9" text-anchor="middle">is_used_by</text>
      <text x="172" y="300" fill="#64748b" font-size="9" text-anchor="middle">runs_on</text>
      <text x="355" y="300" fill="#64748b" font-size="9" text-anchor="middle">verifies</text>

      <!-- center node -->
      <circle cx="265" cy="140" r="26" fill="#052e16" stroke="#34d399" stroke-width="2"/>
      <text x="265" y="137" text-anchor="middle" fill="#34d399" font-size="9" font-weight="bold">gVisor</text>
      <text x="265" y="149" text-anchor="middle" fill="#34d399" font-size="9" font-weight="bold">Network.</text>

      <!-- left node -->
      <circle cx="110" cy="245" r="24" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
      <text x="110" y="242" text-anchor="middle" fill="#a5b4fc" font-size="8.5" font-weight="bold">Docker</text>
      <text x="110" y="253" text-anchor="middle" fill="#a5b4fc" font-size="8.5" font-weight="bold">Bridge</text>

      <!-- right node -->
      <circle cx="420" cy="245" r="24" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
      <text x="420" y="242" text-anchor="middle" fill="#fdba74" font-size="8.5" font-weight="bold">Secure</text>
      <text x="420" y="253" text-anchor="middle" fill="#fdba74" font-size="8.5" font-weight="bold">Gateway</text>

      <!-- bottom node -->
      <circle cx="265" cy="355" r="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <text x="265" y="352" text-anchor="middle" fill="#7dd3fc" font-size="8.5" font-weight="bold">Kubernetes</text>
      <text x="265" y="363" text-anchor="middle" fill="#7dd3fc" font-size="8.5" font-weight="bold">Cluster</text>
    </g>

    <g transform="translate(40, 405)">
      <text x="225" y="0" text-anchor="middle" fill="#34d399" font-family="Segoe UI" font-size="11" font-weight="900">JOB: PRECISE TRAVERSAL</text>
    </g>
  </g>

  <!-- ═══ BOTTOM: the bridge ═══ -->
  <g transform="translate(50, 555)">
    <rect width="1100" height="88" rx="14" fill="#818cf8" opacity="0.07"/>
    <text x="550" y="28" text-anchor="middle" fill="#a5b4fc" font-family="Segoe UI" font-size="14" font-weight="900">
      THE BRIDGE: manifest.json
    </text>
    <text x="550" y="52" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">
      nodes from frontmatter (taxonomy members) + edges from directory structure AND cross-links scanned from the bodies (ontology)
    </text>
    <text x="550" y="70" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">
      agent flow: taxonomy filter first → then follow the links — precise answers, no reranking, no cosine guessing
    </text>
  </g>

  <text x="600" y="662" text-anchor="middle" fill="#475569" font-family="monospace" font-size="10">
    #OKF #KnowledgeEngineering #Taxonomy #Ontology #GraphRAG #AIAgents
  </text>
</svg>
