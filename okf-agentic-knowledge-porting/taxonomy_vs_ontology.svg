<rect x="40" y="721" width="5" height="192" rx="2.5" fill="#60a5fa"/>
<text x="58" y="747" font-size="15" font-weight="bold" fill="#60a5fa">THE BRIDGE: manifest.json</text>
<text x="58" y="768" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">nodes from frontmatter (taxonomy members)</text>
<text x="58" y="789" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">+ edges from directory structure AND</text>
<text x="58" y="810" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">cross-links scanned from the bodies</text>
<text x="58" y="831" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">(ontology)</text>
<text x="58" y="852" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">agent flow: taxonomy filter first → then follow</text>
<text x="58" y="873" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">the links - precise answers, no reranking, no</text>
