<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="900" height="450" fill="#f8fafc" rx="16"/>
  <line x1="50" y1="220" x2="850" y2="220" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="60" y="210" fill="#94a3b8" font-family="sans-serif" font-weight="bold" font-size="12" letter-spacing="1">USERSPACE</text>
  <text x="60" y="240" fill="#94a3b8" font-family="sans-serif" font-weight="bold" font-size="12" letter-spacing="1">KERNELSPACE</text>
  <g filter="url(#shadow)">
    <rect x="60" y="60" width="180" height="110" rx="8" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="2"/>
    <text x="150" y="95" fill="#1e3a8a" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">LLM Agent</text>
    <text x="150" y="120" fill="#64748b" font-family="sans-serif" font-size="12" text-anchor="middle">Calls SSL_write()</text>
    <rect x="75" y="135" width="150" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="150" y="151" fill="#1e40af" font-family="monospace" font-size="11" text-anchor="middle">Plaintext in RAM</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="300" y="270" width="180" height="110" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <text x="390" y="305" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">2. eBPF Engine</text>
    <text x="390" y="330" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">uprobe / kprobe</text>
    <text x="390" y="355" fill="#f1f5f9" font-family="sans-serif" font-size="11" text-anchor="middle">Intercepts raw memory</text>
  </g>
  <path d="M 480 325 Q 560 325 560 210" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <rect x="495" y="240" width="110" height="25" rx="4" fill="#e2e8f0"/>
  <text x="550" y="257" fill="#475569" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Ring Buffer</text>
  <g filter="url(#shadow)">
    <rect x="620" y="60" width="220" height="120" rx="8" fill="url(#boxGrad)" stroke="#10b981" stroke-width="2"/>
    <text x="730" y="90" fill="#065f46" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">3. Shield Daemon</text>
    <rect x="635" y="110" width="190" height="50" rx="4" fill="#d1fae5"/>
    <text x="730" y="128" fill="#065f46" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Prompt Guard (22M)</text>
    <text x="730" y="145" fill="#047857" font-family="sans-serif" font-size="11" text-anchor="middle">Classification &lt; 1ms</text>
  </g>
  <path d="M 150 170 L 150 325 L 300 325" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="160" y="260" fill="#3b82f6" font-family="sans-serif" font-size="12" font-weight="bold">SSL Hook</text>
  <path d="M 730 180 L 730 380 L 480 380" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="690" y="370" fill="#ef4444" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="end">4. Verdict: Map Update / SIGSTOP</text>
</svg>
