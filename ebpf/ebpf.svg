<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="212" viewBox="0 0 1200 212" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="212" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">Kernel-Level Protection: eBPF Interception &amp; Verification</text>
<rect x="67" y="70" width="195" height="108" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="67" y="70" width="5" height="108" rx="2.5" fill="#60a5fa"/>
<text x="85" y="96" font-size="15" font-weight="bold" fill="#60a5fa">LLM Agent</text>
<text x="85" y="117" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Calls SSL_write()</text>
<text x="85" y="138" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Plaintext in RAM</text>
<text x="85" y="159" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">USERSPACE</text>
<rect x="280" y="70" width="232" height="108" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="298" y="96" font-size="15" font-weight="bold" fill="#e6edf3">2. eBPF Engine</text>
<text x="298" y="117" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">uprobe / kprobe</text>
<text x="298" y="138" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Intercepts raw memory</text>
<text x="298" y="159" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">KERNELSPACE</text>
<rect x="530" y="70" width="222" height="87" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="548" y="96" font-size="15" font-weight="bold" fill="#e6edf3">3. Shield Daemon</text>
<text x="548" y="117" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Prompt Guard (22M)</text>
<text x="548" y="138" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Classification &lt; 1ms</text>
<rect x="770" y="70" width="363" height="45" rx="11" fill="#161b22" stroke="#f87171" stroke-width="2"/>
<rect x="770" y="70" width="5" height="45" rx="2.5" fill="#f87171"/>
<text x="788" y="96" font-size="15" font-weight="bold" fill="#f87171">4. Verdict: Map Update / SIGSTOP</text>
<marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/></marker>
<polyline points="262,124 280,124" fill="none" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#ar1)"/>
<rect x="232" y="112" width="78" height="25" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="271" y="127" font-size="13" fill="#8b949e" text-anchor="middle">SSL Hook</text>
<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker>
<polyline points="512,124 530,114" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar2)"/>
<rect x="470" y="106" width="103" height="25" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="521" y="121" font-size="13" fill="#8b949e" text-anchor="middle">Ring Buffer</text>
<polyline points="752,114 770,93" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar2)"/>
</svg>