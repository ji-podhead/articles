<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 200" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>
  <rect width="1050" height="200" fill="#f8fafc" rx="12"/>

  <!-- Step 1 -->
  <rect x="30" y="50" width="140" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="100" y="85" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">1. Agent Process</text>
  <text x="100" y="110" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">Plaintext in memory</text>

  <line x1="170" y1="95" x2="200" y2="95" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="200" y="50" width="150" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="275" y="85" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">2. SSL Uprobe</text>
  <text x="275" y="110" fill="#0284c7" font-family="monospace" font-size="11" text-anchor="middle">SSL_write / read</text>

  <line x1="350" y1="95" x2="380" y2="95" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="380" y="50" width="140" height="90" rx="6" fill="#1e293b" stroke="#0f172a" filter="url(#shadow)"/>
  <text x="450" y="85" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">3. eBPF Ring Buffer</text>
  <text x="450" y="110" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Kernel-to-Userspace</text>

  <line x1="520" y1="95" x2="550" y2="95" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="550" y="50" width="170" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="635" y="80" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">4. Userspace Daemon</text>
  <text x="635" y="102" fill="#16a34a" font-family="sans-serif" font-size="11" text-anchor="middle">Prompt Guard (22M)</text>
  <text x="635" y="120" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">or Embeddings + XGBoost</text>

  <line x1="720" y1="95" x2="750" y2="95" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <rect x="750" y="50" width="130" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="815" y="85" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">5. Verdict Map</text>
  <text x="815" y="110" fill="#475569" font-family="monospace" font-size="11" text-anchor="middle">eBPF Map Update</text>

  <line x1="880" y1="95" x2="910" y2="95" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6 -->
  <rect x="910" y="50" width="110" height="90" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="965" y="80" fill="#991b1b" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">6. Action</text>
  <text x="965" y="105" fill="#b91c1c" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">SIGSTOP</text>
  <text x="965" y="122" fill="#b91c1c" font-family="monospace" font-size="9" text-anchor="middle">TCP-RST / Drop</text>
</svg>
