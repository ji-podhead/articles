<svg xmlns="http://www.w3.org/2000/svg" width="1315" height="443" viewBox="0 0 1315 443" font-family="DejaVu Sans, Verdana, sans-serif">
<rect width="1315" height="443" fill="#0d1117"/>
<rect x="30" y="52" width="246" height="45" fill="#1c2128" stroke="#30363d"/>
<text x="46" y="66" font-size="15" font-weight="bold" fill="#ffffff">Class</text>
<rect x="276" y="52" width="311" height="45" fill="#1c2128" stroke="#30363d"/>
<text x="292" y="66" font-size="15" font-weight="bold" fill="#ffffff">Examples</text>
<rect x="587" y="52" width="349" height="45" fill="#1c2128" stroke="#30363d"/>
<text x="603" y="66" font-size="15" font-weight="bold" fill="#ffffff">What you get</text>
<rect x="936" y="52" width="349" height="45" fill="#1c2128" stroke="#30363d"/>
<text x="952" y="66" font-size="15" font-weight="bold" fill="#ffffff">What you don't</text>
<rect x="30" y="97" width="246" height="87" fill="none" stroke="#30363d"/>
<text x="46" y="111" font-size="15" font-weight="bold" fill="#ffffff">Gateway / Proxy (OSS)</text>
<rect x="276" y="97" width="311" height="87" fill="none" stroke="#30363d"/>
<text x="292" y="111" font-size="15" fill="#c9d1d9">LiteLLM Proxy</text>
<rect x="587" y="97" width="349" height="87" fill="none" stroke="#30363d"/>
<text x="603" y="111" font-size="15" fill="#c9d1d9">✔ Unified provider routing; ✔ User</text>
<text x="603" y="132" font-size="15" fill="#c9d1d9">budgets &amp; rate limits</text>
<rect x="936" y="97" width="349" height="87" fill="none" stroke="#30363d"/>
<text x="952" y="111" font-size="15" fill="#c9d1d9">❌ No process or container</text>
<text x="952" y="132" font-size="15" fill="#c9d1d9">identity; ❌ No operating system</text>
<text x="952" y="153" font-size="15" fill="#c9d1d9">enforcement</text>
<rect x="30" y="184" width="246" height="87" fill="#11161d"/>
<rect x="30" y="184" width="246" height="87" fill="none" stroke="#30363d"/>
<text x="46" y="198" font-size="15" font-weight="bold" fill="#ffffff">In-Process Guards (OSS)</text>
<rect x="276" y="184" width="311" height="87" fill="#11161d"/>
<rect x="276" y="184" width="311" height="87" fill="none" stroke="#30363d"/>
<text x="292" y="198" font-size="15" fill="#c9d1d9">LLM Guard, Guardrails AI, NeMo</text>
<text x="292" y="219" font-size="15" fill="#c9d1d9">Guardrails</text>
<rect x="587" y="184" width="349" height="87" fill="#11161d"/>
<rect x="587" y="184" width="349" height="87" fill="none" stroke="#30363d"/>
<text x="603" y="198" font-size="15" fill="#c9d1d9">✔ Native PII masking; ✔ Prompt</text>
<text x="603" y="219" font-size="15" fill="#c9d1d9">injection &amp; toxicity scanning</text>
<rect x="936" y="184" width="349" height="87" fill="#11161d"/>
<rect x="936" y="184" width="349" height="87" fill="none" stroke="#30363d"/>
<text x="952" y="198" font-size="15" fill="#c9d1d9">❌ Runs inside the application</text>
<text x="952" y="219" font-size="15" fill="#c9d1d9">code; ❌ Not at a centralized</text>
<text x="952" y="240" font-size="15" fill="#c9d1d9">network chokepoint</text>
<rect x="30" y="271" width="246" height="87" fill="none" stroke="#30363d"/>
<text x="46" y="285" font-size="15" font-weight="bold" fill="#ffffff">Commercial Platforms</text>
<rect x="276" y="271" width="311" height="87" fill="none" stroke="#30363d"/>
<text x="292" y="285" font-size="15" fill="#c9d1d9">Lakera (Check Point), Prompt</text>
<text x="292" y="306" font-size="15" fill="#c9d1d9">Security, Portkey (Palo Alto)</text>
<rect x="587" y="271" width="349" height="87" fill="none" stroke="#30363d"/>
<text x="603" y="285" font-size="15" fill="#c9d1d9">✔ Low-latency real-time defense; ✔</text>
<text x="603" y="306" font-size="15" fill="#c9d1d9">Enterprise &quot;Shadow AI&quot; discovery</text>
<rect x="936" y="271" width="349" height="87" fill="none" stroke="#30363d"/>
<text x="952" y="285" font-size="15" fill="#c9d1d9">❌ Closed-source black box; ❌</text>
<text x="952" y="306" font-size="15" fill="#c9d1d9">Foreign data/trust model</text>
<text x="952" y="327" font-size="15" fill="#c9d1d9">requirement</text>
<rect x="30" y="358" width="246" height="87" fill="#11161d"/>
<rect x="30" y="358" width="246" height="87" fill="none" stroke="#30363d"/>
<text x="46" y="372" font-size="15" font-weight="bold" fill="#ffffff">Kernel / Runtime (eBPF)</text>
<rect x="276" y="358" width="311" height="87" fill="#11161d"/>
<rect x="276" y="358" width="311" height="87" fill="none" stroke="#30363d"/>
<text x="292" y="372" font-size="15" fill="#c9d1d9">TigerGate, AgentSight</text>
<rect x="587" y="358" width="349" height="87" fill="#11161d"/>
<rect x="587" y="358" width="349" height="87" fill="none" stroke="#30363d"/>
<text x="603" y="372" font-size="15" fill="#c9d1d9">✔ Zero-instrumentation intercept;</text>
<text x="603" y="393" font-size="15" fill="#c9d1d9">✔ Operates directly at TLS/Crypto</text>
<text x="603" y="414" font-size="15" fill="#c9d1d9">boundary</text>
<rect x="936" y="358" width="349" height="87" fill="#11161d"/>
<rect x="936" y="358" width="349" height="87" fill="none" stroke="#30363d"/>
<text x="952" y="372" font-size="15" fill="#c9d1d9">❌ They see the host, but lack</text>
<text x="952" y="393" font-size="15" fill="#c9d1d9">context on the identity chain that</text>
<text x="952" y="414" font-size="15" fill="#c9d1d9">provisioned the agent</text>
</svg>