<svg xmlns="http://www.w3.org/2000/svg" width="900" height="454" viewBox="0 0 900 454" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="900" height="454" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5"></text>
<rect x="40" y="0" width="288" height="66" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="58" y="26" font-size="15" font-weight="bold" fill="#e6edf3">Host / VM Layer</text>
<text x="58" y="47" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">PID + Socket ➔ eBPF Context</text>
<rect x="40" y="90" width="306" height="66" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="58" y="116" font-size="15" font-weight="bold" fill="#e6edf3">Container Layer</text>
<text x="58" y="137" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Container ID ➔ Docker/CRI API</text>
<rect x="40" y="180" width="380" height="87" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="40" y="180" width="5" height="87" rx="2.5" fill="#60a5fa"/>
<text x="58" y="206" font-size="15" font-weight="bold" fill="#60a5fa">Session Layer (Gateway)</text>
<text x="58" y="227" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Session ID: Minted at provisioning</text>
<text x="58" y="248" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Crucial: Never let the agent self-declare</text>
<rect x="40" y="291" width="380" height="129" rx="11" fill="#161b22" stroke="#f87171" stroke-width="2"/>
<rect x="40" y="291" width="5" height="129" rx="2.5" fill="#f87171"/>
<text x="58" y="317" font-size="15" font-weight="bold" fill="#f87171">🚨 Graduated Incident Response Ladder</text>
<text x="58" y="338" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">1. Revoke Session Token</text>
<text x="58" y="359" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">2. Inject Controlled Error Response</text>
<text x="58" y="380" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">3. SIGSTOP Container (Freeze RAM)</text>
<text x="58" y="401" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">4. Blackhole Egress Network Routing</text>
<marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker>
<polyline points="184,66 193,90" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="193,156 230,180" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="230,267 230,291" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
</svg>