<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
    <marker id="varrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="500" height="560" fill="#f8fafc" rx="12"/>

  <!-- Node 1: Host -->
  <rect x="100" y="30" width="300" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="250" y="60" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">Host / VM Layer</text>
  <text x="250" y="82" fill="#64748b" font-family="monospace" font-size="12" text-anchor="middle">PID + Socket ➔ eBPF Context</text>

  <line x1="250" y1="105" x2="250" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#varrow)"/>

  <!-- Node 2: Container -->
  <rect x="100" y="145" width="300" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="250" y="175" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">Container Layer</text>
  <text x="250" y="197" fill="#64748b" font-family="monospace" font-size="12" text-anchor="middle">Container ID ➔ Docker/CRI API</text>

  <line x1="250" y1="220" x2="250" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#varrow)"/>

  <!-- Node 3: Session -->
  <rect x="70" y="260" width="360" height="90" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="250" y="290" fill="#1e40af" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">Session Layer (Gateway)</text>
  <text x="250" y="312" fill="#1e3a8a" font-family="sans-serif" font-size="12" text-anchor="middle">Session ID: Minted at provisioning</text>
  <text x="250" y="332" fill="#2563eb" font-family="sans-serif" font-style="italic" font-size="11" text-anchor="middle">Crucial: Never let the agent self-declare</text>

  <line x1="250" y1="350" x2="250" y2="380" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#varrow)"/>

  <!-- Node 4: Ladder -->
  <rect x="50" y="390" width="400" height="130" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="420" fill="#991b1b" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">🚨 Graduated Incident Response Ladder</text>
  <g font-family="monospace" font-size="12" fill="#b91c1c" font-weight="bold">
    <text x="90" y="455">1. Revoke Session Token</text>
    <text x="90" y="475">2. Inject Controlled Error Response</text>
    <text x="90" y="495">3. SIGSTOP Container (Freeze RAM)</text>
    <text x="90" y="515">4. Blackhole Egress Network Routing</text>
  </g>
</svg>
