<svg xmlns="http://w3.org" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="520" fill="#f8fafc" rx="12"/>

  <!-- Table Container Background -->
  <rect x="30" y="30" width="1040" height="460" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1" filter="url(#subtleShadow)"/>

  <!-- HEADER ROW -->
  <rect x="30" y="30" width="1040" height="55" fill="#0f172a" rx="8"/>
  <!-- Flatten the bottom corners of the header block to merge with rows -->
  <rect x="30" y="70" width="1040" height="15" fill="#0f172a"/>
  
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9">
    <text x="55" y="64">Class</text>
    <text x="265" y="64">Examples</text>
    <text x="505" y="64">What you get</text>
    <text x="795" y="64">What you don't</text>
  </g>

  <!-- ROW 1: Gateway/proxy -->
  <rect x="30" y="85" width="1040" height="95" fill="#ffffff"/>
  <line x1="30" y1="180" x2="1070" y2="180" stroke="#f1f5f9" stroke-width="1"/>
  <g font-family="sans-serif" font-size="13">
    <text x="55" y="125" font-weight="bold" fill="#1e293b">Gateway / Proxy (OSS)</text>
    <text x="265" y="125" font-family="monospace" fill="#2563eb" font-size="12">LiteLLM Proxy</text>
    
    <!-- Pro Column -->
    <text x="505" y="115" fill="#15803d" font-weight="bold">✔ Unified provider routing</text>
    <text x="505" y="140" fill="#15803d" font-weight="bold">✔ User budgets &amp; rate limits</text>
    
    <!-- Con Column -->
    <text x="795" y="115" fill="#b91c1c">❌ No process or container identity</text>
    <text x="795" y="140" fill="#b91c1c">❌ No operating system enforcement</text>
  </g>

  <!-- ROW 2: In-process guards -->
  <rect x="30" y="181" width="1040" height="95" fill="#f8fafc"/>
  <line x1="30" y1="276" x2="1070" y2="276" stroke="#f1f5f9" stroke-width="1"/>
  <g font-family="sans-serif" font-size="13">
    <text x="55" y="220" font-weight="bold" fill="#1e293b">In-Process Guards (OSS)</text>
    <text x="265" y="210" font-family="monospace" fill="#2563eb" font-size="12">LLM Guard, Guardrails AI,</text>
    <text x="265" y="230" font-family="monospace" fill="#2563eb" font-size="12">NeMo Guardrails</text>
    
    <!-- Pro Column -->
    <text x="505" y="210" fill="#15803d" font-weight="bold">✔ Native PII masking</text>
    <text x="505" y="235" fill="#15803d" font-weight="bold">✔ Prompt injection &amp; toxicity scanning</text>
    
    <!-- Con Column -->
    <text x="795" y="210" fill="#b91c1c">❌ Runs inside the application code</text>
    <text x="795" y="235" fill="#b91c1c">❌ Not at a centralized network chokepoint</text>
  </g>

  <!-- ROW 3: Commercial platforms -->
  <rect x="30" y="277" width="1040" height="105" fill="#ffffff"/>
  <line x1="30" y1="382" x2="1070" y2="382" stroke="#f1f5f9" stroke-width="1"/>
  <g font-family="sans-serif" font-size="13">
    <text x="55" y="320" font-weight="bold" fill="#1e293b">Commercial Platforms</text>
    <text x="265" y="310" font-family="monospace" fill="#2563eb" font-size="12">Lakera (Check Point),</text>
    <text x="265" y="330" font-family="monospace" fill="#2563eb" font-size="12">Prompt Security,</text>
    <text x="265" y="350" font-family="monospace" fill="#2563eb" font-size="12">Portkey (Palo Alto)</text>
    
    <!-- Pro Column -->
    <text x="505" y="315" fill="#15803d" font-weight="bold">✔ Low-latency real-time defense</text>
    <text x="505" y="340" fill="#15803d" font-weight="bold">✔ Enterprise "Shadow AI" discovery</text>
    
    <!-- Con Column -->
    <text x="795" y="315" fill="#b91c1c">❌ Closed-source black box</text>
    <text x="795" y="340" fill="#b91c1c">❌ Foreign data/trust model requirement</text>
  </g>

  <!-- ROW 4: Kernel/runtime -->
  <rect x="30" y="383" width="1040" height="105" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5" rx="8"/>
  <!-- Flatten top corners of row 4 to fit inner layout -->
  <rect x="31" y="383" width="1038" height="15" fill="#f0fdf4"/>
  <g font-family="sans-serif" font-size="13">
    <text x="55" y="425" font-weight="bold" fill="#14532d">Kernel / Runtime (eBPF)</text>
    <text x="265" y="420" font-family="monospace" fill="#059669" font-size="12">TigerGate,</text>
    <text x="265" y="440" font-family="monospace" fill="#059669" font-size="12">AgentSight</text>
    
    <!-- Pro Column -->
    <text x="505" y="420" fill="#166534" font-weight="bold">✔ Zero-instrumentation intercept</text>
    <text x="505" y="445" fill="#166534" font-weight="bold">✔ Operates directly at TLS/Crypto boundary</text>
    
    <!-- Con Column -->
    <text x="795" y="420" fill="#b91c1c">❌ They see the host, but lack context on the</text>
    <text x="795" y="440" fill="#b91c1c">   identity chain that provisioned the agent</text>
  </g>
</svg>
