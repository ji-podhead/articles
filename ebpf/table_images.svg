<rect x="570" y="97" width="349" height="108" fill="none" stroke="#30363d"/>
<text x="586" y="111" font-size="15" fill="#c9d1d9">Title image: kernel-level</text>
<text x="586" y="132" font-size="15" fill="#c9d1d9">interception meets LLM guardrails</text>
<text x="586" y="153" font-size="15" fill="#c9d1d9">- the two halves this article</text>
<text x="586" y="174" font-size="15" fill="#c9d1d9">connects.</text>
<rect x="30" y="205" width="191" height="108" fill="#11161d"/>
<rect x="30" y="205" width="191" height="108" fill="none" stroke="#30363d"/>
<text x="46" y="219" font-size="15" font-weight="bold" fill="#ffffff">gap2.svg</text>
<rect x="221" y="205" width="349" height="108" fill="#11161d"/>
<rect x="221" y="205" width="349" height="108" fill="none" stroke="#30363d"/>
<text x="237" y="219" font-size="15" fill="#c9d1d9">Section &quot;The semantic gap&quot; (Figure</text>
<text x="237" y="240" font-size="15" fill="#c9d1d9">1)</text>
<rect x="570" y="205" width="349" height="108" fill="#11161d"/>
<rect x="570" y="205" width="349" height="108" fill="none" stroke="#30363d"/>
<text x="586" y="219" font-size="15" fill="#c9d1d9">The semantic gap - infrastructure</text>
<text x="586" y="240" font-size="15" fill="#c9d1d9">tools see the &quot;how&quot;, AI guardrails</text>
<text x="586" y="261" font-size="15" fill="#c9d1d9">see the &quot;what&quot;, and nothing</text>
<text x="586" y="282" font-size="15" fill="#c9d1d9">correlates the two.</text>
<rect x="30" y="313" width="191" height="108" fill="none" stroke="#30363d"/>
<text x="46" y="327" font-size="15" font-weight="bold" fill="#ffffff">pipeline.svg</text>
<rect x="221" y="313" width="349" height="108" fill="none" stroke="#30363d"/>
<text x="237" y="327" font-size="15" fill="#c9d1d9">Section &quot;How eBPF-based</text>
<text x="237" y="348" font-size="15" fill="#c9d1d9">interception actually works</text>
<text x="237" y="369" font-size="15" fill="#c9d1d9">(Figure 2)&quot;</text>
<rect x="570" y="313" width="349" height="108" fill="none" stroke="#30363d"/>
<text x="586" y="327" font-size="15" fill="#c9d1d9">The eBPF interception pipeline -</text>
<text x="586" y="348" font-size="15" fill="#c9d1d9">capture at the TLS boundary, judge</text>
<text x="586" y="369" font-size="15" fill="#c9d1d9">in userspace, enforce in the</text>
<text x="586" y="390" font-size="15" fill="#c9d1d9">kernel.</text>
<rect x="30" y="421" width="191" height="150" fill="#11161d"/>
<rect x="30" y="421" width="191" height="150" fill="none" stroke="#30363d"/>
<text x="46" y="435" font-size="15" font-weight="bold" fill="#ffffff">freeze_latter.svg</text>
<rect x="221" y="421" width="349" height="150" fill="#11161d"/>
<rect x="221" y="421" width="349" height="150" fill="none" stroke="#30363d"/>
<text x="237" y="435" font-size="15" fill="#c9d1d9">Section &quot;The part that actually</text>
<text x="237" y="456" font-size="15" fill="#c9d1d9">matters: identity&quot; (Figure 4)</text>
<rect x="570" y="421" width="349" height="150" fill="#11161d"/>
<rect x="570" y="421" width="349" height="150" fill="none" stroke="#30363d"/>
<text x="586" y="435" font-size="15" fill="#c9d1d9">The identity chain and the</text>
<text x="586" y="456" font-size="15" fill="#c9d1d9">response ladder - identity flows</text>
<text x="586" y="477" font-size="15" fill="#c9d1d9">from the kernel-visible PID down</text>
<text x="586" y="498" font-size="15" fill="#c9d1d9">to the minted session token, and</text>
<text x="586" y="519" font-size="15" fill="#c9d1d9">enforcement escalates from</text>
<text x="586" y="540" font-size="15" fill="#c9d1d9">revocation to egress blackhole.</text>
</svg>