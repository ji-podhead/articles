<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Modern Tech Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="60%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#3a506b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern for Tech Aesthetic -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M 0,75 L 1200,75 M 0,150 L 1200,150 M 0,225 L 1200,225 M 0,300 L 1200,300 M 0,375 L 1200,375 M 0,450 L 1200,450 M 0,525 L 1200,525 M 0,600 L 1200,600" />
    <path d="M 150,0 L 150,675 M 300,0 L 300,675 M 450,0 L 450,675 M 600,0 L 600,675 M 750,0 L 750,675 M 900,0 L 900,675 M 1050,0 L 1050,675" />
  </g>

  <!-- Abstract Kernel / Ring Buffer Circles on the right -->
  <g opacity="0.15">
    <circle cx="950" cy="337" r="280" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="12,6"/>
    <circle cx="950" cy="337" r="200" fill="none" stroke="#818cf8" stroke-width="4"/>
    <circle cx="950" cy="337" r="120" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="4,4"/>
  </g>

  <!-- Left Side: Typography & Title -->
  <g transform="translate(100, 160)">
    <!-- KERNEL LEVEL Badge -->
    <rect x="0" y="0" width="250" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="125" y="19" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1" text-anchor="middle">JiMesh LLM &amp; APP Security</text>
    
    <!-- Main Title Lines -->
    <text x="0" y="90" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="54" letter-spacing="-1">Stopping Prompt Injection</text>
    <text x="0" y="155" fill="url(#accentGrad)" font-family="sans-serif" font-weight="900" font-size="54" letter-spacing="-1">at the Kernel Level</text>
    
    <!-- Subtitle / Hook -->
    <text x="0" y="220" fill="#94a3b8" font-family="sans-serif" font-weight="normal" font-size="22">How eBPF + Lightweight LLM Guards Actually Work</text>

    <!-- Decorative Minimal Terminal Code Snippet -->
    <g transform="translate(0, 270)" font-family="monospace" font-size="15" fill="#64748b">
      <text x="0" y="0"><tspan fill="#f43f5e"># </tspan>bpftrace -e <tspan fill="#10b981">'uprobe:libssl:SSL_write { print(str(arg1)); }'</tspan></text>
      <text x="0" y="30" fill="#475569">➔ [Kernel] Intercepting plaintext stream...</text>
      <text x="0" y="55" fill="#10b981">➔ [Userspace Daemon] Verdict: PROMPT_GUARD_SAFE (0.84ms)</text>
    </g>
  </g>

  <!-- Right Side: Graphic Element (eBPF Bee + Shield) -->
  <g transform="translate(900, 337)" filter="url(#softShadow)">
    <!-- Base Glow -->
    <circle cx="0" cy="0" r="110" fill="#38bdf8" opacity="0.05" filter="url(#glow)"/>
    
    <!-- Outer Shield Layer -->
    <polygon points="0,-120 100,-70 100,40 0,120 -100,40 -100,-70" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="4"/>
    
    <!-- Inner Secure Shield -->
    <polygon points="0,-100 80,-60 80,30 0,100 -80,30 -80,-60" fill="url(#shieldGrad)" opacity="0.8"/>

    <!-- Stylized eBPF Bee (Icon-Style) -->
    <g transform="translate(0, -10) scale(1.3)" fill="#ffffff">
      <!-- Wings -->
      <ellipse cx="-25" cy="-20" rx="15" ry="25" fill="#38bdf8" opacity="0.7" transform="rotate(-30 -25 -20)"/>
      <ellipse cx="25" cy="-20" rx="15" ry="25" fill="#38bdf8" opacity="0.7" transform="rotate(30 25 -20)"/>
      <!-- Body Stripes (Bee) -->
      <rect x="-20" y="-15" width="40" height="40" rx="20" fill="#0f172a"/>
      <path d="M -18,-5 Q 0,-2 18,-5 L 18,5 Q 0,8 -18,5 Z" fill="#fbbf24"/>
      <path d="M -15,12 Q 0,15 15,12 L 12,20 Q 0,22 -12,20 Z" fill="#fbbf24"/>
      <!-- Eyes / Antennae -->
      <circle cx="-8" cy="-22" r="3" fill="#ffffff"/>
      <circle cx="8" cy="-22" r="3" fill="#ffffff"/>
      <path d="M -5,-28 Q -12,-38 -20,-35" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M 5,-28 Q 12,-38 20,-35" fill="none" stroke="#ffffff" stroke-width="2"/>
    </g>
  </g>
</svg>
