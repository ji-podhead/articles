<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Object Tracking: Kalman Filter + DeepSORT Architecture">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="kalmanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="deepsortGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="metricGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="none" stroke="#3a506b" stroke-width="1" opacity="0.3"/>

  <text x="600" y="42" text-anchor="middle" fill="#fafafa" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="900" letter-spacing="1.5">
    OBJECT TRACKING: KALMAN FILTER + DEEPSORT
  </text>
  <text x="600" y="64" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="13">
    from prediction-correction cycles to deep re-identification
  </text>

  <!-- ═══ KALMAN FILTER SECTION (left) ═══ -->
  <g transform="translate(50, 90)">
    <rect width="520" height="280" rx="14" fill="#0f172a" stroke="url(#kalmanGrad)" stroke-width="2"/>
    <rect width="520" height="46" rx="14" fill="url(#kalmanGrad)" opacity="0.15"/>
    <text x="260" y="24" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI" font-size="18" font-weight="900">
      KALMAN FILTER
    </text>
    <text x="260" y="40" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">
      the recursive predictor-corrector
    </text>

    <!-- Prediction-Correction Cycle -->
    <g transform="translate(40, 65)">
      <!-- Prediction Box -->
      <rect x="0" y="0" width="180" height="80" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="90" y="25" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI" font-size="13" font-weight="700">① PREDICTION</text>
      <text x="90" y="45" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">forecast next position</text>
      <text x="90" y="60" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">based on past states (pos, vel)</text>

      <!-- Correction Box -->
      <rect x="260" y="0" width="180" height="80" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="350" y="25" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI" font-size="13" font-weight="700">② CORRECTION</text>
      <text x="350" y="45" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">compare with measurement</text>
      <text x="350" y="60" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">weight by uncertainty</text>

      <!-- Cycle arrows -->
      <line x1="180" y1="30" x2="260" y2="30" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
      <polygon points="255,25 255,35 265,30" fill="#38bdf8"/>
      <path d="M 350,80 Q 350,110 220,110 Q 90,110 90,85" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
      <polygon points="85,88 95,88 90,78" fill="#38bdf8" opacity="0.5"/>
    </g>

    <!-- Key insight -->
    <g transform="translate(40, 175)">
      <rect width="440" height="80" rx="8" fill="#38bdf8" opacity="0.08"/>
      <text x="220" y="22" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI" font-size="12" font-weight="700">
        WHY IT'S STILL USED TODAY
      </text>
      <text x="220" y="45" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">
        ✓ very fast (real-time capable)    ✓ handles noisy measurements
      </text>
      <text x="220" y="62" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">
        ✓ smooth consistent tracks    ✓ works even with missing detections
      </text>
    </g>
  </g>

  <!-- ═══ DEEPSORT SECTION (right) ═══ -->
  <g transform="translate(630, 90)">
    <rect width="520" height="280" rx="14" fill="#0f172a" stroke="url(#deepsortGrad)" stroke-width="2" filter="url(#glow)"/>
    <rect width="520" height="46" rx="14" fill="url(#deepsortGrad)" opacity="0.15"/>
    <text x="260" y="24" text-anchor="middle" fill="#a78bfa" font-family="Segoe UI" font-size="18" font-weight="900">
      DeepSORT
    </text>
    <text x="260" y="40" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">
      deep learning + SORT = robust multi-object tracking
    </text>

    <!-- Two parallel modules -->
    <g transform="translate(30, 65)">
      <!-- Motion module -->
      <rect x="0" y="0" width="200" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="100" y="22" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI" font-size="11" font-weight="700">Motion Module</text>
      <text x="100" y="40" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">Kalman Filter</text>
      <text x="100" y="56" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">trajectory prediction</text>

      <!-- Appearance module -->
      <rect x="240" y="0" width="200" height="70" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
      <text x="340" y="22" text-anchor="middle" fill="#a78bfa" font-family="Segoe UI" font-size="11" font-weight="700">Appearance Module</text>
      <text x="340" y="40" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">ReID (Deep Learning)</text>
      <text x="340" y="56" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">identity across frames</text>

      <!-- Fusion arrows -->
      <line x1="100" y1="70" x2="170" y2="95" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
      <line x1="340" y1="70" x2="270" y2="95" stroke="#a78bfa" stroke-width="1.5" opacity="0.6"/>

      <!-- Data Association -->
      <rect x="120" y="95" width="200" height="60" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="220" y="118" text-anchor="middle" fill="#a78bfa" font-family="Segoe UI" font-size="12" font-weight="700">Data Association</text>
      <text x="220" y="138" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">align detections ↔ existing tracks</text>
    </g>

    <!-- Advantages -->
    <g transform="translate(30, 180)">
      <text x="0" y="12" fill="#a78bfa" font-family="Segoe UI" font-size="11" font-weight="700">KEY ADVANTAGES:</text>
      <text x="0" y="32" fill="#94a3b8" font-family="monospace" font-size="9">✓ Robust to occlusions + motion blur</text>
      <text x="0" y="48" fill="#94a3b8" font-family="monospace" font-size="9">✓ High accuracy (motion + appearance synergy)</text>
      <text x="0" y="64" fill="#94a3b8" font-family="monospace" font-size="9">✓ Multi-target efficient    ✓ Dynamic environments</text>
    </g>
  </g>

  <!-- ═══ MOTA FORMULA (bottom-left) ═══ -->
  <g transform="translate(50, 400)">
    <rect width="520" height="220" rx="14" fill="#0f172a" stroke="url(#metricGrad)" stroke-width="1.5"/>
    <rect width="520" height="40" rx="14" fill="url(#metricGrad)" opacity="0.15"/>
    <text x="260" y="22" text-anchor="middle" fill="#34d399" font-family="Segoe UI" font-size="16" font-weight="900">
      MOTA — TRACKING ACCURACY
    </text>

    <!-- Formula -->
    <g transform="translate(260, 60)">
      <rect x="-160" y="0" width="320" height="50" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
      <text x="0" y="22" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="14" font-weight="bold">
        MOTA = 1 − (FP + FN + IDS) / GT
      </text>
      <text x="0" y="42" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">
        100% = perfect tracking
      </text>
    </g>

    <!-- Legend -->
    <g transform="translate(60, 130)">
      <text x="0" y="15" fill="#f87171" font-family="monospace" font-size="10" font-weight="bold">FP</text>
      <text x="30" y="15" fill="#94a3b8" font-family="monospace" font-size="9">False Positives (wrong detections)</text>
      <text x="0" y="35" fill="#f87171" font-family="monospace" font-size="10" font-weight="bold">FN</text>
      <text x="30" y="35" fill="#94a3b8" font-family="monospace" font-size="9">False Negatives (missed objects)</text>
      <text x="0" y="55" fill="#f87171" font-family="monospace" font-size="10" font-weight="bold">IDS</text>
      <text x="30" y="55" fill="#94a3b8" font-family="monospace" font-size="9">Identity Switches (wrong ID assignment)</text>
      <text x="0" y="75" fill="#f87171" font-family="monospace" font-size="10" font-weight="bold">GT</text>
      <text x="30" y="75" fill="#94a3b8" font-family="monospace" font-size="9">Ground Truth occurrences</text>
    </g>

    <g transform="translate(300, 130)">
      <text x="0" y="15" fill="#34d399" font-family="Segoe UI" font-size="11" font-weight="700">Also:</text>
      <text x="0" y="35" fill="#94a3b8" font-family="monospace" font-size="9">MOTP = position precision</text>
      <text x="0" y="55" fill="#94a3b8" font-family="monospace" font-size="9">OpenCV + YOLO compatible</text>
      <text x="0" y="75" fill="#64748b" font-family="monospace" font-size="9">MOT Challenge benchmarks</text>
    </g>
  </g>

  <!-- ═══ TOOLS & SOURCES (bottom-right) ═══ -->
  <g transform="translate(630, 400)">
    <rect width="520" height="220" rx="14" fill="#0f172a" stroke="#3a506b" stroke-width="1"/>
    <text x="260" y="25" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI" font-size="14" font-weight="700" letter-spacing="1">
      🛠️ TOOLS & BENCHMARKS
    </text>

    <g transform="translate(40, 50)">
      <rect width="200" height="60" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="100" y="22" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI" font-size="11" font-weight="700">py-motmetrics</text>
      <text x="100" y="40" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">Python MOT evaluation</text>
      <text x="100" y="52" text-anchor="middle" fill="#475569" font-family="monospace" font-size="8">github.com/cheind/py-motmetrics</text>
    </g>

    <g transform="translate(280, 50)">
      <rect width="200" height="60" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="100" y="22" text-anchor="middle" fill="#a5b4fc" font-family="Segoe UI" font-size="11" font-weight="700">MOT Challenge</text>
      <text x="100" y="40" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">official benchmark results</text>
      <text x="100" y="52" text-anchor="middle" fill="#475569" font-family="monospace" font-size="8">motchallenge.net</text>
    </g>

    <g transform="translate(40, 130)">
      <rect width="200" height="60" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="100" y="22" text-anchor="middle" fill="#34d399" font-family="Segoe UI" font-size="11" font-weight="700">OpenCV Trackers</text>
      <text x="100" y="40" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">all models available</text>
      <text x="100" y="52" text-anchor="middle" fill="#475569" font-family="monospace" font-size="8">+ YOLO detection combo</text>
    </g>

    <g transform="translate(280, 130)">
      <rect width="200" height="60" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="100" y="22" text-anchor="middle" fill="#f59e0b" font-family="Segoe UI" font-size="11" font-weight="700">OC-SORT + CMC</text>
      <text x="100" y="40" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">refined motion modeling</text>
      <text x="100" y="52" text-anchor="middle" fill="#475569" font-family="monospace" font-size="8">+ cross-modal consistency</text>
    </g>
  </g>

  <text x="600" y="665" text-anchor="middle" fill="#475569" font-family="monospace" font-size="10">
    #ObjectTracking #ComputerVision #Robotics #KalmanFilter #DeepSORT #MOTA #IsaacSim
  </text>
</svg>
