<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="955" viewBox="0 0 1200 955" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="955" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">OBJECT TRACKING: KALMAN FILTER + DEEPSORT</text>
<text x="40" y="100" font-size="17" fill="#8b949e">from prediction-correction cycles to deep re-identification</text>
<rect x="40" y="106" width="550" height="318" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="40" y="106" width="5" height="318" rx="2.5" fill="#60a5fa"/>
<text x="58" y="132" font-size="15" font-weight="bold" fill="#60a5fa">KALMAN FILTER</text>
<text x="58" y="153" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">the recursive predictor-corrector</text>
<text x="58" y="174" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="58" y="195" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">① PREDICTION</text>
<text x="58" y="216" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">forecast next position</text>
<text x="58" y="237" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">based on past states (pos, vel)</text>
<text x="58" y="258" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="58" y="279" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">② CORRECTION</text>
<text x="58" y="300" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">compare with measurement</text>
<text x="58" y="321" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">weight by uncertainty</text>
<text x="58" y="342" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="58" y="363" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">WHY IT'S STILL USED TODAY</text>
<text x="58" y="384" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">✓ very fast (real-time capable) ✓ handles noisy measurements</text>
<text x="58" y="405" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">✓ smooth consistent tracks ✓ works even with missing detections</text>
<rect x="610" y="106" width="550" height="360" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="628" y="132" font-size="15" font-weight="bold" fill="#e6edf3">DeepSORT</text>
<text x="628" y="153" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">deep learning + SORT = robust multi-object tracking</text>
<text x="628" y="174" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="628" y="195" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Motion Module</text>
<text x="628" y="216" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Kalman Filter</text>
<text x="628" y="237" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">trajectory prediction</text>
<text x="628" y="258" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Appearance Module</text>
<text x="628" y="279" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">ReID (Deep Learning)</text>
<text x="628" y="300" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">identity across frames</text>
<text x="628" y="321" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Data Association</text>
<text x="628" y="342" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">align detections ↔ existing tracks</text>
<text x="628" y="363" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="628" y="384" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">KEY ADVANTAGES:</text>
<text x="628" y="405" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">✓ Robust to occlusions + motion blur</text>
<text x="628" y="426" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">✓ High accuracy (motion + appearance synergy)</text>
<text x="628" y="447" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">✓ Multi-target efficient ✓ Dynamic environments</text>
<rect x="40" y="490" width="550" height="381" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="40" y="490" width="5" height="381" rx="2.5" fill="#4ade80"/>
<text x="58" y="516" font-size="15" font-weight="bold" fill="#4ade80">MOTA - TRACKING ACCURACY</text>
<text x="58" y="537" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">MOTA = 1 − (FP + FN + IDS) / GT</text>
<text x="58" y="558" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">100% = perfect tracking</text>
<text x="58" y="579" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="58" y="600" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">FP</text>
<text x="58" y="621" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">False Positives (wrong detections)</text>
<text x="58" y="642" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">FN</text>
<text x="58" y="663" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">False Negatives (missed objects)</text>
<text x="58" y="684" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">IDS</text>
<text x="58" y="705" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Identity Switches (wrong ID assignment)</text>
<text x="58" y="726" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">GT</text>
<text x="58" y="747" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Ground Truth occurrences</text>
<text x="58" y="768" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="58" y="789" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Also:</text>
<text x="58" y="810" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">MOTP = position precision</text>
<text x="58" y="831" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">OpenCV + YOLO compatible</text>
<text x="58" y="852" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">MOT Challenge benchmarks</text>
<rect x="610" y="490" width="550" height="381" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="628" y="516" font-size="15" font-weight="bold" fill="#e6edf3">TOOLS &amp; BENCHMARKS</text>
<text x="628" y="537" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">py-motmetrics</text>
<text x="628" y="558" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Python MOT evaluation</text>
<text x="628" y="579" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">github.com/cheind/py-motmetrics</text>
<text x="628" y="600" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">MOT Challenge</text>
<text x="628" y="621" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">official benchmark results</text>
<text x="628" y="642" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">motchallenge.net</text>
<text x="628" y="663" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">OpenCV Trackers</text>
<text x="628" y="684" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">all models available</text>
<text x="628" y="705" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">+ YOLO detection combo</text>
<text x="628" y="726" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">OC-SORT + CMC</text>
<text x="628" y="747" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">refined motion modeling</text>
<text x="628" y="768" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">+ cross-modal consistency</text>
<text x="628" y="789" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="628" y="810" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="628" y="831" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="628" y="852" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="40" y="908" font-size="13" fill="#6e7681">#ObjectTracking #ComputerVision #Robotics #KalmanFilter #DeepSORT #MOTA #IsaacSim</text>
