<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="480" viewBox="0 0 1050 480" font-family="Helvetica, Arial, sans-serif">
  <rect width="1050" height="480" fill="#0f172a"/>

  <text x="30" y="42" fill="#e2e8f0" font-size="20" font-weight="bold">Two ingestion processes, one synthesis engine</text>

  <!-- process A -->
  <rect x="30" y="70" width="440" height="250" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
  <text x="250" y="98" fill="#c7d2fe" font-size="14" text-anchor="middle" font-weight="bold">Process A — build the knowledge base</text>
  <text x="250" y="118" fill="#a5b4fc" font-size="11" text-anchor="middle">textbooks · guidelines · studies</text>
  <g font-family="monospace" font-size="11" text-anchor="middle">
    <rect x="55" y="140" width="110" height="30" rx="6" fill="#312e81" stroke="#818cf8"/>
    <text x="110" y="159" fill="#c7d2fe">smart chunk</text>
    <rect x="195" y="140" width="110" height="30" rx="6" fill="#312e81" stroke="#818cf8"/>
    <text x="250" y="159" fill="#c7d2fe">entities</text>
    <rect x="335" y="140" width="110" height="30" rx="6" fill="#312e81" stroke="#818cf8"/>
    <text x="390" y="159" fill="#c7d2fe">rerank</text>
    <rect x="125" y="200" width="110" height="30" rx="6" fill="#312e81" stroke="#818cf8"/>
    <text x="180" y="219" fill="#c7d2fe">embed + store</text>
  </g>
  <g stroke="#818cf8" stroke-width="1.5" fill="none">
    <path d="M 165,155 L 195,155 M 305,155 L 335,155 M 390,170 L 240,205 L 235,215"/>
  </g>
  <text x="250" y="262" fill="#f97316" font-size="11" text-anchor="middle" font-family="monospace" font-weight="bold">expensive ONCE · LLM-intensive · reused forever</text>
  <text x="250" y="285" fill="#64748b" font-size="11" text-anchor="middle" font-family="monospace">→ collection: medical_knowledge</text>

  <!-- process B -->
  <rect x="580" y="70" width="440" height="250" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="800" y="98" fill="#dcfce7" font-size="14" text-anchor="middle" font-weight="bold">Process B — ingest instance data</text>
  <text x="800" y="118" fill="#86efac" font-size="11" text-anchor="middle">discharge letter · maintenance log · lab report</text>
  <g font-family="monospace" font-size="11" text-anchor="middle">
    <rect x="605" y="140" width="120" height="30" rx="6" fill="#14532d" stroke="#22c55e"/>
    <text x="665" y="159" fill="#86efac">classify + metadata</text>
    <rect x="755" y="140" width="110" height="30" rx="6" fill="#14532d" stroke="#22c55e"/>
    <text x="810" y="159" fill="#86efac">simple chunk</text>
    <rect x="895" y="140" width="110" height="30" rx="6" fill="#14532d" stroke="#22c55e"/>
    <text x="950" y="159" fill="#86efac">embed + store</text>
    <rect x="745" y="200" width="110" height="30" rx="6" fill="#14532d" stroke="#22c55e"/>
    <text x="800" y="219" fill="#86efac">payload filter ✓</text>
  </g>
  <g stroke="#22c55e" stroke-width="1.5" fill="none">
    <path d="M 725,155 L 755,155 M 865,155 L 895,155 M 950,170 L 855,205 L 855,215"/>
  </g>
  <text x="800" y="262" fill="#22c55e" font-size="11" text-anchor="middle" font-family="monospace" font-weight="bold">cheap PER DOCUMENT · schema-driven · repeatable</text>
  <text x="800" y="285" fill="#64748b" font-size="11" text-anchor="middle" font-family="monospace">→ collection: patients_data / building_documents</text>

  <!-- synthesis -->
  <g stroke="#475569" stroke-width="2.5" fill="none">
    <path d="M 250,320 L 250,360 Q 250,375 270,375 L 420,375"/>
    <path d="M 800,320 L 800,360 Q 800,375 780,375 L 630,375"/>
  </g>
  <rect x="425" y="345" width="200" height="60" rx="10" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
  <text x="525" y="370" fill="#e0e7ff" font-size="13" text-anchor="middle" font-weight="bold">RAG = synthesis engine</text>
  <text x="525" y="390" fill="#a5b4fc" font-size="10" text-anchor="middle">filtered facts + deep context → answer</text>

  <line x1="30" y1="440" x2="1020" y2="440" stroke="#334155" stroke-width="1"/>
  <text x="525" y="460" fill="#475569" font-size="10" text-anchor="middle">payloads: patient_id · document_type · date · device_id — the primary, exact filter</text>
</svg>
