<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="539" viewBox="0 0 1200 539" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="539" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">Two ingestion processes, one synthesis engine</text>
<rect x="208" y="70" width="380" height="213" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="208" y="70" width="5" height="213" rx="2.5" fill="#60a5fa"/>
<text x="226" y="96" font-size="15" font-weight="bold" fill="#60a5fa">Process A - build the knowledge base</text>
<text x="226" y="117" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">textbooks · guidelines · studies</text>
<text x="226" y="138" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">smart chunk</text>
<text x="226" y="159" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">entities</text>
<text x="226" y="180" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">rerank</text>
<text x="226" y="201" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">embed + store</text>
<text x="226" y="222" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">expensive ONCE · LLM-intensive · reused</text>
<text x="226" y="243" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">forever</text>
<text x="226" y="264" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">→ collection: medical_knowledge</text>
<rect x="612" y="70" width="380" height="255" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="612" y="70" width="5" height="255" rx="2.5" fill="#4ade80"/>
<text x="630" y="96" font-size="15" font-weight="bold" fill="#4ade80">Process B - ingest instance data</text>
<text x="630" y="117" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">discharge letter · maintenance log · lab</text>
<text x="630" y="138" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">report</text>
<text x="630" y="159" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">classify + metadata</text>
<text x="630" y="180" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">simple chunk</text>
<text x="630" y="201" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">embed + store</text>
<text x="630" y="222" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">payload filter ✓</text>
<text x="630" y="243" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">cheap PER DOCUMENT · schema-driven ·</text>
<text x="630" y="264" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">repeatable</text>
<text x="630" y="285" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">→ collection: patients_data /</text>
<text x="630" y="306" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">building_documents</text>
<rect x="410" y="349" width="380" height="66" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="410" y="349" width="5" height="66" rx="2.5" fill="#60a5fa"/>
<text x="428" y="375" font-size="15" font-weight="bold" fill="#60a5fa">RAG = synthesis engine</text>
<text x="428" y="396" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">filtered facts + deep context → answer</text>
<rect x="40" y="439" width="380" height="66" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="58" y="465" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">payloads: patient_id · document_type · date ·</text>
<text x="58" y="486" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">device_id - the primary, exact filter</text>
