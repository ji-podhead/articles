<polyline points="398,283 600,349" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<polyline points="802,325 600,349" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
</svg>