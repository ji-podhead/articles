<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="770" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">SNOMED CT concept model: IS-A hierarchy + defining attributes</text>
<text x="40" y="100" font-size="17" fill="#8b949e">a concept is defined by its parent (IS-A) plus attribute-value pairs, not by a label alone</text>
<rect x="234" y="106" width="156" height="66" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="252" y="132" font-size="15" font-weight="bold" fill="#e6edf3">Disease</text>
<text x="252" y="153" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">(disorder)</text>
<rect x="410" y="106" width="156" height="66" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="428" y="132" font-size="15" font-weight="bold" fill="#e6edf3">Pneumonia</text>
<text x="428" y="153" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">(disorder)</text>
<rect x="586" y="106" width="380" height="66" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="586" y="106" width="5" height="66" rx="2.5" fill="#60a5fa"/>
<text x="604" y="132" font-size="15" font-weight="bold" fill="#60a5fa">Bacterial pneumonia</text>
<text x="604" y="153" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">(disorder) - the concept being defined</text>
<rect x="263" y="196" width="210" height="66" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="263" y="196" width="5" height="66" rx="2.5" fill="#60a5fa"/>
<text x="281" y="222" font-size="15" font-weight="bold" fill="#60a5fa">Structure of lung</text>
<text x="281" y="243" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">(body structure)</text>
<rect x="493" y="196" width="269" height="66" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="493" y="196" width="5" height="66" rx="2.5" fill="#60a5fa"/>
<text x="511" y="222" font-size="15" font-weight="bold" fill="#60a5fa">Inflammation</text>
<text x="511" y="243" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">(morphologic abnormality)</text>
<rect x="782" y="196" width="156" height="66" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="782" y="196" width="5" height="66" rx="2.5" fill="#60a5fa"/>
<text x="800" y="222" font-size="15" font-weight="bold" fill="#60a5fa">Bacterium</text>
<text x="800" y="243" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">(organism)</text>
<rect x="410" y="286" width="380" height="297" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="428" y="312" font-size="15" font-weight="bold" fill="#e6edf3">domain / range</text>
<text x="428" y="333" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Each attribute has a fixed:</text>
<text x="428" y="354" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">domain - which concepts may carry it</text>
<text x="428" y="375" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">range - which concepts are valid values</text>
<text x="428" y="396" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">e.g. |Finding site| ranges over |body</text>
<text x="428" y="417" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">structure| and its</text>
<text x="428" y="438" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">descendants only - an agent cannot bind it to</text>
<text x="428" y="459" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">a random node.</text>
<text x="428" y="480" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Why RAG cares:</text>
<text x="428" y="501" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">an LLM extracting &quot;treats&quot; or &quot;finding site&quot;</text>
<text x="428" y="522" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">edges can be</text>
<text x="428" y="543" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">constrained to these domains - no more</text>
<text x="428" y="564" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">inventing relations.</text>
<rect x="40" y="607" width="380" height="129" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="58" y="633" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">polyhierarchy: IS-A can have multiple parents</text>
<text x="58" y="654" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">- one concept, several valid classifications</text>
<text x="58" y="675" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">original figure, modeled on the SNOMED CT</text>
<text x="58" y="696" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">concept model (SNOMED International</text>
<text x="58" y="717" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">documentation, docs.snomed.org)</text>
<marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker>
<polyline points="390,139 410,139" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar1)"/>
<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/></marker>
<polyline points="566,139 586,139" fill="none" stroke="#4ade80" stroke-width="2.2" marker-end="url(#ar2)"/>
<rect x="553" y="127" width="46" height="25" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="576" y="142" font-size="13" fill="#8b949e" text-anchor="middle">IS A</text>
<marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/></marker>
<polyline points="776,172 368,196" fill="none" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#ar3)"/>
<rect x="517" y="172" width="111" height="25" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="572" y="187" font-size="13" fill="#8b949e" text-anchor="middle">Finding site</text>
<polyline points="776,172 628,196" fill="none" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#ar3)"/>
<rect x="610" y="172" width="183" height="25" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="702" y="187" font-size="13" fill="#8b949e" text-anchor="middle">Associated morphology</text>
<polyline points="776,172 860,196" fill="none" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#ar3)"/>
<rect x="751" y="172" width="135" height="25" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="818" y="187" font-size="13" fill="#8b949e" text-anchor="middle">Causative agent</text>
</svg>