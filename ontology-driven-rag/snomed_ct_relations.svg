<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="520" viewBox="0 0 1050 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="1050" height="520" fill="#0f172a"/>

  <text x="30" y="42" fill="#e2e8f0" font-size="20" font-weight="bold">SNOMED CT concept model: IS-A hierarchy + defining attributes</text>
  <text x="30" y="64" fill="#94a3b8" font-size="12">a concept is defined by its parent (IS-A) plus attribute-value pairs, not by a label alone</text>

  <!-- IS-A chain (left) -->
  <g font-family="monospace" font-size="12" text-anchor="middle">
    <rect x="60" y="100" width="200" height="40" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="160" y="124" fill="#94a3b8">Disease (disorder)</text>

    <line x1="160" y1="140" x2="160" y2="175" stroke="#475569" stroke-width="1.5"/>
    <rect x="60" y="175" width="200" height="40" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="160" y="199" fill="#94a3b8">Pneumonia (disorder)</text>

    <line x1="160" y1="215" x2="160" y2="250" stroke="#22c55e" stroke-width="2"/>
    <text x="185" y="236" fill="#4ade80" font-size="10" text-anchor="start">IS A</text>
    <rect x="35" y="250" width="250" height="46" rx="8" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
    <text x="160" y="270" fill="#e0e7ff" font-weight="bold">Bacterial pneumonia</text>
    <text x="160" y="286" fill="#c7d2fe" font-size="10">(disorder) — the concept being defined</text>
  </g>

  <!-- defining attributes (right, fan out from the concept) -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="none">
    <path d="M 285,260 L 420,150"/>
    <path d="M 285,270 L 420,272"/>
    <path d="M 285,282 L 420,394"/>
  </g>
  <g font-family="monospace" font-size="10">
    <text x="300" y="185" fill="#7dd3fc">Finding site</text>
    <text x="295" y="253" fill="#7dd3fc">Associated morphology</text>
    <text x="300" y="345" fill="#7dd3fc">Causative agent</text>
  </g>

  <g font-family="monospace" font-size="12" text-anchor="middle">
    <rect x="420" y="115" width="230" height="42" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="535" y="132" fill="#e0f2fe">Structure of lung</text>
    <text x="535" y="148" fill="#7dd3fc" font-size="10">(body structure)</text>

    <rect x="420" y="251" width="230" height="42" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="535" y="268" fill="#e0f2fe">Inflammation</text>
    <text x="535" y="284" fill="#7dd3fc" font-size="10">(morphologic abnormality)</text>

    <rect x="420" y="373" width="230" height="42" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="535" y="390" fill="#e0f2fe">Bacterium</text>
    <text x="535" y="406" fill="#7dd3fc" font-size="10">(organism)</text>
  </g>

  <!-- domain/range note -->
  <rect x="700" y="115" width="320" height="300" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="860" y="142" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="bold">domain / range</text>
  <text x="720" y="170" fill="#94a3b8" font-size="11">Each attribute has a fixed:</text>
  <text x="720" y="192" fill="#7dd3fc" font-size="11" font-family="monospace">domain</text>
  <text x="720" y="208" fill="#64748b" font-size="10">— which concepts may carry it</text>
  <text x="720" y="230" fill="#7dd3fc" font-size="11" font-family="monospace">range</text>
  <text x="720" y="246" fill="#64748b" font-size="10">— which concepts are valid values</text>
  <text x="720" y="278" fill="#94a3b8" font-size="10">e.g. |Finding site| ranges over</text>
  <text x="720" y="294" fill="#94a3b8" font-size="10">|body structure| and its</text>
  <text x="720" y="310" fill="#94a3b8" font-size="10">descendants only — an agent</text>
  <text x="720" y="326" fill="#94a3b8" font-size="10">cannot bind it to a random node.</text>
  <text x="720" y="358" fill="#f97316" font-size="10" font-weight="bold">Why RAG cares:</text>
  <text x="720" y="376" fill="#fdba74" font-size="10">an LLM extracting "treats" or</text>
  <text x="720" y="392" fill="#fdba74" font-size="10">"finding site" edges can be</text>
  <text x="720" y="408" fill="#fdba74" font-size="10">constrained to these domains —</text>
  <text x="720" y="424" fill="#fdba74" font-size="10">no more inventing relations.</text>

  <text x="30" y="470" fill="#64748b" font-size="11" font-family="monospace">polyhierarchy: IS-A can have multiple parents — one concept, several valid classifications</text>
  <line x1="30" y1="490" x2="1020" y2="490" stroke="#334155" stroke-width="1"/>
  <text x="525" y="508" fill="#475569" font-size="10" text-anchor="middle">original figure, modeled on the SNOMED CT concept model (SNOMED International documentation, docs.snomed.org)</text>
</svg>
