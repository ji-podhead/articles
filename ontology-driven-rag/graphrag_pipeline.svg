<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="656" viewBox="0 0 1200 656" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="656" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">GraphRAG pipeline - from triples to validated multi-hop answers</text>
<rect x="46" y="70" width="250" height="66" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="64" y="96" font-size="15" font-weight="bold" fill="#e6edf3">Documents</text>
<text x="64" y="117" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">text · manuals · charts</text>
<rect x="316" y="70" width="353" height="108" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="316" y="70" width="5" height="108" rx="2.5" fill="#60a5fa"/>
<text x="334" y="96" font-size="15" font-weight="bold" fill="#60a5fa">Entity/Relation Extraction</text>
<text x="334" y="117" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">constraint-based</text>
<text x="334" y="138" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">bound to ontology classes</text>
<text x="334" y="159" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">(Metformin) -[treats]-&gt; (Diabetes)</text>
<rect x="689" y="70" width="213" height="87" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="689" y="70" width="5" height="87" rx="2.5" fill="#4ade80"/>
<text x="707" y="96" font-size="15" font-weight="bold" fill="#4ade80">Knowledge Graph</text>
<text x="707" y="117" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">nodes + typed edges</text>
<text x="707" y="138" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">semantic enrichment</text>
<rect x="922" y="70" width="232" height="87" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="922" y="70" width="5" height="87" rx="2.5" fill="#60a5fa"/>
<text x="940" y="96" font-size="15" font-weight="bold" fill="#60a5fa">Leiden Communities</text>
<text x="940" y="117" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">cluster + summarize</text>
<text x="940" y="138" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">per abstraction level</text>
<rect x="409" y="202" width="167" height="87" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="409" y="202" width="5" height="87" rx="2.5" fill="#4ade80"/>
<text x="427" y="228" font-size="15" font-weight="bold" fill="#4ade80">Local Search</text>
<text x="427" y="249" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">multi-hop walk</text>
<text x="427" y="270" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">path-validated</text>
<rect x="596" y="202" width="195" height="87" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="596" y="202" width="5" height="87" rx="2.5" fill="#60a5fa"/>
<text x="614" y="228" font-size="15" font-weight="bold" fill="#60a5fa">Global Search</text>
<text x="614" y="249" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">cluster summaries</text>
<text x="614" y="270" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">corpus-wide Qs</text>
<rect x="438" y="313" width="325" height="66" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="438" y="313" width="5" height="66" rx="2.5" fill="#60a5fa"/>
<text x="456" y="339" font-size="15" font-weight="bold" fill="#60a5fa">Grounded, explainable answer</text>
<text x="456" y="360" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">retrieval path = evidence trail</text>
<rect x="410" y="403" width="380" height="129" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="428" y="429" font-size="15" font-weight="bold" fill="#e6edf3">Without ontology: agent walks</text>
<text x="428" y="450" font-size="15" font-weight="bold" fill="#e6edf3">impossible paths</text>
<text x="428" y="471" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">with ontology: constraint extraction + path</text>
<text x="428" y="492" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">validation</text>
<text x="428" y="513" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">→ no invalid conclusions</text>
<rect x="40" y="556" width="380" height="66" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
