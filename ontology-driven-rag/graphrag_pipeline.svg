<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="560" viewBox="0 0 1050 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="1050" height="560" fill="#0f172a"/>

  <text x="30" y="42" fill="#e2e8f0" font-size="20" font-weight="bold">GraphRAG pipeline — from triples to validated multi-hop answers</text>

  <!-- documents -->
  <rect x="30" y="250" width="130" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="95" y="275" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="bold">Documents</text>
  <text x="95" y="293" fill="#94a3b8" font-size="10" text-anchor="middle">text · manuals · charts</text>

  <!-- extraction -->
  <rect x="210" y="235" width="200" height="90" rx="10" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
  <text x="310" y="258" fill="#e0e7ff" font-size="13" text-anchor="middle" font-weight="bold">Entity/Relation Extraction</text>
  <text x="310" y="275" fill="#c7d2fe" font-size="10" text-anchor="middle">constraint-based</text>
  <text x="310" y="289" fill="#c7d2fe" font-size="10" text-anchor="middle">bound to ontology classes</text>
  <text x="310" y="307" fill="#c7d2fe" font-size="10" text-anchor="middle">(Metformin) -[treats]-&gt; (Diabetes)</text>

  <!-- knowledge graph -->
  <rect x="460" y="235" width="170" height="90" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="545" y="263" fill="#dcfce7" font-size="13" text-anchor="middle" font-weight="bold">Knowledge Graph</text>
  <text x="545" y="283" fill="#86efac" font-size="11" text-anchor="middle">nodes + typed edges</text>
  <text x="545" y="301" fill="#86efac" font-size="11" text-anchor="middle">semantic enrichment</text>

  <!-- leiden -->
  <rect x="680" y="235" width="170" height="90" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="765" y="263" fill="#e0f2fe" font-size="13" text-anchor="middle" font-weight="bold">Leiden Communities</text>
  <text x="765" y="283" fill="#7dd3fc" font-size="11" text-anchor="middle">cluster + summarize</text>
  <text x="765" y="301" fill="#7dd3fc" font-size="11" text-anchor="middle">per abstraction level</text>

  <g stroke="#475569" stroke-width="2.5" fill="none">
    <path d="M 160,280 L 210,280"/>
    <path d="M 410,280 L 460,280"/>
    <path d="M 630,280 L 680,280"/>
  </g>

  <!-- local search -->
  <path d="M 850,262 L 880,262 Q 895,262 895,240 L 895,150 Q 895,140 910,140 L 925,140" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <rect x="925" y="105" width="95" height="70" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
  <text x="972" y="130" fill="#4ade80" font-size="12" text-anchor="middle" font-weight="bold">Local Search</text>
  <text x="972" y="148" fill="#86efac" font-size="10" text-anchor="middle">multi-hop walk</text>
  <text x="972" y="163" fill="#86efac" font-size="10" text-anchor="middle">path-validated</text>

  <!-- global search -->
  <path d="M 850,298 L 880,298 Q 895,298 895,320 L 895,410 Q 895,420 910,420 L 925,420" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="925" y="385" width="95" height="70" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="972" y="410" fill="#7dd3fc" font-size="12" text-anchor="middle" font-weight="bold">Global Search</text>
  <text x="972" y="428" fill="#7dd3fc" font-size="10" text-anchor="middle">cluster summaries</text>
  <text x="972" y="443" fill="#7dd3fc" font-size="10" text-anchor="middle">corpus-wide Qs</text>

  <!-- failure note -->
  <rect x="210" y="360" width="420" height="60" rx="10" fill="#431407" stroke="#f97316" stroke-width="1.5"/>
  <text x="420" y="385" fill="#fdba74" font-size="12" text-anchor="middle" font-weight="bold">Without ontology: agent walks impossible paths</text>
  <text x="420" y="405" fill="#fdba74" font-size="11" text-anchor="middle">with ontology: constraint extraction + path validation → no invalid conclusions</text>

  <!-- answer -->
  <rect x="730" y="490" width="290" height="46" rx="8" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
  <text x="875" y="512" fill="#e0e7ff" font-size="12" text-anchor="middle" font-weight="bold">Grounded, explainable answer</text>
  <text x="875" y="528" fill="#a5b4fc" font-size="10" text-anchor="middle">retrieval path = evidence trail</text>

  <line x1="30" y1="540" x2="620" y2="540" stroke="#334155" stroke-width="1"/>
  <text x="325" y="556" fill="#475569" font-size="10" text-anchor="middle">adapted from Microsoft GraphRAG repository documentation (MIT)</text>
</svg>
