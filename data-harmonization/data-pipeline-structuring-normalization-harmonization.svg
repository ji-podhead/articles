<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="933" viewBox="0 0 1200 933" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="933" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">DATA PIPELINE: THREE DISTINCT DISCIPLINES</text>
<text x="40" y="100" font-size="17" fill="#8b949e">structuring → normalization → harmonization</text>
<rect x="40" y="106" width="356" height="528" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="40" y="106" width="5" height="528" rx="2.5" fill="#60a5fa"/>
<text x="58" y="132" font-size="15" font-weight="bold" fill="#60a5fa">1. STRUCTURING</text>
<text x="58" y="153" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">raw → readable format</text>
<text x="58" y="174" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="58" y="195" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">unstructured</text>
<text x="58" y="216" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">~@#)($&amp;</text>
<text x="58" y="237" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">xyz___??!!</text>
<text x="58" y="258" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">(((raw)))</text>
<text x="58" y="279" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="58" y="300" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">structured table</text>
<text x="58" y="321" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">| id | name | email |</text>
<text x="58" y="342" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">| 1 | Alice | a@x.com |</text>
<text x="58" y="363" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">| 2 | Bob | b@y.com |</text>
<text x="58" y="384" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">| 3 | Carol | c@z.com |</text>
<text x="58" y="405" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="58" y="426" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">WHY IT MATTERS</text>
<text x="58" y="447" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Machine-readable format for queries</text>
<text x="58" y="468" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="58" y="489" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="58" y="510" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="58" y="531" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="58" y="552" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="58" y="573" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="58" y="594" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="58" y="615" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<rect x="422" y="106" width="356" height="528" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="422" y="106" width="5" height="528" rx="2.5" fill="#60a5fa"/>
<text x="440" y="132" font-size="15" font-weight="bold" fill="#60a5fa">2. NORMALIZATION</text>
<text x="440" y="153" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">clean + deduplicate + rescale</text>
<text x="440" y="174" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="440" y="195" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">A. Database (1NF→2NF→3NF)</text>
<text x="440" y="216" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">1NF: atomic values, unique rows</text>
<text x="440" y="237" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">2NF: no partial dependencies</text>
<text x="440" y="258" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">3NF: no transitive dependencies</text>
<text x="440" y="279" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="440" y="300" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">B. Statistical / ML</text>
<text x="440" y="321" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Min-Max</text>
<text x="440" y="342" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">[0 .. 1]</text>
<text x="440" y="363" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Z-Score</text>
<text x="440" y="384" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">μ=0, σ=1</text>
<text x="440" y="405" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="440" y="426" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">EXAMPLE</text>
<text x="440" y="447" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Source A: DD/MM/YYYY → 2026-09-15</text>
<text x="440" y="468" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Source B: YYYY-MM-DD → 2026-09-15</text>
<text x="440" y="489" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">A:&quot;USA&quot; + B:&quot;United States&quot; → &quot;United</text>
<text x="440" y="510" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">States&quot;</text>
<text x="440" y="531" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">EUR ↔ USD → uniform scale</text>
<text x="440" y="552" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="440" y="573" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="440" y="594" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="440" y="615" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<rect x="804" y="106" width="356" height="507" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="804" y="106" width="5" height="507" rx="2.5" fill="#4ade80"/>
<text x="822" y="132" font-size="15" font-weight="bold" fill="#4ade80">3. HARMONIZATION</text>
<text x="822" y="153" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">multi-source → semantic unity</text>
<text x="822" y="174" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="822" y="195" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Source A</text>
<text x="822" y="216" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Source B</text>
<text x="822" y="237" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Source C</text>
<text x="822" y="258" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="822" y="279" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">UNIFIED VIEW</text>
<text x="822" y="300" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">✓ consistent schemas</text>
<text x="822" y="321" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">✓ uniform standards</text>
<text x="822" y="342" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">✓ semantic unity</text>
<text x="822" y="363" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">comparable + error-free</text>
<text x="822" y="384" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="822" y="405" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Integration</text>
<text x="822" y="426" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">data in one place</text>
<text x="822" y="447" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">(just gathering)</text>
<text x="822" y="468" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Harmonization</text>
<text x="822" y="489" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">+ resolves conflicts</text>
<text x="822" y="510" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">+ semantic unity</text>
<text x="822" y="531" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<text x="822" y="552" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">THE BOTTOM LINE</text>
<text x="822" y="573" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Don't just structure. Don't just normalize.</text>
<text x="822" y="594" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">Aim for HARMONIZATION.</text>
<text x="40" y="673" font-size="15" font-weight="bold" fill="#8b949e">THE LIFECYCLE: MULTI-SOURCE PIPELINE (cycles repeat)</text>
<rect x="40" y="711" width="265" height="87" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="40" y="711" width="5" height="87" rx="2.5" fill="#60a5fa"/>
<text x="58" y="737" font-size="15" font-weight="bold" fill="#60a5fa">INGESTION</text>
<text x="58" y="758" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">structuring (1st pass)</text>
<text x="58" y="779" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<rect x="325" y="711" width="265" height="66" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="325" y="711" width="5" height="66" rx="2.5" fill="#60a5fa"/>
<text x="343" y="737" font-size="15" font-weight="bold" fill="#60a5fa">TRANSFORMATION</text>
<text x="343" y="758" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">normalization (clean + scale)</text>
<rect x="610" y="711" width="265" height="87" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="610" y="711" width="5" height="87" rx="2.5" fill="#60a5fa"/>
<text x="628" y="737" font-size="15" font-weight="bold" fill="#60a5fa">LOADING</text>
<text x="628" y="758" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">structuring (2nd pass)</text>
<text x="628" y="779" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif"></text>
<rect x="895" y="711" width="265" height="87" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="895" y="711" width="5" height="87" rx="2.5" fill="#4ade80"/>
<text x="913" y="737" font-size="15" font-weight="bold" fill="#4ade80">HARMONIZATION</text>
<text x="913" y="758" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">all 3 combined, cycled per</text>
<text x="913" y="779" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">batch</text>
<text x="40" y="836" font-size="14" fill="#6e7681">↻ repeat per data batch</text>
<text x="40" y="886" font-size="13" fill="#6e7681">#DataEngineering #DataScience #DataHarmonization #MachineLearning #SystemArchitecture</text>
