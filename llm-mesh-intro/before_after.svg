<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" font-family="Helvetica, Arial, sans-serif">
  <rect width="1100" height="540" fill="#0f172a"/>

  <text x="550" y="40" fill="#e2e8f0" font-size="18" text-anchor="middle" font-weight="bold">Before / After — collapsing the N×M matrix</text>

  <!-- ===== BEFORE ===== -->
  <text x="60" y="82" fill="#f87171" font-size="14" font-weight="bold" font-family="monospace">BEFORE</text>
  <text x="620" y="82" fill="#fca5a5" font-size="13" font-family="monospace">N × M configs · N × M failure modes</text>

  <!-- app nodes -->
  <g font-size="13" fill="#e2e8f0">
    <rect x="60" y="100" width="130" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="125" y="126" text-anchor="middle">App A</text>
    <rect x="60" y="156" width="130" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="125" y="182" text-anchor="middle">App B</text>
    <rect x="60" y="212" width="130" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="125" y="238" text-anchor="middle">App C</text>
  </g>

  <!-- direct messy lines app->provider, each with its own key -->
  <g stroke="#7f1d1d" stroke-width="2">
    <line x1="190" y1="115" x2="640" y2="112"/>
    <line x1="190" y1="125" x2="640" y2="165"/>
    <line x1="190" y1="172" x2="640" y2="118"/>
    <line x1="190" y1="182" x2="640" y2="218"/>
    <line x1="190" y1="228" x2="640" y2="171"/>
    <line x1="190" y1="238" x2="640" y2="224"/>
  </g>
  <!-- key labels on the lines -->
  <g font-family="monospace" font-size="10" fill="#f87171">
    <text x="330" y="108">sk-…A1</text>
    <text x="470" y="140">gem-…B2</text>
    <text x="330" y="158">sk-…A2</text>
    <text x="470" y="200">gsk-…C1</text>
    <text x="330" y="222">ds-…C2</text>
    <text x="470" y="238">sk-…A3</text>
  </g>

  <!-- provider nodes -->
  <g font-size="12" fill="#e2e8f0">
    <rect x="640" y="98" width="170" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="725" y="120" text-anchor="middle">OpenAI</text>
    <rect x="640" y="150" width="170" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="725" y="172" text-anchor="middle">Gemini</text>
    <rect x="640" y="202" width="170" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="725" y="224" text-anchor="middle">Groq / DeepSeek / …</text>
  </g>
  <text x="880" y="120" fill="#94a3b8" font-size="11">each app: own keys,</text>
  <text x="880" y="136" fill="#94a3b8" font-size="11">own retry logic, own .env</text>

  <!-- divider -->
  <line x1="40" y1="270" x2="1060" y2="270" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- ===== AFTER ===== -->
  <text x="60" y="308" fill="#4ade80" font-size="14" font-weight="bold" font-family="monospace">AFTER</text>
  <text x="620" y="308" fill="#86efac" font-size="13" font-family="monospace">one OpenAI-compatible endpoint</text>

  <!-- apps -->
  <g font-size="13" fill="#e2e8f0">
    <rect x="60" y="330" width="130" height="40" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="125" y="355" text-anchor="middle">App A</text>
    <rect x="60" y="384" width="130" height="40" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="125" y="409" text-anchor="middle">App B</text>
    <rect x="60" y="438" width="130" height="40" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="125" y="463" text-anchor="middle">App C</text>
  </g>
  <!-- clean lines into hub -->
  <g stroke="#14532d" stroke-width="2.5">
    <line x1="190" y1="350" x2="320" y2="395"/>
    <line x1="190" y1="404" x2="320" y2="405"/>
    <line x1="190" y1="458" x2="320" y2="415"/>
  </g>
  <text x="230" y="340" fill="#4ade80" font-size="10" font-family="monospace">1 local key (or none)</text>

  <!-- mesh hub -->
  <rect x="320" y="340" width="330" height="130" rx="12" fill="#172554" stroke="#818cf8" stroke-width="2"/>
  <text x="485" y="368" fill="#e0e7ff" font-size="15" text-anchor="middle" font-weight="bold">LLM Mesh</text>
  <text x="485" y="392" fill="#a5b4fc" font-size="12" text-anchor="middle">keys · routing · fallback</text>
  <text x="485" y="412" fill="#a5b4fc" font-size="12" text-anchor="middle">budgets · analytics · security</text>
  <text x="485" y="442" fill="#818cf8" font-size="11" text-anchor="middle" font-family="monospace">one OpenAI-compatible endpoint</text>

  <!-- hub to providers -->
  <g stroke="#14532d" stroke-width="2.5">
    <line x1="650" y1="372" x2="760" y2="345"/>
    <line x1="650" y1="405" x2="760" y2="405"/>
    <line x1="650" y1="438" x2="760" y2="465"/>
  </g>
  <g font-size="12" fill="#e2e8f0">
    <rect x="760" y="328" width="160" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="840" y="350" text-anchor="middle">OpenAI</text>
    <rect x="760" y="388" width="160" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="840" y="410" text-anchor="middle">Gemini</text>
    <rect x="760" y="448" width="160" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="840" y="470" text-anchor="middle">Groq / DeepSeek / …</text>
  </g>
  <text x="955" y="345" fill="#86efac" font-size="11">keys live here,</text>
  <text x="955" y="361" fill="#86efac" font-size="11">in the vault —</text>
  <text x="955" y="377" fill="#86efac" font-size="11">never in apps</text>

  <line x1="40" y1="505" x2="1060" y2="505" stroke="#334155" stroke-width="1"/>
  <text x="550" y="524" fill="#475569" font-size="10" text-anchor="middle">jimesh open-source AI gateway · the hub pattern</text>
</svg>
