<svg xmlns="http://www.w3.org/2000/svg" width="1427" height="767" viewBox="0 0 1427 767" font-family="DejaVu Sans, Verdana, sans-serif">
<rect width="1427" height="767" fill="#0d1117"/>
<text x="30" y="52" font-size="30" font-weight="bold" fill="#ffffff">Five families of routing methods - they compose</text>
<rect x="30" y="104" width="349" height="45" fill="#1c2128" stroke="#30363d"/>
<text x="46" y="118" font-size="15" font-weight="bold" fill="#ffffff">Family</text>
<rect x="379" y="104" width="349" height="45" fill="#1c2128" stroke="#30363d"/>
<text x="395" y="118" font-size="15" font-weight="bold" fill="#ffffff">How it decides</text>
<rect x="728" y="104" width="339" height="45" fill="#1c2128" stroke="#30363d"/>
<text x="744" y="118" font-size="15" font-weight="bold" fill="#ffffff">Needs</text>
<rect x="1067" y="104" width="330" height="45" fill="#1c2128" stroke="#30363d"/>
<text x="1083" y="118" font-size="15" font-weight="bold" fill="#ffffff">Role in a mesh</text>
<rect x="30" y="149" width="349" height="87" fill="none" stroke="#30363d"/>
<text x="46" y="163" font-size="15" font-weight="bold" fill="#ffffff">Static</text>
<text x="46" y="184" font-size="15" font-weight="bold" fill="#ffffff">priority chains, weighted shuffle,</text>
<text x="46" y="205" font-size="15" font-weight="bold" fill="#ffffff">least-busy, latency-, cost-based</text>
<rect x="379" y="149" width="349" height="87" fill="none" stroke="#30363d"/>
<text x="395" y="163" font-size="15" fill="#c9d1d9">fixed rules - operator encodes the</text>
<text x="395" y="184" font-size="15" fill="#c9d1d9">policy; identical for every</text>
<text x="395" y="205" font-size="15" fill="#c9d1d9">request</text>
<rect x="728" y="149" width="339" height="87" fill="none" stroke="#30363d"/>
<text x="744" y="163" font-size="15" fill="#c9d1d9">nothing (config only)</text>
<rect x="1067" y="149" width="330" height="87" fill="none" stroke="#30363d"/>
<text x="1083" y="163" font-size="15" fill="#c9d1d9">the floor - fallback graph</text>
<text x="1083" y="184" font-size="15" fill="#c9d1d9">every mesh needs anyway</text>
<rect x="30" y="236" width="349" height="87" fill="#11161d"/>
<rect x="30" y="236" width="349" height="87" fill="none" stroke="#30363d"/>
<text x="46" y="250" font-size="15" font-weight="bold" fill="#ffffff">Learned</text>
<text x="46" y="271" font-size="15" font-weight="bold" fill="#ffffff">bandits from outcome feedback</text>
<text x="46" y="292" font-size="15" font-weight="bold" fill="#ffffff">(with decay) · trained routers</text>
<rect x="379" y="236" width="349" height="87" fill="#11161d"/>
<rect x="379" y="236" width="349" height="87" fill="none" stroke="#30363d"/>
<text x="395" y="250" font-size="15" fill="#c9d1d9">which provider:model served</text>
<text x="395" y="271" font-size="15" fill="#c9d1d9">similar</text>
<text x="395" y="292" font-size="15" fill="#c9d1d9">traffic reliably, fast - lately?</text>
<rect x="728" y="236" width="339" height="87" fill="#11161d"/>
<rect x="728" y="236" width="339" height="87" fill="none" stroke="#30363d"/>
<text x="744" y="250" font-size="15" fill="#c9d1d9">outcome stream (bandit), or</text>
<text x="744" y="271" font-size="15" fill="#c9d1d9">preference data (RouteLLM)</text>
<rect x="1067" y="236" width="330" height="87" fill="#11161d"/>
<rect x="1067" y="236" width="330" height="87" fill="none" stroke="#30363d"/>
<text x="1083" y="250" font-size="15" fill="#c9d1d9">provider selection within</text>
<text x="1083" y="271" font-size="15" fill="#c9d1d9">the chain nodes</text>
<rect x="30" y="323" width="349" height="87" fill="none" stroke="#30363d"/>
<text x="46" y="337" font-size="15" font-weight="bold" fill="#ffffff">Content-aware cascade</text>
<text x="46" y="358" font-size="15" font-weight="bold" fill="#ffffff">FrugalGPT scorer · entropy gates</text>
<text x="46" y="379" font-size="15" font-weight="bold" fill="#ffffff">reading the model's own logprobs</text>
<rect x="379" y="323" width="349" height="87" fill="none" stroke="#30363d"/>
<text x="395" y="337" font-size="15" fill="#c9d1d9">look at the request or the cheap</text>
<text x="395" y="358" font-size="15" fill="#c9d1d9">answer: confident? serve. else</text>
<text x="395" y="379" font-size="15" fill="#c9d1d9">escalate</text>
<rect x="728" y="323" width="339" height="87" fill="none" stroke="#30363d"/>
<text x="744" y="337" font-size="15" fill="#c9d1d9">labeled data (scorer) or</text>
<text x="744" y="358" font-size="15" fill="#c9d1d9">logprobs-capable provider (gate)</text>
<rect x="1067" y="323" width="330" height="87" fill="none" stroke="#30363d"/>
<text x="1083" y="337" font-size="15" fill="#c9d1d9">cost gate in front of the chain:</text>
<text x="1083" y="358" font-size="15" fill="#c9d1d9">decide whether to spend at all</text>
<rect x="30" y="410" width="349" height="108" fill="#11161d"/>
<rect x="30" y="410" width="349" height="108" fill="none" stroke="#30363d"/>
<text x="46" y="424" font-size="15" font-weight="bold" fill="#ffffff">kNN / similarity</text>
<text x="46" y="445" font-size="15" font-weight="bold" fill="#ffffff">embed the prompt, find nearest</text>
<text x="46" y="466" font-size="15" font-weight="bold" fill="#ffffff">historical prompts (semantic</text>
<text x="46" y="487" font-size="15" font-weight="bold" fill="#ffffff">router)</text>
<rect x="379" y="410" width="349" height="108" fill="#11161d"/>
<rect x="379" y="410" width="349" height="108" fill="none" stroke="#30363d"/>
<text x="395" y="424" font-size="15" fill="#c9d1d9">&quot;which model served prompts like</text>
<text x="395" y="445" font-size="15" fill="#c9d1d9">this</text>
<text x="395" y="466" font-size="15" fill="#c9d1d9">well and cheap?&quot; - your traffic is</text>
<text x="395" y="487" font-size="15" fill="#c9d1d9">the classifier</text>
<rect x="728" y="410" width="339" height="108" fill="#11161d"/>
<rect x="728" y="410" width="339" height="108" fill="none" stroke="#30363d"/>
<text x="744" y="424" font-size="15" fill="#c9d1d9">embedding calls (cheap) + history</text>
<text x="744" y="445" font-size="15" fill="#c9d1d9">store; cold start needs seeds</text>
<rect x="1067" y="410" width="330" height="108" fill="#11161d"/>
<rect x="1067" y="410" width="330" height="108" fill="none" stroke="#30363d"/>
<text x="1083" y="424" font-size="15" fill="#c9d1d9">cache-like routing memory;</text>
<text x="1083" y="445" font-size="15" fill="#c9d1d9">great for repeated workloads</text>
<rect x="30" y="518" width="349" height="129" fill="none" stroke="#30363d"/>
<text x="46" y="532" font-size="15" font-weight="bold" fill="#ffffff">Mesh / graph routing</text>
<text x="46" y="553" font-size="15" font-weight="bold" fill="#ffffff">models as nodes, chains, pools and</text>
<text x="46" y="574" font-size="15" font-weight="bold" fill="#ffffff">fallback edges as the graph</text>
<rect x="379" y="518" width="349" height="129" fill="none" stroke="#30363d"/>
<text x="395" y="532" font-size="15" fill="#c9d1d9">failover walks the graph, not a</text>
<text x="395" y="553" font-size="15" fill="#c9d1d9">list;</text>
<text x="395" y="574" font-size="15" fill="#c9d1d9">a &quot;model&quot; your app picks can</text>
<text x="395" y="595" font-size="15" fill="#c9d1d9">itself be</text>
<text x="395" y="616" font-size="15" fill="#c9d1d9">a whole sub-routing policy</text>
<rect x="728" y="518" width="339" height="129" fill="none" stroke="#30363d"/>
<text x="744" y="532" font-size="15" fill="#c9d1d9">nothing - structure only</text>
<rect x="1067" y="518" width="330" height="129" fill="none" stroke="#30363d"/>
<text x="1083" y="532" font-size="15" fill="#c9d1d9">the skeleton the other four</text>
<text x="1083" y="553" font-size="15" fill="#c9d1d9">families live inside</text>
<rect x="30" y="647" width="349" height="108" fill="#11161d"/>
<rect x="30" y="647" width="349" height="108" fill="none" stroke="#30363d"/>
<text x="46" y="661" font-size="15" font-weight="bold" fill="#ffffff">RouteLLM arXiv:2406.18665 ·</text>
<text x="46" y="682" font-size="15" font-weight="bold" fill="#ffffff">FrugalGPT arXiv:2305.05176 ·</text>
<text x="46" y="703" font-size="15" font-weight="bold" fill="#ffffff">entropy gate: previous article in</text>
<text x="46" y="724" font-size="15" font-weight="bold" fill="#ffffff">this series</text>
<rect x="379" y="647" width="349" height="108" fill="#11161d"/>
<rect x="379" y="647" width="349" height="108" fill="none" stroke="#30363d"/>
<text x="395" y="661" font-size="15" fill="#c9d1d9"></text>
<rect x="728" y="647" width="339" height="108" fill="#11161d"/>
<rect x="728" y="647" width="339" height="108" fill="none" stroke="#30363d"/>
<text x="744" y="661" font-size="15" fill="#c9d1d9"></text>
<rect x="1067" y="647" width="330" height="108" fill="#11161d"/>
<rect x="1067" y="647" width="330" height="108" fill="none" stroke="#30363d"/>
<text x="1083" y="661" font-size="15" fill="#c9d1d9"></text>
</svg>