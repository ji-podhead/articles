<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif">
  <rect width="1100" height="600" fill="#0f172a"/>

  <text x="550" y="42" fill="#e2e8f0" font-size="18" text-anchor="middle" font-weight="bold">Five families of routing methods — they compose</text>

  <!-- header -->
  <rect x="40" y="70" width="230" height="46" fill="#1e293b"/>
  <text x="60" y="99" fill="#e2e8f0" font-size="14" font-weight="bold">Family</text>
  <rect x="270" y="70" width="330" height="46" fill="#1e293b"/>
  <text x="290" y="99" fill="#e2e8f0" font-size="14" font-weight="bold">How it decides</text>
  <rect x="600" y="70" width="240" height="46" fill="#1e293b"/>
  <text x="620" y="99" fill="#e2e8f0" font-size="14" font-weight="bold">Needs</text>
  <rect x="840" y="70" width="220" height="46" fill="#1e293b"/>
  <text x="860" y="99" fill="#e2e8f0" font-size="14" font-weight="bold">Role in a mesh</text>

  <!-- row 1: static -->
  <rect x="40" y="116" width="230" height="88" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="60" y="148" fill="#f1f5f9" font-size="13" font-weight="bold">Static</text>
  <text x="60" y="168" fill="#94a3b8" font-size="11">priority chains, weighted shuffle,</text>
  <text x="60" y="184" fill="#94a3b8" font-size="11">least-busy, latency-, cost-based</text>
  <rect x="270" y="116" width="330" height="88" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="290" y="148" fill="#f1f5f9" font-size="12">fixed rules — operator encodes the</text>
  <text x="290" y="168" fill="#94a3b8" font-size="12">policy; identical for every request</text>
  <rect x="600" y="116" width="240" height="88" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="620" y="152" fill="#86efac" font-size="12">nothing (config only)</text>
  <rect x="840" y="116" width="220" height="88" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="860" y="152" fill="#94a3b8" font-size="12">the floor — fallback graph</text>
  <text x="860" y="172" fill="#94a3b8" font-size="12">every mesh needs anyway</text>

  <!-- row 2: learned -->
  <rect x="40" y="204" width="230" height="88" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="60" y="236" fill="#f1f5f9" font-size="13" font-weight="bold">Learned</text>
  <text x="60" y="256" fill="#94a3b8" font-size="11">bandits from outcome feedback</text>
  <text x="60" y="272" fill="#94a3b8" font-size="11">(with decay) · trained routers</text>
  <rect x="270" y="204" width="330" height="88" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="290" y="236" fill="#f1f5f9" font-size="12">which provider:model served similar</text>
  <text x="290" y="256" fill="#94a3b8" font-size="12">traffic reliably, fast — lately?</text>
  <rect x="600" y="204" width="240" height="88" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="620" y="240" fill="#fbbf24" font-size="12">outcome stream (bandit), or</text>
  <text x="620" y="260" fill="#fbbf24" font-size="12">preference data (RouteLLM)</text>
  <rect x="840" y="204" width="220" height="88" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="860" y="240" fill="#94a3b8" font-size="12">provider selection within</text>
  <text x="860" y="260" fill="#94a3b8" font-size="12">the chain nodes</text>

  <!-- row 3: content-aware -->
  <rect x="40" y="292" width="230" height="88" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="60" y="324" fill="#f1f5f9" font-size="13" font-weight="bold">Content-aware cascade</text>
  <text x="60" y="344" fill="#94a3b8" font-size="11">FrugalGPT scorer · entropy gates</text>
  <text x="60" y="360" fill="#94a3b8" font-size="11">reading the model's own logprobs</text>
  <rect x="270" y="292" width="330" height="88" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="290" y="324" fill="#f1f5f9" font-size="12">look at the request or the cheap</text>
  <text x="290" y="344" fill="#94a3b8" font-size="12">answer: confident? serve. else escalate</text>
  <rect x="600" y="292" width="240" height="88" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="620" y="328" fill="#fbbf24" font-size="12">labeled data (scorer) or</text>
  <text x="620" y="348" fill="#fbbf24" font-size="12">logprobs-capable provider (gate)</text>
  <rect x="840" y="292" width="220" height="88" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="860" y="328" fill="#94a3b8" font-size="12">cost gate in front of the chain:</text>
  <text x="860" y="348" fill="#94a3b8" font-size="12">decide whether to spend at all</text>

  <!-- row 4: kNN -->
  <rect x="40" y="380" width="230" height="88" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="60" y="412" fill="#f1f5f9" font-size="13" font-weight="bold">kNN / similarity</text>
  <text x="60" y="432" fill="#94a3b8" font-size="11">embed the prompt, find nearest</text>
  <text x="60" y="448" fill="#94a3b8" font-size="11">historical prompts (semantic router)</text>
  <rect x="270" y="380" width="330" height="88" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="290" y="412" fill="#f1f5f9" font-size="12">"which model served prompts like this</text>
  <text x="290" y="432" fill="#94a3b8" font-size="12">well and cheap?" — your traffic is</text>
  <text x="290" y="452" fill="#94a3b8" font-size="12">the classifier</text>
  <rect x="600" y="380" width="240" height="88" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="620" y="416" fill="#fbbf24" font-size="12">embedding calls (cheap) + history</text>
  <text x="620" y="436" fill="#fbbf24" font-size="12">store; cold start needs seeds</text>
  <rect x="840" y="380" width="220" height="88" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="860" y="416" fill="#94a3b8" font-size="12">cache-like routing memory;</text>
  <text x="860" y="436" fill="#94a3b8" font-size="12">great for repeated workloads</text>

  <!-- row 5: mesh/graph -->
  <rect x="40" y="468" width="230" height="88" fill="#172554" stroke="#818cf8" stroke-width="2"/>
  <text x="60" y="500" fill="#e0e7ff" font-size="13" font-weight="bold">Mesh / graph routing</text>
  <text x="60" y="520" fill="#a5b4fc" font-size="11">models as nodes, chains, pools and</text>
  <text x="60" y="536" fill="#a5b4fc" font-size="11">fallback edges as the graph</text>
  <rect x="270" y="468" width="330" height="88" fill="#172554" stroke="#818cf8" stroke-width="2"/>
  <text x="290" y="500" fill="#e0e7ff" font-size="12">failover walks the graph, not a list;</text>
  <text x="290" y="520" fill="#a5b4fc" font-size="12">a "model" your app picks can itself be</text>
  <text x="290" y="540" fill="#a5b4fc" font-size="12">a whole sub-routing policy</text>
  <rect x="600" y="468" width="240" height="88" fill="#172554" stroke="#818cf8" stroke-width="2"/>
  <text x="620" y="504" fill="#86efac" font-size="12">nothing — structure only</text>
  <rect x="840" y="468" width="220" height="88" fill="#172554" stroke="#818cf8" stroke-width="2"/>
  <text x="860" y="504" fill="#a5b4fc" font-size="12">the skeleton the other four</text>
  <text x="860" y="524" fill="#a5b4fc" font-size="12">families live inside</text>

  <line x1="40" y1="576" x2="1060" y2="576" stroke="#334155" stroke-width="1"/>
  <text x="550" y="592" fill="#475569" font-size="10" text-anchor="middle">RouteLLM arXiv:2406.18665 · FrugalGPT arXiv:2305.05176 · entropy gate: previous article in this series</text>
</svg>
