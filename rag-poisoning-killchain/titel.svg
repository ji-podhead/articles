<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="60%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M 0,75 L 1200,75 M 0,150 L 1200,150 M 0,225 L 1200,225 M 0,300 L 1200,300 M 0,375 L 1200,375 M 0,450 L 1200,450 M 0,525 L 1200,525 M 0,600 L 1200,600"/>
    <path d="M 150,0 L 150,675 M 300,0 L 300,675 M 450,0 L 450,675 M 600,0 L 600,675 M 750,0 L 750,675 M 900,0 L 900,675 M 1050,0 L 1050,675"/>
  </g>

  <g opacity="0.15">
    <circle cx="950" cy="337" r="280" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="12,6"/>
    <circle cx="950" cy="337" r="200" fill="none" stroke="#f43f5e" stroke-width="4"/>
    <circle cx="950" cy="337" r="120" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4,4"/>
  </g>

  <!-- left: typography -->
  <g transform="translate(90, 135)">
    <rect x="0" y="0" width="200" height="30" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="1"/>
    <text x="100" y="19" fill="#fdba74" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1" text-anchor="middle">KILL CHAIN</text>

    <text x="0" y="70" fill="#ffffff" font-weight="900" font-size="38" letter-spacing="-1">From an Open Port</text>
    <text x="0" y="118" fill="url(#accentGrad)" font-weight="900" font-size="38" letter-spacing="-1">to Agent Takeover</text>

    <text x="0" y="160" fill="#94a3b8" font-size="18">RAG poisoning, token glitches and malicious skills</text>
    <text x="0" y="185" fill="#94a3b8" font-size="18">are three different faults — until one chain links them.</text>

    <g transform="translate(0, 228)" font-family="monospace" font-size="13" fill="#64748b">
      <text x="0" y="0"><tspan fill="#f87171">1 </tspan>misconfiguration → RCE on the host</text>
      <text x="0" y="26"><tspan fill="#fb923c">2 </tspan>.env read → provider keys stolen</text>
      <text x="0" y="52"><tspan fill="#f43f5e">3 </tspan>skill injected → agent executes on trigger</text>
    </g>
  </g>

  <!-- right motif: a 4-link chain, last link broken/red -->
  <g transform="translate(950, 337)">
    <g fill="none" stroke-width="10" stroke-linecap="round">
      <ellipse cx="-150" cy="-60" rx="55" ry="34" stroke="#38bdf8" transform="rotate(-20 -150 -60)"/>
      <ellipse cx="-40" cy="0" rx="55" ry="34" stroke="#818cf8" transform="rotate(20 -40 0)"/>
      <ellipse cx="80" cy="20" rx="55" ry="34" stroke="#f97316" transform="rotate(-15 80 20)"/>
      <path d="M 155,90 A 55,34 0 1 1 220,50" stroke="#f43f5e" transform="rotate(20 190 55)"/>
      <path d="M 225,10 L 260,-25 M 260,10 L 225,-25" stroke="#f43f5e" stroke-width="8"/>
    </g>
  </g>

  <!-- bottom-left: mesh-cube mark + wordmark -->
  <g color="#94a3b8">
    <g transform="translate(145, 592) scale(0.12)">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <g stroke-width="4" stroke-dasharray="8 5" opacity="0.55">
          <line x1="0" y1="-150" x2="0" y2="-240"/>
          <line x1="130" y1="-75" x2="208" y2="-120"/>
          <line x1="130" y1="75" x2="208" y2="120"/>
          <line x1="0" y1="150" x2="0" y2="240"/>
          <line x1="-130" y1="75" x2="-208" y2="120"/>
          <line x1="-130" y1="-75" x2="-208" y2="-120"/>
        </g>
        <g stroke-width="3">
          <circle cx="0" cy="-240" r="8"/>
          <circle cx="208" cy="-120" r="8"/>
          <circle cx="208" cy="120" r="8"/>
          <circle cx="0" cy="240" r="8"/>
          <circle cx="-208" cy="120" r="8"/>
          <circle cx="-208" cy="-120" r="8"/>
        </g>
        <g stroke-width="2.5" stroke-dasharray="6 4" opacity="0.35">
          <line x1="0" y1="0" x2="0" y2="-150"/>
          <line x1="0" y1="0" x2="-130" y2="75"/>
          <line x1="0" y1="0" x2="130" y2="75"/>
        </g>
        <g stroke-width="8">
          <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75"/>
          <line x1="0" y1="0" x2="130" y2="-75"/>
          <line x1="0" y1="0" x2="-130" y2="-75"/>
        </g>
      </g>
    </g>
    <text x="190" y="598" fill="#94a3b8" font-size="17" font-weight="900" letter-spacing="4">JIMESH</text>
  </g>
</svg>
