<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="434" viewBox="0 0 1200 434" font-family="'Space Grotesk', DejaVu Sans, Verdana, sans-serif">
<rect width="1200" height="434" fill="#0d1117"/>
<text x="40" y="54" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">Fuzzy sets: reasoning with degrees of truth</text>
<rect x="260" y="70" width="176" height="87" rx="11" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
<rect x="260" y="70" width="5" height="87" rx="2.5" fill="#60a5fa"/>
<text x="278" y="96" font-size="15" font-weight="bold" fill="#60a5fa">cold</text>
<text x="278" y="117" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">1.0 up to 12 °C</text>
<text x="278" y="138" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">0 from 22 °C</text>
<rect x="456" y="70" width="297" height="87" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="456" y="70" width="5" height="87" rx="2.5" fill="#4ade80"/>
<text x="474" y="96" font-size="15" font-weight="bold" fill="#4ade80">warm</text>
<text x="474" y="117" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">0 at 15 °C, full 22 to 28 °C</text>
<text x="474" y="138" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">back to 0 at 35 °C</text>
<rect x="773" y="70" width="167" height="87" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="791" y="96" font-size="15" font-weight="bold" fill="#e6edf3">hot</text>
<text x="791" y="117" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">0 up to 30 °C</text>
<text x="791" y="138" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">1.0 from 38 °C</text>
<rect x="261" y="181" width="325" height="87" rx="11" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
<rect x="261" y="181" width="5" height="87" rx="2.5" fill="#4ade80"/>
<text x="279" y="207" font-size="15" font-weight="bold" fill="#4ade80">IF temp IS warm AND rising</text>
<text x="279" y="228" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">THEN reduce heating slightly</text>
<text x="279" y="249" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">fires at degree 0.72 - no cliff</text>
<rect x="606" y="181" width="334" height="87" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="624" y="207" font-size="15" font-weight="bold" fill="#e6edf3">no hard threshold:</text>
<text x="624" y="228" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">19°C is 60% warm,</text>
<text x="624" y="249" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">28% cold - rules blend by degree</text>
<rect x="40" y="292" width="380" height="108" rx="11" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="58" y="318" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">membership: 0 · 0.25 · 0.5 · 0.75 · 1.0</text>
<text x="58" y="339" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">temperature (°C): 0 · 10 · 20 · 30 · 40</text>
<text x="58" y="360" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">original figure · fuzzy logic after Zadeh 1965 ·</text>
<text x="58" y="381" font-size="15" fill="#c9d1d9" font-family="'Space Grotesk', 'DejaVu Sans', Verdana, sans-serif">degrees instead of two states</text>
</svg>