<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="480" viewBox="0 0 1050 480" font-family="Helvetica, Arial, sans-serif">
  <rect width="1050" height="480" fill="#0f172a"/>

  <text x="30" y="42" fill="#e2e8f0" font-size="20" font-weight="bold">Fuzzy sets: reasoning with degrees of truth</text>

  <!-- grid -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="80" y1="158" x2="820" y2="158"/>
    <line x1="80" y1="225" x2="820" y2="225"/>
    <line x1="80" y1="293" x2="820" y2="293"/>
    <line x1="265" y1="90" x2="265" y2="360"/>
    <line x1="450" y1="90" x2="450" y2="360"/>
    <line x1="635" y1="90" x2="635" y2="360"/>
  </g>

  <!-- axes -->
  <line x1="80" y1="90" x2="80" y2="360" stroke="#475569" stroke-width="2"/>
  <line x1="80" y1="360" x2="820" y2="360" stroke="#475569" stroke-width="2"/>
  <g font-family="monospace" font-size="11" fill="#64748b">
    <text x="72" y="94" text-anchor="end">1.0</text>
    <text x="72" y="162" text-anchor="end">0.75</text>
    <text x="72" y="229" text-anchor="end">0.5</text>
    <text x="72" y="297" text-anchor="end">0.25</text>
    <text x="72" y="364" text-anchor="end">0</text>
    <text x="80" y="380" text-anchor="middle">0</text>
    <text x="265" y="380" text-anchor="middle">10</text>
    <text x="450" y="380" text-anchor="middle">20</text>
    <text x="635" y="380" text-anchor="middle">30</text>
    <text x="820" y="380" text-anchor="middle">40</text>
    <text x="450" y="402" text-anchor="middle" fill="#94a3b8">temperature (°C)</text>
    <text x="40" y="230" fill="#94a3b8" transform="rotate(-90 40 230)" text-anchor="middle">membership</text>
  </g>

  <!-- membership functions -->
  <polyline points="80,90 302,90 487,360 820,360" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <polyline points="358,360 487,90 598,90 728,360 820,360" fill="none" stroke="#22c55e" stroke-width="3"/>
  <polyline points="80,360 635,360 783,90 820,90" fill="none" stroke="#f97316" stroke-width="3"/>

  <g font-family="monospace" font-size="12">
    <text x="150" y="80" fill="#38bdf8">cold</text>
    <text x="525" y="80" fill="#4ade80">warm</text>
    <text x="795" y="80" fill="#fb923c">hot</text>
  </g>

  <!-- rule box -->
  <rect x="850" y="90" width="170" height="150" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <g font-family="monospace" font-size="10" fill="#94a3b8">
    <text x="862" y="115" fill="#4ade80" font-weight="bold">IF temp IS warm</text>
    <text x="862" y="132" fill="#4ade80" font-weight="bold">AND rising</text>
    <text x="862" y="155">THEN reduce</text>
    <text x="862" y="171">heating slightly</text>
    <text x="862" y="196" fill="#4ade80">fires at degree</text>
    <text x="862" y="212" fill="#4ade80">0.72 — no cliff</text>
  </g>
  <rect x="850" y="260" width="170" height="100" rx="10" fill="#312e81" stroke="#818cf8" stroke-width="1.5"/>
  <g font-family="monospace" font-size="10" fill="#c7d2fe">
    <text x="862" y="285">no hard threshold:</text>
    <text x="862" y="303">19°C is 60% warm,</text>
    <text x="862" y="321">28% cold — rules</text>
    <text x="862" y="339">blend by degree</text>
  </g>

  <!-- the reading above is not decorative: it is the actual crossing at x=435 -->
  <line x1="435" y1="90" x2="435" y2="360" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="435" cy="199" r="5" fill="#22c55e"/>
  <circle cx="435" cy="284" r="5" fill="#38bdf8"/>

  <line x1="30" y1="440" x2="1020" y2="440" stroke="#334155" stroke-width="1"/>
  <text x="525" y="460" fill="#475569" font-size="10" text-anchor="middle">original figure · fuzzy logic after Zadeh 1965 · degrees instead of two states</text>
</svg>
