<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="480" viewBox="0 0 1050 480" font-family="Helvetica, Arial, sans-serif">
  <rect width="1050" height="480" fill="#0f172a"/>

  <text x="30" y="42" fill="#e2e8f0" font-size="20" font-weight="bold">Knowledge-based AI, 1965 → 2026 — the ideas never left</text>

  <line x1="60" y1="240" x2="990" y2="240" stroke="#475569" stroke-width="3"/>

  <g font-family="monospace" font-size="11">
    <circle cx="110" cy="240" r="9" fill="#f97316"/>
    <text x="110" y="210" fill="#fdba74" text-anchor="middle" font-weight="bold">1965</text>
    <text x="110" y="270" fill="#94a3b8" text-anchor="middle">Zadeh: fuzzy sets</text>
    <text x="110" y="286" fill="#64748b" text-anchor="middle">degrees of truth</text>

    <circle cx="270" cy="240" r="9" fill="#818cf8"/>
    <text x="270" y="160" fill="#a5b4fc" text-anchor="middle" font-weight="bold">1970s</text>
    <text x="270" y="180" fill="#94a3b8" text-anchor="middle">DENDRAL · MYCIN</text>
    <text x="270" y="196" fill="#64748b" text-anchor="middle">expert systems born</text>

    <circle cx="430" cy="240" r="9" fill="#818cf8"/>
    <text x="430" y="210" fill="#a5b4fc" text-anchor="middle" font-weight="bold">1980s</text>
    <text x="430" y="270" fill="#94a3b8" text-anchor="middle">Lisp machines · XCON</text>
    <text x="430" y="286" fill="#64748b" text-anchor="middle">XPS boom → bottleneck</text>

    <circle cx="590" cy="240" r="9" fill="#38bdf8"/>
    <text x="590" y="160" fill="#7dd3fc" text-anchor="middle" font-weight="bold">1995</text>
    <text x="590" y="180" fill="#94a3b8" text-anchor="middle">Wooldridge: agents</text>
    <text x="590" y="196" fill="#64748b" text-anchor="middle">autonomy defined</text>

    <circle cx="750" cy="240" r="9" fill="#38bdf8"/>
    <text x="750" y="210" fill="#7dd3fc" text-anchor="middle" font-weight="bold">2017+</text>
    <text x="750" y="270" fill="#94a3b8" text-anchor="middle">transformers · LLMs</text>
    <text x="750" y="286" fill="#64748b" text-anchor="middle">knowledge returns, implicit</text>

    <circle cx="910" cy="240" r="11" fill="#22c55e"/>
    <circle cx="910" cy="240" r="20" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.5"/>
    <text x="910" y="160" fill="#4ade80" text-anchor="middle" font-weight="bold">2022 →</text>
    <text x="910" y="180" fill="#94a3b8" text-anchor="middle">ReAct · agentic RAG</text>
    <text x="910" y="196" fill="#4ade80" text-anchor="middle">KB + verifier, explicit again</text>
  </g>

  <rect x="60" y="340" width="930" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="525" y="366" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="bold">The constant: knowledge base + inference machine</text>
  <text x="525" y="386" fill="#94a3b8" font-size="11" text-anchor="middle">rule base → curated vector collection · rule interpreter → evidence verifier · acquisition bottleneck → LLM ingest pipelines</text>

  <line x1="60" y1="440" x2="990" y2="440" stroke="#334155" stroke-width="1"/>
  <text x="525" y="460" fill="#475569" font-size="10" text-anchor="middle">hallucination is the grounding problem of 1980 — verification is still the fix</text>
</svg>
